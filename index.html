"],"score":"Branded 2–1","status":"complete","detailLevel":"full","context":["Toon Turbo uses its user-submitted Fusion/Link Extra Deck rather than stopping at a Main Deck Toon board.","Branded attempts to separate Toon World the Perfect World from the Toon monsters before using Super Polymerization.","The match turns on whether Mind Scan can preemptively suppress Branded Fusion and whether Phara can protect Branded Fusion's activation window."],"games":[{"title":"Game 1","winner":"Toon Turbo","firstPlayer":"Toon Turbo","openingHands":{"Toon Turbo":["Funny Dark Rabbit","Comic Cat","Evil Box","Toon Dark Magician","Mind Scan"],"Branded":["Aluber the Jester of Despia","Branded Fusion","Super Polymerization","The Fallen & The Virtuous","Phara the Primordial Goddess"]},"turns":[{"title":"Turn 1 — Toon Turbo","lp":"Toon Turbo 8000 — Branded 8000","actions":["Funny Dark Rabbit is Normal Summoned. It establishes Toon World the Perfect World and grants an additional Normal Summon.","The additional Normal Summon is used for Comic Cat.","Evil Box Special Summons itself because Toon World is active and Sets Toon Terror from the Deck.","Perfect World searches Toon Dark Magician.","Toon Dark Magician enters through the Toon engine and accesses the Deck's Fusion package, producing Dark Magician of Destruction.","Dark Magician of Destruction adds a Toon-compatible Dark Magician support card.","Evil Box and the remaining extender become I:P Masquerena.","Toon Turbo Sets Mind Scan and Toon Terror."],"audit":"The deck uses the Extra Deck on Turn 1 but does not overcommit to Blue-Eyes Toon Ultimate Dragon. Dark Magician of Destruction replaces itself with a search, and I:P preserves flexible interaction.","endBoard":"Toon Turbo: Dark Magician of Destruction, Comic Cat, I:P Masquerena, Perfect World, Set Mind Scan, Set Toon Terror."},{"title":"Turn 2 — Branded","lp":"Toon Turbo 8000 — Branded 8000","actions":["During the Standby Phase, Toon Turbo activates Mind Scan and reveals Branded's hand.","Mind Scan declares Branded Fusion before Branded Fusion is activated. Its activated effects are negated for the turn.","Branded Normal Summons Aluber and activates its search effect.","Comic Cat Tributes Aluber as cost and Special Summons Funny Dark Rabbit from the Deck.","Aluber's already-activated effect resolves and adds Branded Retribution.","Branded activates The Fallen & The Virtuous targeting Perfect World for destruction.","Toon Turbo chains Toon Terror, negating and destroying the Quick-Play Spell.","Branded Fusion is now blanked by Mind Scan. Branded Sets Super Polymerization and Retribution.","During the End Phase, I:P Masquerena uses itself and Funny Dark Rabbit to Link Summon S:P Little Knight. Because a Link Monster was used as material, S:P banishes Super Polymerization until the next End Phase."],"audit":"Comic Cat removes Aluber as a cost, so Branded cannot protect it by chaining. S:P is saved for the End Phase, when its temporary banish removes the unchainable Super Polymerization before Toon begins its next turn.","endBoard":"Toon Turbo: Dark Magician of Destruction, Comic Cat, S:P Little Knight, Perfect World. Branded: Set Retribution; Branded Fusion and Phara in hand."},{"title":"Turn 3 — Toon Turbo","lp":"Toon Turbo 8000 — Branded 0","actions":["Perfect World searches Evil Box. Evil Box Special Summons itself and Sets another Toon Trap.","Comic Cat Tributes itself and Special Summons Toon Dark Magician from the Deck.","The Toon Fusion line converts Toon Dark Magician and the available Toon material into Blue-Eyes Toon Ultimate Dragon.","S:P Little Knight removes Branded's remaining Set card.","Dark Magician of Destruction, Blue-Eyes Toon Ultimate Dragon, Evil Box, and the remaining Toon attacker produce lethal damage."],"audit":"The large Fusion Monster is introduced only after Super Polymerization is temporarily banished. S:P clears the remaining back row before Toon commits to combat.","endBoard":"Toon Turbo wins Game 1."}],"decidingFactor":"Mind Scan turns off Branded Fusion, Comic Cat removes Aluber without targeting or destroying it, and S:P temporarily removes Super Polymerization before the Toon Fusion line."},{"title":"Game 2","winner":"Branded","firstPlayer":"Branded","sideDeck":{"Branded":"Adds Droll & Lock Bird and retains Phara plus Super Polymerization.","Toon Turbo":"Adds Mulcharmy Fuwalos and Harpie's Feather Duster."},"openingHands":{"Branded":["Phara the Primordial Goddess","Branded Fusion","Aluber the Jester of Despia","Super Polymerization","The Fallen & The Virtuous"],"Toon Turbo":["Mulcharmy Fuwalos","Funny Dark Rabbit","Comic Cat","Toon Bookmark","Harpie's Feather Duster"]},"turns":[{"title":"Turn 1 — Branded","lp":"Branded 8000 — Toon Turbo 8000","actions":["Toon Turbo discards Mulcharmy Fuwalos before Branded begins Special Summoning.","Branded Normal Summons Aluber and adds Branded Retribution.","Phara reveals itself and Branded Fusion. Neither player can respond to Branded Fusion's activation or effects through the protected window.","Branded Fusion sends Fallen of Albaz and Tri-Brigade Mercourier to summon Lubellion the Searing Dragon. Fuwalos draws one card.","Lubellion discards Retribution and Fusion Summons Mirrorjade the Iceblade Dragon. Fuwalos draws a second card.","Branded Sets Super Polymerization and The Fallen & The Virtuous."],"audit":"Branded limits Fuwalos to two draws. Phara ensures that Branded Fusion cannot be stopped by the hand interaction Toon Turbo is likely to have drawn.","endBoard":"Branded: Mirrorjade, Aluber, Set Super Polymerization, Set The Fallen & The Virtuous; Phara in hand."},{"title":"Turn 2 — Toon Turbo","lp":"Branded 8000 — Toon Turbo 8000","actions":["Toon Turbo activates Harpie's Feather Duster.","Branded chains The Fallen & The Virtuous, sending The Dragon that Devours the Dogma and destroying Toon Bookmark before it can be used.","Branded chains Super Polymerization later in the turn rather than spending it into an empty field. Duster then destroys no remaining back row.","Funny Dark Rabbit is Normal Summoned and establishes Perfect World. Comic Cat is Normal Summoned through Funny's additional Summon.","Evil Box Special Summons itself and Sets Toon Terror.","Toon Dark Magician is Special Summoned through the Toon engine.","Mirrorjade banishes Funny Dark Rabbit.","Branded activates Super Polymerization, discarding Phara as cost. Toon Dark Magician and Evil Box are both DARK monsters with different Types, so they Fusion Summon Mudragon of the Swamp.","Comic Cat Tributes Mirrorjade and Special Summons Dark-Eyes Illusionist Faceless Mage from the Deck.","Mirrorjade schedules the destruction of Toon Turbo's monsters during the End Phase.","During the End Phase, Mirrorjade destroys Comic Cat and Dark-Eyes. The Dragon that Devours the Dogma adds Dogmatika Ecclesia, the Virtuous."],"audit":"Super Polymerization is delayed until Toon Turbo presents two compatible DARK materials. Phara's discard does not trigger because it is paid as Super Polymerization's activation cost.","endBoard":"Branded: Mudragon and Aluber; Dogmatika Ecclesia in hand. Toon Turbo: Perfect World and Set Toon Terror, no monsters."},{"title":"Turn 3 — Branded","lp":"Branded 8000 — Toon Turbo 0","actions":["Branded Retribution is banished from the GY to recover Branded Fusion.","Branded Fusion produces Albion the Branded Dragon, which produces a new Mirrorjade.","Dogmatika Ecclesia is Normal Summoned after the Extra Deck line is complete.","Mirrorjade, Mudragon, Aluber, and Ecclesia attack for lethal."],"audit":"Branded completes its Fusion Summons before Normal Summoning Ecclesia, avoiding Ecclesia's Extra Deck restriction. The damage line uses the exact follow-up found during the previous End Phase.","endBoard":"Branded wins Game 2."}],"decidingFactor":"Phara protects Branded Fusion, while Super Polymerization waits until Perfect World can no longer save both of Toon Turbo's compatible DARK monsters."},{"title":"Game 3","winner":"Branded","firstPlayer":"Toon Turbo","sideDeck":{"Toon Turbo":"Restores Mind Scan, Solemn Judgment, and Dominus Impulse for the play.","Branded":"Adds Cosmic Cyclone and Droll & Lock Bird while preserving Phara and Super Polymerization."},"openingHands":{"Toon Turbo":["Funny Dark Rabbit","Toon Bookmark","Toon Dark Magician","Solemn Judgment","Dominus Impulse"],"Branded":["Cosmic Cyclone","Phara the Primordial Goddess","Branded Fusion","Super Polymerization","The Fallen & The Virtuous"]},"turns":[{"title":"Turn 1 — Toon Turbo","lp":"Toon Turbo 8000 — Branded 8000","actions":["Funny Dark Rabbit is Normal Summoned and establishes Perfect World.","Toon Bookmark adds Comic Cat. Funny's additional Normal Summon places Comic Cat on the field.","Perfect World searches Evil Box. Evil Box Special Summons itself and Sets Toon Terror.","Toon Dark Magician enters through the Toon engine and produces Dark Magician of Destruction.","Evil Box and an extender Link Summon I:P Masquerena.","Toon Turbo Sets Solemn Judgment and Toon Terror, retaining Dominus Impulse."],"audit":"Toon Turbo avoids placing every body into one Fusion Monster. I:P ensures the board can change shape if Branded attempts Super Polymerization.","endBoard":"Toon Turbo: Dark Magician of Destruction, Comic Cat, I:P Masquerena, Perfect World, Set Judgment, Set Toon Terror."},{"title":"Turn 2 — Branded","lp":"Toon Turbo 4000 — Branded 8000","actions":["Branded activates Cosmic Cyclone targeting Perfect World.","Toon Turbo chains Solemn Judgment, pays half its LP, and negates Cosmic Cyclone.","Branded activates The Fallen & The Virtuous, sending an Albaz-related Extra Deck monster and destroying Perfect World.","Toon Terror cannot negate because its activation condition requires Toon World to remain face-up when the Chain is built.","Branded activates Super Polymerization. Without Perfect World, Toon Turbo cannot temporarily hide a monster.","Super Polymerization uses Dark Magician of Destruction and I:P Masquerena, two DARK monsters with different Types, to Fusion Summon Mudragon of the Swamp.","Comic Cat Tributes itself and Special Summons Funny Dark Rabbit from the Deck, preserving one Toon body.","Phara reveals itself with Branded Fusion. Dominus Impulse cannot respond to the protected Branded Fusion activation.","Branded Fusion produces Lubellion, then Mirrorjade.","Mirrorjade banishes Funny Dark Rabbit."],"audit":"Branded forces the hard negate with Cosmic Cyclone, then uses a second Spell to remove Perfect World. Super Polymerization becomes reliable only after the non-Chain protection effect is gone.","endBoard":"Branded: Mirrorjade and Mudragon. Toon Turbo: no monsters, one inactive Set Toon Terror, 4000 LP."},{"title":"Turn 3 — Toon Turbo","lp":"Toon Turbo 4000 — Branded 8000","actions":["Toon Turbo draws Evil Box but cannot Special Summon it without Toon World.","Toon Bookmark is no longer available and the Set Toon Terror is inactive.","Toon Turbo Sets Evil Box as a defensive monster and passes."],"audit":"There is no productive Extra Deck line because Branded removed both the Field Spell and the monsters that would supply material.","endBoard":"Toon Turbo: one Set monster. Branded retains Mirrorjade and Mudragon."},{"title":"Turn 4 — Branded","lp":"Toon Turbo 0 — Branded 8000","actions":["Mirrorjade removes the Set Evil Box.","Branded develops an additional Fusion attacker from its remaining engine.","Mirrorjade, Mudragon, and the new Fusion Monster attack for lethal."],"audit":"Branded does not need to expose another long combo. Removing the only defender and adding one attacker is sufficient.","endBoard":"Branded wins Game 3 and the match 2–1."}],"decidingFactor":"Branded sequences two separate Field Spell answers before Super Polymerization, then uses Phara to make Branded Fusion unanswerable by Dominus Impulse."}],"analysis":["Branded wins 2–1 and moves to 1–1.","Toon Turbo's Game 1 proves its Fusion/Link ceiling is legitimate when Mind Scan and S:P can remove Branded Fusion and Super Polymerization from the relevant turn.","Branded's adaptation is to treat Perfect World as the first target, not the Toon monsters. Once Perfect World is absent, Super Polymerization becomes deterministic.","Phara is decisive because it protects Branded Fusion from the hand-based negate Toon Turbo deliberately retained."]},{"id":"r2-m4-elfnote-toon","round":"Round 2","title":"Elfnote vs. Toon","players":["Elfnote","Toon"],"score":"Toon 2–1","status":"complete","detailLevel":"full","context":["Elfnote attempts to control the center Main Monster Zone through June Pride and rotating Level 6 monsters.","Toon combines Perfect World and Comic Cat with the Maliss Link engine established in its audited Branded match.","The matchup is defined by Comic Cat's Tribute-as-cost removal, Perfect World's non-Chain temporary banish, and Elfnote's reliance on the GY for Welcome Home and Rhapsodia."],"games":[{"title":"Game 1","winner":"Elfnote","firstPlayer":"Elfnote","openingHands":{"Elfnote":["Elfnote Tinia","Elfnote Power Patron","Elfnotes: Welcome Home","Elfnotes: Rhapsodia of Madness","Effect Veiler"],"Toon":["Maliss in Underground","Funny Dark Rabbit","Comic Cat","Evil Box","Toon Bookmark"]},"turns":[{"title":"Turn 1 — Elfnote","lp":"Elfnote 8000 — Toon 8000","actions":["Elfnote Tinia Special Summons itself to the center Main Monster Zone and places Elfnotes: Welcome Home.","Elfnote Power Patron is Normal Summoned and increases Tinia's Level.","Power Patron and Tinia Synchro Summon Elfnote June Pride.","Power Patron's GY effect adds Elfnotes: Rhapsodia of Madness.","June Pride returns itself to the Extra Deck and deploys Elfnote Fortuna, Elfnote Lucina, and Elfnote Regina from different locations.","Fortuna places Rhapsodia. Lucina searches Elfnote Tinia. Regina prepares the GY recursion line.","Elfnote Sets Effect Veiler's supporting Trap line and ends with multiple center-zone rotations available."],"audit":"June Pride is converted into three monsters rather than left as one 3100 ATK body. The three smaller monsters represent bounce, temporary banish, recursion, and continuous-card access.","endBoard":"Elfnote: Fortuna in the center, Lucina, Regina, Welcome Home, Rhapsodia, and one set card."},{"title":"Turn 2 — Toon","lp":"Elfnote 8000 — Toon 7100","actions":["Toon activates Maliss in Underground and banishes Maliss P Dormouse.","Dormouse pays 300 LP to Special Summon itself, then banishes Maliss P White Rabbit.","White Rabbit pays 300 LP to Special Summon itself and Sets Maliss C MTP-07.","Funny Dark Rabbit is Normal Summoned. Lucina rotates into the center zone and returns Funny to the hand before it can remain available as Link Material.","Toon Bookmark adds Toon World the Perfect World, which is activated.","Comic Cat is Normal Summoned.","Fortuna rotates with Regina. Regina's interaction places additional pressure on the center zone while Tinia temporarily banishes Comic Cat.","MTP-07 is activated, banishing Dormouse and adding Maliss P March Hare.","White Rabbit and March Hare attempt to assemble a Link line, but Effect Veiler negates the intermediate Link Monster's critical effect.","Elfnote's remaining rotation removes Perfect World's protected monster at a different timing point, leaving Toon without enough material to reach Hearts Crypter."],"audit":"Elfnote does not attempt to destroy Perfect World. It attacks Toon's material count through bounce, temporary banish, and Veiler, ensuring the Maliss line cannot reach Link-3.","endBoard":"Elfnote retains Fortuna, Regina, Lucina, and its continuous cards. Toon ends with Perfect World and one small monster."},{"title":"Turn 3 — Elfnote","lp":"Elfnote 8000 — Toon 0","actions":["Welcome Home converts an Elfnote body into Power Patron and restores the Synchro line.","Power Patron raises a Level 6 Elfnote and Synchro Summons June Pride.","June Pride removes Toon's remaining monster in battle.","The other Elfnote monsters attack directly, and Rhapsodia ensures Toon cannot rebuild a defender during combat."],"audit":"Elfnote leaves June Pride on the field for the lethal turn because the transformation effect is no longer needed.","endBoard":"Elfnote wins Game 1."}],"decidingFactor":"Elfnote prevents Toon from reaching Hearts Crypter by rotating individual Link materials out of the center-zone sequence rather than challenging Perfect World directly."},{"title":"Game 2","winner":"Toon","firstPlayer":"Toon","sideDeck":{"Toon":"Adds Dimension Shifter and Mind Scan, attacking Elfnote's GY recursion and its most important named Spell.","Elfnote":"Adds Ghost Ogre & Snow Rabbit and Infinite Impermanence."},"openingHands":{"Toon":["Dimension Shifter","Maliss in Underground","Funny Dark Rabbit","Toon Bookmark","Infinite Impermanence"],"Elfnote":["Elfnote Lucina","Elfnote Power Patron","Elfnotes: Welcome Home","Elfnotes: Rhapsodia of Madness","Ghost Ogre & Snow Rabbit"]},"turns":[{"title":"Turn 1 — Toon","lp":"Toon 7400 — Elfnote 8000","actions":["During the Standby Phase, Toon activates Dimension Shifter while its GY is empty.","Maliss in Underground produces Dormouse and White Rabbit, costing 600 LP. White Rabbit Sets MTP-07.","Funny Dark Rabbit is Normal Summoned and establishes Perfect World.","Perfect World searches Evil Box. Evil Box Special Summons itself and Sets Toon Terror.","Dormouse, White Rabbit, and Funny Link Summon Maliss Q Hearts Crypter. Under Dimension Shifter, all three materials are banished.","Perfect World searches Mind Scan, which Toon Sets alongside Infinite Impermanence."],"audit":"Dimension Shifter is asymmetrical in this position. The banished Maliss cards remain Hearts Crypter ammunition, while Elfnote loses the GY destinations required by Welcome Home and Rhapsodia.","endBoard":"Toon: Hearts Crypter pointing to Evil Box, Perfect World, Set Mind Scan, Toon Terror, MTP-07, and Infinite Impermanence."},{"title":"Turn 2 — Elfnote","lp":"Toon 7400 — Elfnote 8000","actions":["Toon activates Mind Scan during the Standby Phase and reveals Elfnote's hand.","Mind Scan declares Elfnotes: Welcome Home before it is activated.","Elfnote Special Summons Lucina to the center zone and activates its search effect.","Infinite Impermanence negates Lucina.","Power Patron is Normal Summoned and attempts to create a Synchro line.","Hearts Crypter shuffles banished Dormouse into the Deck and banishes Power Patron.","Elfnote activates Rhapsodia, but Dimension Shifter prevents the intended card from reaching or remaining in the GY.","Welcome Home is also blanked by Mind Scan for the turn.","Elfnote passes with Lucina and ineffective back row."],"audit":"Mind Scan declares the engine Spell rather than June Pride. Dimension Shifter already suppresses the GY, so denying Welcome Home removes the only remaining way to replace the banished Power Patron.","endBoard":"Toon retains its entire field. Elfnote controls only a negated Lucina and back row."},{"title":"Turn 3 — Toon","lp":"Toon 6500 — Elfnote 0","actions":["MTP-07 adds March Hare and banishes Hearts Crypter during resolution.","Hearts pays 900 LP to Special Summon itself and doubles to 5000 ATK.","March Hare Special Summons itself by banishing MTP-07 from the GY after Dimension Shifter expires.","Perfect World searches Comic Cat. Comic Cat Tributes Lucina and Special Summons Funny Dark Rabbit from the Deck.","Hearts, Evil Box, March Hare, and Funny attack for more than 8000 damage."],"audit":"No Accesscode line is needed. Hearts at 5000 ATK plus the remaining Toon and Maliss bodies already exceed lethal.","endBoard":"Toon wins Game 2."}],"decidingFactor":"Dimension Shifter disables Elfnote's graveyard infrastructure, while Mind Scan and Hearts Crypter remove the remaining Spell and monster routes."},{"title":"Game 3","winner":"Toon","firstPlayer":"Elfnote","sideDeck":{"Elfnote":"Chooses to play first and retains its full June Pride package.","Toon":"Adds Evenly Matched for the draw while retaining Comic Cat and the Maliss engine."},"openingHands":{"Elfnote":["Elfnote Tinia","Elfnote Power Patron","Elfnote Regina","Elfnotes: Welcome Home","Infinite Impermanence"],"Toon":["Evenly Matched","Funny Dark Rabbit","Comic Cat","Toon Bookmark","Maliss in Underground"]},"turns":[{"title":"Turn 1 — Elfnote","lp":"Elfnote 8000 — Toon 8000","actions":["Tinia Special Summons itself to the center and places Welcome Home.","Power Patron raises Tinia's Level and Synchro Summons June Pride.","June Pride remains on the field rather than transforming immediately.","Regina is developed beside June Pride, and Elfnote Sets Infinite Impermanence."],"audit":"Elfnote expects Toon to need multiple monsters for its Link line, so it retains June Pride's field presence and combat restriction instead of immediately converting it into three bodies.","endBoard":"Elfnote: June Pride in the center, Regina, Welcome Home, and Set Infinite Impermanence."},{"title":"Turn 2 — Toon","lp":"Elfnote 8000 — Toon 7400","actions":["Toon enters the Battle Phase without controlling a card and activates Evenly Matched from the hand.","Elfnote keeps June Pride and banishes Regina, Welcome Home, and Infinite Impermanence face-down.","In Main Phase 2, Toon activates Maliss in Underground and produces Dormouse plus White Rabbit, paying 600 LP.","Funny Dark Rabbit is Normal Summoned and establishes Perfect World.","Comic Cat is Normal Summoned through Funny's additional Normal Summon.","Comic Cat Tributes June Pride as the activation cost and Special Summons Dark-Eyes Illusionist Faceless Mage from the Deck.","Because June Pride has already been Tributed as cost, it cannot activate its transformation effect from the field.","Dormouse, White Rabbit, and Funny Link Summon Hearts Crypter. Dark-Eyes places Mind Scan face-up from the Deck."],"audit":"Evenly Matched compresses Elfnote to one card, and Comic Cat is specifically saved for that remaining card. Tributing June Pride as cost bypasses the timing window in which June Pride would normally return itself to the Extra Deck.","endBoard":"Toon: Hearts Crypter pointing to Dark-Eyes, Perfect World, Mind Scan, Comic Cat in the GY. Elfnote: empty field."},{"title":"Turn 3 — Elfnote","lp":"Elfnote 8000 — Toon 7400","actions":["Elfnote draws Elfnotes: Welcome Home.","Mind Scan reveals the hand and declares Welcome Home.","Elfnote Normal Summons Elfnote Lucina and activates its search effect.","Hearts Crypter shuffles a banished Maliss card into the Deck and banishes Lucina.","The negated Welcome Home cannot rebuild the field, and Elfnote passes."],"audit":"Toon does not declare June Pride with Mind Scan. Hearts already handles the monster; Mind Scan removes the Spell that would replace it.","endBoard":"Toon retains Hearts, Dark-Eyes, Perfect World, and Mind Scan. Elfnote controls no cards."},{"title":"Turn 4 — Toon","lp":"Elfnote 0 — Toon 6500","actions":["Perfect World searches Evil Box. Evil Box Special Summons itself and Sets Toon Terror.","MTP-07 adds March Hare and banishes Hearts during resolution.","Hearts pays 900 LP to return at 5000 ATK.","Dark-Eyes recovers Funny Dark Rabbit, which is Normal Summoned through the Toon engine.","Hearts, Evil Box, Dark-Eyes, and Funny attack for lethal."],"audit":"The final turn avoids unnecessary Link conversion. Hearts' doubled ATK is more damage than Accesscode would provide after consuming the supporting attackers.","endBoard":"Toon wins Game 3 and the match 2–1."}],"decidingFactor":"Evenly Matched reduces Elfnote to June Pride, Comic Cat Tributes June Pride as cost, and Mind Scan prevents the single-card Welcome Home rebuild."}],"analysis":["Toon wins 2–1 and remains undefeated.","Elfnote wins Game 1 by attacking Toon's Link-material count rather than the Field Spell.","Toon's side-deck cards attack Elfnote on two structural axes: Dimension Shifter removes the GY, while Evenly Matched compresses the center-zone board to one monster.","Comic Cat is the matchup's decisive engine card because Tributing June Pride as cost prevents June Pride from using its on-field escape effect."]},{"id":"r3-m1-power-patron-kewl-tune","round":"Round 3","title":"Power Patron vs. Kewl Tune","players":["Power Patron","Kewl Tune"],"score":"Kewl Tune 2–1","status":"complete","detailLevel":"full","context":["Both decks enter the match undefeated at 2–0.","Power Patron presents Fusion, Xyz, and Link threats across successive waves. Kewl Tune presents several Tuner Synchros that convert opposing activations into additional interaction.","The matchup audit focuses on whether Power Patron can preserve Nerva's rewrite effect and whether Kewl Tune delays B2B until the first interaction layer has traded."],"games":[{"title":"Game 1","winner":"Power Patron","firstPlayer":"Power Patron","openingHands":{"Power Patron":["Artmage Vandalism -Assault-","Plundered Power Patron Plane – Vidolia","Theorealize Liberation","Dominus Impulse","Prohibited Power Patron Portal - Terminus"],"Kewl Tune":["Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Cue","Kewl Tune Synchro","Triple Tactics Talent"]},"turns":[{"title":"Turn 1 — Power Patron","lp":"Power Patron 8000 — Kewl Tune 8000","actions":["Artmage Vandalism -Assault- adds Medius the Pure.","Medius is Normal Summoned and Special Summons Power Patron DoomZ from the Deck.","Vandalism targets DoomZ, allowing it to be treated as an Artmage monster if used as Fusion Material this turn.","Plundered Power Patron Plane – Vidolia reveals Nerva the Power Patron of Creation, banishes Theorealize Liberation face-down, and Special Summons Nervedo the Shadebeast Power Patron from the Deck.","Nervedo banishes the top three cards of the Deck face-down and destroys itself to Fusion Summon Nerva.","Nervedo's face-up Extra Deck effect Special Summons Artmage Power Patron from the Deck.","Artmage Power Patron uses itself and the reclassified DoomZ to Fusion Summon Artmage Non-Finito.","Non-Finito Sets Artmage Impasto -Recapture- from the Deck.","Power Patron activates Terminus, sending Jupredo the Shademachine Power Patron from the Extra Deck to the GY and loading Terminus for a future Damage Step.","Power Patron ends with Nerva, Non-Finito, and Medius, plus Impasto and Dominus Impulse."],"audit":"Medius is deliberately preserved as a DARK Spellcaster. Non-Finito can therefore use itself and Medius for a legal opponent-turn Fusion if Nerva's rewrite is not needed. Sending Jupredo with Terminus also prevents the Extra Deck from becoming clogged with only Fusion follow-up.","endBoard":"Power Patron: Nerva, Non-Finito, Medius; Vidolia and Vandalism; Set Impasto; Dominus Impulse in hand; Terminus in the GY."},{"title":"Turn 2 — Kewl Tune","lp":"Power Patron 8000 — Kewl Tune 8000","actions":["Kewl Tune Rotary reveals itself with Kewl Tune Mix and grants an additional Normal Summon.","Mix is Normal Summoned and adds Kewl Tune Cue.","Cue is Normal Summoned with Rotary's additional Summon and activates to Special Summon Kewl Tune Reco from the Deck.","Power Patron chains Artmage Impasto -Recapture-. Non-Finito is banished until the End Phase; Cue's activation is negated and Cue is destroyed.","Kewl Tune activates Kewl Tune Synchro, adds Kewl Tune Clip, and uses Mix plus Rotary from the hand/field to Synchro Summon Kewl Tune Track Maker.","Track Maker activates to search. Power Patron allows the search, conserving Nerva for the first effect that commits multiple cards to the field.","Track Maker adds JJ “Kewl Tune”. JJ is activated.","Kewl Tune uses Track Maker and Clip to Synchro Summon Kewl Tune Loudness War.","Track Maker's material effect attempts to return Vidolia to the hand.","Power Patron chains Nerva to the activation of an Artmage monster effect generated through the returning Non-Finito line. Nerva rewrites that effect into 'Destroy all cards your opponent controls.'","The rewritten effect clears Loudness War, JJ “Kewl Tune”, and the remaining Kewl Tune cards before Kewl Tune can establish B2B.","Kewl Tune sets Triple Tactics Talent as a bluff and ends. Non-Finito returns during the End Phase."],"audit":"Impasto is used on Cue because Cue would place a Tuner directly from the Deck and create the most efficient first Synchro. Nerva is not spent on Mix or Track Maker's search; it is reserved until Kewl Tune has committed a Synchro Monster and its Continuous Spell.","endBoard":"Power Patron retains Nerva, Non-Finito, and Medius. Kewl Tune has no monsters."},{"title":"Turn 3 — Power Patron","lp":"Power Patron 8000 — Kewl Tune 0","actions":["Power Patron draws Power Patron DoomZ and Normal Summons it.","DoomZ targets Medius and Xyz Summons DoomZ Break - Diactorus, equipping itself to the Xyz Monster.","Diactorus destroys the equipped DoomZ and then destroys Kewl Tune's Set card.","Nerva, Non-Finito, and Diactorus attack for 8100 total damage."],"audit":"The Xyz conversion raises the available combat total above 8000 and clears the only Set card before the Battle Phase.","endBoard":"Power Patron wins Game 1."}],"decidingFactor":"Power Patron separates its interaction into Impasto and Nerva. Kewl Tune is allowed to search, but not allowed to retain both a Synchro Monster and JJ “Kewl Tune” at the point Nerva rewrites the Artmage effect."},{"title":"Game 2","winner":"Kewl Tune","firstPlayer":"Kewl Tune","sideDeck":{"Kewl Tune":"Adds Droll & Lock Bird and Kewl Tune Playlist while retaining the maximum number of engine Tuners.","Power Patron":"Adds Harpie's Feather Duster and Forbidden Droplet for a going-second configuration."},"openingHands":{"Kewl Tune":["Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Cue","Kewl Tune Synchro","Kewl Tune Playlist"],"Power Patron":["Artmage Vandalism -Assault-","Medius the Pure","Plundered Power Patron Plane – Vidolia","Forbidden Droplet","Harpie's Feather Duster"]},"turns":[{"title":"Turn 1 — Kewl Tune","lp":"Kewl Tune 8000 — Power Patron 8000","actions":["Rotary grants an additional Normal Summon. Mix is Normal Summoned and adds Kewl Tune Reco.","Cue is Normal Summoned and Special Summons Kewl Tune Clip from the Deck.","Cue and Rotary Synchro Summon Kewl Tune Track Maker.","Track Maker adds JJ “Kewl Tune”. Rotary's material effect inspects Power Patron's hand and adds a second Kewl Tune Synchro.","Track Maker uses Mix from the hand as material to Synchro Summon Kewl Tune Loudness War.","The first Kewl Tune Synchro adds Reco and produces Kewl Tune RS.","The second Kewl Tune Synchro adds follow-up and produces Kewl Tune Remix.","Kewl Tune sets Playlist and ends with three different opponent-turn Synchro conversions available."],"audit":"Kewl Tune does not summon B2B on Turn 1. Loudness War answers any card or effect through copied material effects, RS negates one face-up card, and Remix can turn two GY Tuners into a fresh Tuner Synchro.","endBoard":"Kewl Tune: Loudness War, RS, Remix, JJ “Kewl Tune”, Set Playlist."},{"title":"Turn 2 — Power Patron","lp":"Kewl Tune 8000 — Power Patron 8000","actions":["Power Patron activates Harpie's Feather Duster.","Kewl Tune chains Playlist, targeting Reco in the GY. Playlist applies Reco's Synchro-material effect to destroy Vidolia after it is activated later in the turn, then returns Reco to the hand.","Duster destroys Playlist, but JJ “Kewl Tune” remains face-up.","Vandalism adds a second Medius. Kewl Tune allows the search.","Medius is Normal Summoned and activates to Special Summon Power Patron DoomZ from the Deck.","Kewl Tune RS banishes a Tuner from the GY and negates Medius.","Power Patron chains Forbidden Droplet, sending Vandalism and Harpie's Feather Duster from the field/GY as available costs and negating RS plus Loudness War.","Power Patron activates Vidolia, reveals Nerva, and attempts to Special Summon Nervedo from the Deck.","The previously applied Reco effect destroys Vidolia during the resolving Kewl Tune sequence, but Nervedo is already successfully Special Summoned.","Nervedo activates to destroy itself and summon Nerva.","Kewl Tune Remix Tributes itself, adds Rotary from the GY to the hand, Special Summons Mix, and immediately Synchro Summons Kewl Tune B2B using Mix and Loudness War.","Mix's material effect destroys Nervedo before it can complete the intended follow-up into Artmage Power Patron.","B2B is now live. When Medius activates its remaining effect window, B2B Special Summons Reco and immediately Synchro Summons Baronne de Fleur using Reco and RS.","Baronne negates Nerva's first meaningful activation. Power Patron ends without a stable Extra Deck board."],"audit":"Forbidden Droplet trades efficiently into the first layer, but Remix converts the negated Synchros into B2B after the chain has resolved. B2B then turns Power Patron's necessary monster activations into a second Synchro Summon.","endBoard":"Kewl Tune: B2B, Baronne de Fleur, JJ “Kewl Tune”. Power Patron: a negated Medius and no back row."},{"title":"Turn 3 — Kewl Tune","lp":"Kewl Tune 8000 — Power Patron 0","actions":["Baronne destroys Medius.","Kewl Tune Synchro adds Cue and immediately produces Kewl Tune Crackle.","Crackle temporarily removes Power Patron's most relevant remaining Extra Deck answers.","B2B allows the Tuners to attack twice. B2B, Baronne, Crackle, and the supporting Tuners produce lethal damage."],"audit":"Kewl Tune removes Medius before entering combat, preventing a GY-based rebuild and ensuring there is no target for Terminus-assisted battle removal.","endBoard":"Kewl Tune wins Game 2."}],"decidingFactor":"Remix and B2B convert a field that was partially negated by Forbidden Droplet into a second Synchro layer after Power Patron has already spent its board breaker."},{"title":"Game 3","winner":"Kewl Tune","firstPlayer":"Power Patron","sideDeck":{"Power Patron":"Chooses to play first and adds Appointer of the Red Lotus plus an additional Impasto.","Kewl Tune":"Adds Book of Eclipse, Dark Ruler No More, and Lightning Storm while trimming slower opponent-turn cards."},"openingHands":{"Power Patron":["Artmage Vandalism -Assault-","Plundered Power Patron Plane – Vidolia","Medius the Pure","Artmage Impasto -Recapture-","Appointer of the Red Lotus"],"Kewl Tune":["Book of Eclipse","Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Synchro","Kewl Tune Cue"]},"turns":[{"title":"Turn 1 — Power Patron","lp":"Power Patron 8000 — Kewl Tune 8000","actions":["Vandalism adds a second Medius. The first Medius is Normal Summoned and Special Summons Power Patron DoomZ.","Vandalism reclassifies DoomZ as Artmage Fusion Material.","Vidolia produces Nervedo, which destroys itself and Fusion Summons Nerva.","Nervedo's face-up Extra Deck effect Special Summons Artmage Power Patron.","Artmage Power Patron and DoomZ Fusion Summon Artmage Non-Finito.","Non-Finito Sets a second Artmage Impasto -Recapture-.","Power Patron Sets Appointer and both Impasto copies."],"audit":"The board is strong against monster-led hands but has no direct protection against a Spell that changes all monsters face-down. Appointer cannot remove Book of Eclipse until the Standby Phase of the next turn.","endBoard":"Power Patron: Nerva, Non-Finito, Medius; Vidolia and Vandalism; three set Traps."},{"title":"Turn 2 — Kewl Tune","lp":"Power Patron 8000 — Kewl Tune 8000","actions":["During the Standby Phase, Power Patron activates Appointer, pays 2000 LP, and inspects Kewl Tune's hand.","Power Patron temporarily banishes Dark Ruler No More, correctly identifying it as the card that would otherwise turn off every monster without allowing a monster response.","Kewl Tune enters Main Phase and activates Book of Eclipse.","Power Patron chains Non-Finito's Fusion effect. Nerva chains and rewrites Non-Finito's effect into a full opposing-field destruction.","Kewl Tune controls no cards other than Book of Eclipse, so the rewritten effect destroys nothing relevant.","Book of Eclipse resolves and turns Nerva, Non-Finito, and Medius face-down. Both Impasto copies are now offline because Power Patron no longer controls a face-up Artmage monster or a face-up Fusion Monster to banish.","Rotary grants the additional Normal Summon. Mix is Normal Summoned and adds Reco. Cue is Normal Summoned and Special Summons Clip.","Cue and Rotary Synchro Summon Track Maker, which searches JJ “Kewl Tune”.","Track Maker and Mix become Kewl Tune Loudness War. Track Maker's material effect returns the face-down Nerva to the Extra Deck; Mix's material effect destroys the face-down Non-Finito.","Kewl Tune Synchro adds Reco and produces RS.","A second Synchro line produces Kewl Tune B2B.","B2B and the Tuners attack the remaining face-down Medius and then attack directly, reducing Power Patron to 1600 LP.","Kewl Tune ends on B2B, Loudness War, RS, and JJ “Kewl Tune”."],"audit":"Appointer chooses the correct card but cannot remove both Dark Ruler and Book. Book forces Power Patron to spend Nerva's rewrite into an empty field and then disables Impasto by turning its required monsters face-down.","endBoard":"Kewl Tune controls B2B, Loudness War, RS, and JJ “Kewl Tune”. Power Patron has no monsters and 1600 LP."},{"title":"Turn 3 — Power Patron","lp":"Power Patron 1600 — Kewl Tune 8000","actions":["Power Patron Normal Summons the second Medius and activates its effect.","RS negates Medius.","B2B responds to the monster-effect activation, Special Summons Reco, and immediately Synchro Summons Baronne de Fleur.","Power Patron has no route through Baronne plus Loudness War and passes."],"audit":"B2B is now functioning as the second-wave boss it was designed to be. The mandatory starter activation gives Kewl Tune the response window needed to create Baronne.","endBoard":"Kewl Tune retains complete control."},{"title":"Turn 4 — Kewl Tune","lp":"Power Patron 0 — Kewl Tune 8000","actions":["Baronne destroys the negated Medius.","B2B and the remaining Tuners attack for lethal."],"audit":"No additional Extra Deck commitment is required.","endBoard":"Kewl Tune wins Game 3 and the match 2–1."}],"decidingFactor":"Book of Eclipse forces Nerva's rewrite to resolve into an empty field, turns off both Impasto copies, and lets Track Maker plus Mix remove the face-down bosses as Synchro-material effects."}],"analysis":["Kewl Tune wins the undefeated matchup 2–1 and moves to 3–0.","Power Patron wins when it can stagger Impasto and Nerva rather than spending both on the same early starter.","Kewl Tune's best boards are not immediate B2B boards. Remix, RS, and Loudness War absorb the first exchange, then B2B converts the opponent's next monster effect into Baronne or another Tuner Synchro.","Book of Eclipse is the decisive side card because it bypasses Nerva's destruction protection, disables Impasto's requirements, and prevents the board from interacting with the subsequent Tuner summons."]},{"id":"r3-m2-dark-magician-branded","round":"Round 3","title":"Dark Magician vs. Branded","players":["Dark Magician","Branded"],"score":"Branded 2–1","status":"complete","detailLevel":"full","context":["Dark Magician attempts to convert its Spellcaster engine into Dragoon, Dark Magician of Destruction, and Rank 7/Link pressure.","Branded uses Phara to protect Branded Fusion and The Fallen & The Virtuous to create interaction without committing an additional monster.","The Side Deck games focus on Secret Village of the Spellcasters and whether Branded can access a Spellcaster before its Fusion Spells are locked."],"games":[{"title":"Game 1","winner":"Branded","firstPlayer":"Branded","openingHands":{"Branded":["Aluber the Jester of Despia","Branded Fusion","Phara the Primordial Goddess","Super Polymerization","The Fallen & The Virtuous"],"Dark Magician":["Magician's Rod","Magicians' Souls","Dark Magical Circle","Dark Magical Curtain","Soul Servant"]},"turns":[{"title":"Turn 1 — Branded","lp":"Branded 8000 — Dark Magician 8000","actions":["Branded Normal Summons Aluber and adds Branded Retribution.","Phara reveals itself with Branded Fusion, protecting that named Spell from responses through the end of Dark Magician's next turn.","Branded Fusion sends Fallen of Albaz and Tri-Brigade Mercourier to Fusion Summon Lubellion the Searing Dragon.","Lubellion discards Retribution and shuffles itself plus Fallen of Albaz into the Deck/Extra Deck to Fusion Summon Mirrorjade the Iceblade Dragon.","Branded Sets Super Polymerization and The Fallen & The Virtuous."],"audit":"The line stops after Mirrorjade. The second set card and Retribution in the GY provide more value than giving Dark Magician additional board-breaking targets.","endBoard":"Branded: Mirrorjade, Aluber, Set Super Polymerization, Set The Fallen & The Virtuous; Phara in hand; Retribution in the GY."},{"title":"Turn 2 — Dark Magician","lp":"Branded 8000 — Dark Magician 8000","actions":["Dark Magician activates Dark Magical Circle and arranges the top of the Deck.","Magician's Rod is Normal Summoned and adds The Gaze of Timaeus.","Magicians' Souls sends Dark Magician from the Deck to the GY and Special Summons itself.","Soul Servant places Dark Magician, the Pharaoh's Servant on top of the Deck, then banishes itself to draw it.","Pharaoh's Servant reveals Dark Magical Curtain, Special Summons itself, and Sets Secrets of Dark Magic from the Deck.","Dark Magician activates Dark Magical Curtain and Special Summons Dark Magician from the Deck.","Dark Magical Circle targets Aluber for banishment.","Branded chains The Fallen & The Virtuous, sends The Dragon that Devours the Dogma from the Extra Deck to the GY, and destroys Dark Magical Circle before the Chain resolves. Circle's already-activated effect still banishes Aluber.","Mirrorjade banishes Pharaoh's Servant.","Dark Magician activates Secrets of Dark Magic, using Dark Magician and Magicians' Souls to Fusion Summon Red-Eyes Dark Dragoon.","Branded chains Super Polymerization at the next legal window, discarding Phara as cost and using Dragoon plus Branded's Mirrorjade—two DARK monsters with different Types—to Fusion Summon Mudragon of the Swamp.","Because Phara was discarded as a cost, it does not Special Summon itself.","Dark Magician ends with only Magician's Rod."],"audit":"Branded does not use Super Polymerization on Dark Magician plus Rod. It waits until Dragoon is committed, converting Dark Magician's strongest Extra Deck threat and Mirrorjade—whose leave-field effect still schedules a wipe—into Mudragon.","endBoard":"Branded: Mudragon. Dark Magician: Magician's Rod. Mirrorjade's End Phase destruction is pending."},{"title":"Turn 3 — Branded","lp":"Branded 8000 — Dark Magician 0","actions":["Branded Retribution banishes itself from the GY and returns Branded Fusion to the hand.","Branded Fusion produces Albion the Branded Dragon, then a fresh Mirrorjade.","The Dragon that Devours the Dogma adds Dogmatika Ecclesia, the Virtuous during the End Phase sequence from the previous turn.","Branded Normal Summons Ecclesia after finishing its Extra Deck summons.","Mirrorjade, Mudragon, Albion-derived pressure, and Ecclesia attack for lethal."],"audit":"Retribution converts Lubellion's discard into the second Branded Fusion. Ecclesia is Normal Summoned only after the Extra Deck line is complete.","endBoard":"Branded wins Game 1."}],"decidingFactor":"Branded waits for Dragoon before using Super Polymerization, then uses Mirrorjade's delayed removal and Retribution's GY recovery to win the follow-up turn."},{"title":"Game 2","winner":"Dark Magician","firstPlayer":"Dark Magician","sideDeck":{"Dark Magician":"Adds Secret Village of the Spellcasters, Dimensional Barrier, and Solemn Judgment.","Branded":"Adds Cosmic Cyclone and Evenly Matched, but does not open Dogmatika Ecclesia."},"openingHands":{"Dark Magician":["Magicians' Souls","Magician's Rod","Dark Magical Circle","Secret Village of the Spellcasters","Dimensional Barrier"],"Branded":["Aluber the Jester of Despia","Branded Fusion","The Fallen & The Virtuous","Cosmic Cyclone","Super Polymerization"]},"turns":[{"title":"Turn 1 — Dark Magician","lp":"Dark Magician 8000 — Branded 8000","actions":["Magicians' Souls sends Dark Magician to the GY and Special Summons itself.","Dark Magical Circle is activated and adds Soul Servant.","Magician's Rod is Normal Summoned and adds Dark Magical Curtain.","Soul Servant places Dark Magician, the Pharaoh's Servant on top of the Deck and then draws it.","Pharaoh's Servant Special Summons itself and Sets The Gaze of Timaeus.","Because a Spell was activated, Pharaoh's Servant is banished to Special Summon Dark Magician of Destruction.","Dark Magician of Destruction adds Secrets of Dark Magic.","Dark Magician activates Secret Village of the Spellcasters and Sets Dimensional Barrier."],"audit":"Dark Magician of Destruction is retained as the Spellcaster that maintains Secret Village. The board also keeps two Level 7 routes available if Branded cannot break the lock.","endBoard":"Dark Magician: Dark Magician of Destruction, Magicians' Souls, Magician's Rod, Circle, Secret Village, Set The Gaze of Timaeus, Set Dimensional Barrier."},{"title":"Turn 2 — Branded","lp":"Dark Magician 8000 — Branded 8000","actions":["Secret Village prevents Cosmic Cyclone, Branded Fusion, Super Polymerization, and The Fallen & The Virtuous from being activated because Branded controls no Spellcaster.","Branded Normal Summons Aluber and attempts to add a Branded Spell/Trap.","Dark Magician chains Dimensional Barrier and declares Fusion before Branded can establish any Fusion threat.","Aluber resolves and adds Branded Retribution, but every relevant Spell remains locked by Secret Village.","Branded sets Retribution and passes."],"audit":"Dimensional Barrier is activated after Aluber commits to the field. Even if Branded later removes Secret Village, Fusion Summons remain prohibited for the turn.","endBoard":"Branded: Aluber and Set Retribution. Dark Magician's lock remains intact."},{"title":"Turn 3 — Dark Magician","lp":"Dark Magician 8000 — Branded 0","actions":["The Gaze of Timaeus uses Dark Magician of Destruction—currently named Dark Magician—as material for Red-Eyes Dark Dragoon.","Circle's setup and the remaining Dark Magician cards clear Aluber and Retribution.","Dark Magician converts its remaining Level 7 body into additional Extra Deck damage rather than leaving low-ATK support monsters exposed.","Dragoon, the Extra Deck follow-up, Magicians' Souls, and Magician's Rod produce lethal."],"audit":"The turn prioritizes damage over another search loop because Secret Village has already denied Branded a full turn.","endBoard":"Dark Magician wins Game 2."}],"decidingFactor":"Secret Village blanks four Spells in Branded's opening hand, and Dimensional Barrier prevents Branded from converting Aluber into a Fusion line even if the lock is later removed."},{"title":"Game 3","winner":"Branded","firstPlayer":"Branded","sideDeck":{"Branded":"Adds Dogmatika Ecclesia, Cosmic Cyclone, and Evenly Matched to ensure access to a Spellcaster and a clean answer to Secret Village.","Dark Magician":"Adds Evenly Matched and Harpie's Feather Duster for the draw."},"openingHands":{"Branded":["Dogmatika Ecclesia, the Virtuous","Aluber the Jester of Despia","Branded Fusion","Phara the Primordial Goddess","Branded Retribution"],"Dark Magician":["Evenly Matched","Magician's Rod","Dark Magical Circle","Dark Magical Curtain","The Gaze of Timaeus"]},"turns":[{"title":"Turn 1 — Branded","lp":"Branded 8000 — Dark Magician 8000","actions":["Branded Normal Summons Aluber and adds The Fallen & The Virtuous.","Phara reveals itself with Branded Fusion.","Branded Fusion sends Fallen of Albaz and Tri-Brigade Mercourier to summon Albion the Branded Dragon.","Albion banishes itself and Fallen of Albaz to Fusion Summon Mirrorjade.","Dogmatika Ecclesia Special Summons itself because an Extra Deck monster is on the field and adds a Dogmatika/Branded follow-up card.","Branded sets Retribution and The Fallen & The Virtuous."],"audit":"Ecclesia is deliberately present before Dark Magician's turn. If Secret Village appears later, Branded already controls a Spellcaster and will not be locked out of Spells.","endBoard":"Branded: Mirrorjade, Aluber, Ecclesia, two set cards; Phara in hand."},{"title":"Turn 2 — Dark Magician","lp":"Branded 8000 — Dark Magician 8000","actions":["Dark Magician enters the Battle Phase without controlling a card and activates Evenly Matched.","Branded chains The Fallen & The Virtuous, sends The Dragon that Devours the Dogma to the GY, and destroys its own Aluber so it can retain higher-value cards before Evenly resolves.","Evenly Matched resolves. Branded keeps Mirrorjade and banishes the remaining field cards face-down.","In Main Phase 2, Dark Magician activates Dark Magical Circle.","Magician's Rod is Normal Summoned and adds Soul Servant.","Dark Magical Curtain Special Summons Dark Magician from the Deck and adds Secrets of Dark Magic.","Mirrorjade banishes Dark Magician before it can be used as Fusion Material.","Soul Servant places Dark Magician, the Pharaoh's Servant on top of the Deck and draws it.","Pharaoh's Servant Special Summons itself and Sets The Gaze of Timaeus from the Deck.","Because a Spell was activated, Pharaoh's Servant banishes itself to Special Summon Dark Magician of Destruction.","Dark Magician of Destruction adds another Dark Magician card. Dark Magician ends without enough bodies for lethal."],"audit":"Branded uses The Fallen & The Virtuous before Evenly resolves, converting a card that would be banished face-down into an End Phase search. Mirrorjade then removes the first Dark Magician before the Fusion engine can use it.","endBoard":"Branded: Mirrorjade. Dark Magician: Dark Magician of Destruction, Dark Magical Circle, Set The Gaze of Timaeus."},{"title":"Turn 3 — Branded","lp":"Branded 8000 — Dark Magician 3400","actions":["The Dragon that Devours the Dogma adds Tri-Brigade Springans Kitt during the preceding End Phase.","Kitt is Normal Summoned, recovers Branded Fusion from the GY/banishment engine, and places a card on the bottom of the Deck.","Branded Fusion produces Lubellion and then a second Fusion threat.","Dark Magical Circle cannot interrupt because no Dark Magician is Special Summoned on Branded's side.","Mirrorjade removes Dark Magician of Destruction. The Branded attackers reduce Dark Magician to 3400 LP.","Branded ends with Mirrorjade plus another Fusion Monster and Retribution available in the GY."],"audit":"The Kitt line is chosen instead of Ecclesia because Branded needs to restore Branded Fusion immediately. The damage line leaves enough bodies to play through a top-decked Dark Magical Curtain.","endBoard":"Branded controls two Fusion Monsters. Dark Magician controls only Circle and a Set card."},{"title":"Turn 4 — Dark Magician","lp":"Branded 8000 — Dark Magician 3400","actions":["Dark Magician activates The Gaze of Timaeus and uses a Dark Magician in the GY to Fusion Summon Red-Eyes Dark Dragoon.","Dragoon attempts to destroy Branded's secondary Fusion Monster.","Mirrorjade chains and banishes Dragoon before the destruction effect can resolve successfully.","Dark Magician cannot rebuild another attacker and passes."],"audit":"Mirrorjade is held for the Extra Deck threat rather than spent on the first Normal Summon or Circle setup.","endBoard":"Branded retains Mirrorjade and the secondary Fusion threat."},{"title":"Turn 5 — Branded","lp":"Branded 8000 — Dark Magician 0","actions":["Branded Retribution recovers Branded Fusion.","Branded adds one more Fusion attacker and enters the Battle Phase.","The existing Fusion Monsters attack for lethal."],"audit":"No additional defensive setup is required once Dragoon has been banished.","endBoard":"Branded wins Game 3 and the match 2–1."}],"decidingFactor":"Branded includes Dogmatika Ecclesia to prevent Secret Village from becoming a complete lock, converts a card into value before Evenly Matched resolves, and saves Mirrorjade for Dark Magician's actual Fusion threat."}],"analysis":["Branded wins 2–1 and moves to 2–1.","Dark Magician's Secret Village plan is strong enough to win a game when Branded lacks Ecclesia, but it is not a permanent matchup solution once Branded sides into a Spellcaster.","Branded's optimal Super Polymerization window is after Dragoon appears, not when the first Dark Magician reaches the field.","Evenly Matched is powerful but does not erase Mirrorjade's single-card follow-up or the End Phase value created by The Dragon that Devours the Dogma."]},{"id":"r3-m3-sky-striker-toon","round":"Round 3","title":"Sky Striker vs. Toon","players":["Sky Striker","Toon"],"score":"Sky Striker 2–1","status":"complete","detailLevel":"full","context":["Toon enters undefeated, using Perfect World plus the Maliss Link package.","Sky Striker attempts to turn Widow Anchor into permanent removal by using the borrowed Maliss Link Monster as material for Zeke or S:P Little Knight.","The deciding side-deck cards are Cosmic Cyclone and Evenly Matched, which attack Toon Terror and the size of the Toon board in separate Chains."],"games":[{"title":"Game 1","winner":"Toon","firstPlayer":"Toon","openingHands":{"Toon":["Dimension Shifter","Maliss in Underground","Funny Dark Rabbit","Toon Bookmark","Infinite Impermanence"],"Sky Striker":["Sky Striker Ace - Raye","Sky Striker Mobilize – Engage!","Sky Striker Mecha – Widow Anchor","Sky Striker Mecha – Linkage!","Radiant Typhoon Vision"]},"turns":[{"title":"Turn 1 — Toon","lp":"Toon 7400 — Sky Striker 8000","actions":["Toon activates Dimension Shifter during the Standby Phase.","Maliss in Underground banishes Dormouse. Dormouse and White Rabbit each pay 300 LP to Special Summon, and White Rabbit Sets MTP-07.","Funny Dark Rabbit is Normal Summoned and establishes Toon World the Perfect World.","Perfect World searches Evil Box. Evil Box Special Summons itself and Sets Toon Terror.","Dormouse, White Rabbit, and Funny Link Summon Maliss Q Hearts Crypter. The three materials are banished under Dimension Shifter.","Toon sets Infinite Impermanence and MTP-07."],"audit":"Dimension Shifter removes Sky Striker's ability to accumulate three Spells in the GY and prevents Kagari from recovering cards that never reach the GY.","endBoard":"Toon: Hearts Crypter pointing to Evil Box, Perfect World, Toon Terror, MTP-07, Infinite Impermanence."},{"title":"Turn 2 — Sky Striker","lp":"Toon 7400 — Sky Striker 6500","actions":["Sky Striker activates Engage and adds Sky Striker Maneuver - Afterburners!; Engage is banished after resolving because of Dimension Shifter.","Raye is Normal Summoned and Link Summons Hayate.","Infinite Impermanence negates Hayate before combat.","Linkage attempts to convert Hayate into Kagari.","Toon Terror negates and destroys Linkage because Toon controls Perfect World and Evil Box is treated as a Toon monster.","Hearts Crypter shuffles a banished Maliss card into the Deck and banishes Hayate.","Sky Striker cannot create a second Link body and passes."],"audit":"Toon Terror is held for Linkage, the card that would clear the Main Monster Zone and begin Kagari's resource loop. Hearts removes Hayate only after Linkage is stopped.","endBoard":"Toon retains its full field. Sky Striker controls no cards."},{"title":"Turn 3 — Toon","lp":"Toon 6500 — Sky Striker 0","actions":["MTP-07 adds March Hare and banishes Hearts Crypter during resolution.","Hearts pays 900 LP, returns to the field, and doubles to 5000 ATK.","March Hare Special Summons itself.","Perfect World searches Comic Cat. Comic Cat Tributes itself and Special Summons Funny Dark Rabbit from the Deck.","Hearts, Evil Box, March Hare, and Funny attack for 9000 total damage."],"audit":"Accesscode is unnecessary. Hearts at 5000 ATK preserves every supporting attacker.","endBoard":"Toon wins Game 1."}],"decidingFactor":"Dimension Shifter prevents Sky Striker from building its Spell count or recovering Linkage, while Toon Terror and Hearts answer the first Link conversion separately."},{"title":"Game 2","winner":"Sky Striker","firstPlayer":"Sky Striker","sideDeck":{"Sky Striker":"Adds Cosmic Cyclone, Solemn Judgment, and additional copies of Widow Anchor.","Toon":"Adds Harpie's Feather Duster and Droll & Lock Bird."},"openingHands":{"Sky Striker":["Sky Striker Ace - Raye","Sky Striker Ace - Roze","Sky Striker Mobilize – Engage!","Sky Striker Mecha – Widow Anchor","Cosmic Cyclone"],"Toon":["Funny Dark Rabbit","Comic Cat","Maliss in Underground","Toon Bookmark","Harpie's Feather Duster"]},"turns":[{"title":"Turn 1 — Sky Striker","lp":"Sky Striker 8000 — Toon 8000","actions":["Engage adds Sky Striker Mecha – Linkage!.","Raye is Normal Summoned. Roze Special Summons itself.","Raye and Roze Link Summon Sky Striker Ace – Zero.","Zero adds Sky Striker Maneuver - Afterburners!.","Sky Striker sets Widow Anchor, Linkage, and Cosmic Cyclone."],"audit":"Zero uses its search effect on Sky Striker's own turn. Its Tribute effect becomes available on Toon's turn because the 'one effect per turn' restriction resets with the new turn.","endBoard":"Sky Striker: Zero and three set cards."},{"title":"Turn 2 — Toon","lp":"Sky Striker 8000 — Toon 7400","actions":["Toon activates Harpie's Feather Duster.","Sky Striker chains Linkage, sends Widow Anchor to the GY, and converts Zero into Kagari. Kagari returns Engage.","Cosmic Cyclone is chained before Duster resolves and banishes Toon Bookmark.","Duster destroys no remaining set cards.","Maliss in Underground produces Dormouse and White Rabbit, costing 600 LP. White Rabbit Sets MTP-07.","Funny is Normal Summoned and establishes Perfect World. Comic Cat is Normal Summoned through Funny's additional Summon.","Kagari and the recovered Raye line convert through Hayate into Shizuku during the opponent-turn interaction sequence enabled by Zero's prior positioning.","MTP-07 adds March Hare, and the Maliss monsters attempt to Link Summon Hearts Crypter.","Sky Striker uses the recovered Engage to access a second Widow Anchor at the first legal opportunity.","Widow Anchor negates Hearts Crypter and takes control of it after the third Spell reaches the GY.","The borrowed Hearts and Kagari become Sky Striker Ace – Zeke. Hearts is permanently removed from Toon's field as Link Material.","Zeke temporarily banishes Comic Cat. Toon ends with Perfect World but no functional Link board."],"audit":"Sky Striker deliberately sends its first Widow Anchor with Linkage because Kagari can recover Engage and find a second copy. The second Anchor is used only after Hearts appears, turning negation into permanent Link conversion.","endBoard":"Sky Striker: Zeke and recovered follow-up. Toon: Perfect World, one small Maliss monster, Comic Cat temporarily banished."},{"title":"Turn 3 — Sky Striker","lp":"Sky Striker 8000 — Toon 0","actions":["Zeke returns Comic Cat and is converted into Camellia, Kagari, and Hayate through the Sky Striker Link ladder.","Afterburners removes the remaining Maliss monster and Perfect World once the Spell count reaches three.","Linkage supplies an additional Link Summon and attack.","The accumulated Link attacks produce lethal damage."],"audit":"Sky Striker removes Perfect World only after Hearts has already been converted into Link Material. The sequence ensures Toon cannot rebuild a protected attacker during combat.","endBoard":"Sky Striker wins Game 2."}],"decidingFactor":"Sky Striker uses Linkage to preserve value through Feather Duster, then uses the second Widow Anchor on Hearts Crypter and immediately converts it into Zeke."},{"title":"Game 3","winner":"Sky Striker","firstPlayer":"Toon","sideDeck":{"Toon":"Chooses to play first and retains Dimension Shifter, Toon Terror, and Mind Scan.","Sky Striker":"Adds Evenly Matched, Cosmic Cyclone, and Droll & Lock Bird for a layered going-second plan."},"openingHands":{"Toon":["Maliss in Underground","Funny Dark Rabbit","Evil Box","Toon Bookmark","Toon Terror"],"Sky Striker":["Cosmic Cyclone","Evenly Matched","Sky Striker Ace - Raye","Sky Striker Mobilize – Engage!","Sky Striker Mecha – Widow Anchor"]},"turns":[{"title":"Turn 1 — Toon","lp":"Toon 7400 — Sky Striker 8000","actions":["Maliss in Underground produces Dormouse and White Rabbit, costing 600 LP. White Rabbit Sets MTP-07.","Funny is Normal Summoned and establishes Perfect World.","Evil Box Special Summons itself and Sets a second Toon Terror.","Dormouse, White Rabbit, and Funny Link Summon Hearts Crypter.","Toon sets both Toon Terror copies and MTP-07."],"audit":"Toon chooses Hearts over Accesscode or I:P because the going-first plan requires interaction, not immediate damage.","endBoard":"Toon: Hearts Crypter pointing to Evil Box, Perfect World, two Toon Terror copies, MTP-07."},{"title":"Turn 2 — Sky Striker","lp":"Toon 7400 — Sky Striker 8000","actions":["During the Draw Phase, Sky Striker activates Cosmic Cyclone targeting Perfect World.","Toon chains the first Toon Terror and negates Cosmic Cyclone.","Sky Striker enters the Battle Phase without controlling a card and activates Evenly Matched from the hand.","Toon chains the second Toon Terror and negates Evenly Matched.","Sky Striker has now forced both Counter Traps without committing Raye or Engage.","In Main Phase 2, Sky Striker activates Engage and adds Linkage.","Raye is Normal Summoned and becomes Hayate.","Hayate sends a Sky Striker Spell to the GY. Linkage converts Hayate into Kagari, which returns Engage.","The second Engage adds Widow Anchor and draws after Sky Striker reaches three Spells in the GY.","Widow Anchor targets Hearts Crypter, negates it, and takes control.","Kagari and the borrowed Hearts Link Summon Zeke.","Zeke temporarily banishes Evil Box. Perfect World remains face-up but has no Toon monster available to protect."],"audit":"Cosmic Cyclone and Evenly Matched are not expected to resolve; they are used as two separate must-negate cards that exhaust Toon Terror. Only after both Counter Traps are gone does Sky Striker commit its engine.","endBoard":"Sky Striker: Zeke and two cards of follow-up. Toon: Perfect World, no monsters until Evil Box returns."},{"title":"Turn 3 — Toon","lp":"Toon 7400 — Sky Striker 8000","actions":["Evil Box returns during the prior End Phase, but Toon has no Maliss Link Monster and no remaining Trap negate.","Perfect World searches Comic Cat.","Comic Cat Tributes Zeke and Special Summons Funny Dark Rabbit from the Deck.","Sky Striker chains Raye's GY effect from the destruction/leave-field sequence and restores a Sky Striker Link Monster.","Toon attempts to rebuild through MTP-07, but the relevant Maliss Link Monster is no longer available.","Toon ends with Evil Box and Funny."],"audit":"Comic Cat removes Zeke but cannot recreate Hearts. Sky Striker's Raye recursion ensures the removal does not produce an empty field.","endBoard":"Toon: Evil Box and Funny. Sky Striker: a restored Link Monster and multiple Spells."},{"title":"Turn 4 — Sky Striker","lp":"Toon 0 — Sky Striker 8000","actions":["Afterburners destroys Evil Box and, with three Spells in the GY, removes Perfect World.","The Sky Striker Link ladder uses Camellia, Kagari, Hayate, and Linkage to produce the necessary attacks.","The final Link attack ends the match."],"audit":"Perfect World is removed before combat so it cannot temporarily banish Funny during a removal effect or preserve the Toon engine.","endBoard":"Sky Striker wins Game 3 and the match 2–1."}],"decidingFactor":"Sky Striker uses Cosmic Cyclone and Evenly Matched as separate Counter-Trap checks, then converts the stolen Hearts Crypter into Zeke after both Toon Terror copies are exhausted."}],"analysis":["Sky Striker wins 2–1 and earns its first match victory.","Toon is strongly favored when Dimension Shifter prevents the Sky Striker GY from functioning.","Sky Striker's best answer to Hearts Crypter is not destruction. Widow Anchor takes Hearts and turns it into permanent Link Material.","The Game 3 side-deck sequence demonstrates why multiple board breakers are stronger than one: Cosmic Cyclone and Evenly Matched each demand a separate Toon Terror before the Sky Striker engine begins."]},{"id":"r3-m4-toon-turbo-elfnote","round":"Round 3","title":"Toon Turbo vs. Elfnote","players":["Toon Turbo","Elfnote"],"score":"Elfnote 2–1","status":"complete","detailLevel":"full","context":["Toon Turbo uses its Fusion and Link toolbox, including Dark Magician of Destruction, Blue-Eyes Toon Ultimate Dragon, I:P Masquerena, and S:P Little Knight.","Elfnote expands beyond June Pride and uses Seraphim Strelitzia, Junora, Aristeia of Trust, and Quatrain of Succession.","The match audit focuses on whether Elfnote can preserve three differently named monsters for Aristeia and whether Toon Turbo can remove the center-zone monster before the rotations begin."],"games":[{"title":"Game 1","winner":"Toon Turbo","firstPlayer":"Toon Turbo","openingHands":{"Toon Turbo":["Funny Dark Rabbit","Comic Cat","Evil Box","Toon Dark Magician","Mind Scan"],"Elfnote":["Elfnote Tinia","Elfnote Power Patron","Elfnotes: Welcome Home","Elfnotes: Rhapsodia of Madness","Infinite Impermanence"]},"turns":[{"title":"Turn 1 — Toon Turbo","lp":"Toon Turbo 8000 — Elfnote 8000","actions":["Funny Dark Rabbit is Normal Summoned, establishes Toon World the Perfect World, and grants an additional Normal Summon.","Comic Cat is Normal Summoned with the additional Summon.","Evil Box Special Summons itself and Sets Toon Terror.","Perfect World searches Toon Dark Magician.","The Toon Dark Magician line produces Dark Magician of Destruction, which adds a Dark Magician/Toon support card.","Evil Box and an extender Link Summon I:P Masquerena.","Toon Turbo Sets Mind Scan and Toon Terror."],"audit":"The opening board contains a searchable Fusion body, Comic Cat's Tribute removal, and I:P's flexible Link interaction. Blue-Eyes Toon Ultimate Dragon is intentionally delayed until Elfnote's interaction is known.","endBoard":"Toon Turbo: Dark Magician of Destruction, Comic Cat, I:P Masquerena, Perfect World, Set Mind Scan, Set Toon Terror."},{"title":"Turn 2 — Elfnote","lp":"Toon Turbo 8000 — Elfnote 8000","actions":["Mind Scan reveals Elfnote's hand and declares Elfnotes: Welcome Home.","Elfnote Tinia Special Summons itself to the center zone and attempts to place a Continuous Spell.","Infinite Impermanence is not available from the hand because Elfnote now controls a card.","Comic Cat Tributes Tinia as cost and Special Summons Funny Dark Rabbit from the Deck.","Elfnote Normal Summons Elfnote Power Patron but has no center-zone Elfnote monster to increase for an immediate Synchro Summon.","Elfnote activates Rhapsodia, sending Power Patron to the GY and attempting to revive Tinia.","Toon Terror negates and destroys Rhapsodia.","During the End Phase, I:P Masquerena and Funny Dark Rabbit Link Summon S:P Little Knight. S:P banishes Power Patron from the GY, removing the next-turn Synchro starter."],"audit":"Mind Scan declares Welcome Home because it is the cleanest replacement effect after Comic Cat removes Tinia. S:P then targets the GY resource rather than the empty field.","endBoard":"Toon Turbo retains Dark Magician of Destruction, Comic Cat, S:P, and Perfect World. Elfnote controls no cards."},{"title":"Turn 3 — Toon Turbo","lp":"Toon Turbo 8000 — Elfnote 0","actions":["Perfect World searches Evil Box. Evil Box Special Summons itself and Sets another Toon Trap.","Comic Cat Tributes itself and Special Summons Toon Dark Magician from the Deck.","The Fusion line creates Blue-Eyes Toon Ultimate Dragon after Elfnote's interaction has been exhausted.","S:P clears Elfnote's only Set card.","Blue-Eyes Toon Ultimate Dragon, Dark Magician of Destruction, Evil Box, and the remaining attacker produce lethal damage."],"audit":"The large Fusion Monster is summoned only after Toon Turbo has verified that Rhapsodia and Power Patron are unavailable.","endBoard":"Toon Turbo wins Game 1."}],"decidingFactor":"Comic Cat removes the center-zone starter as cost, Mind Scan suppresses Welcome Home, and S:P removes Elfnote Power Patron from the GY before Elfnote can rebuild."},{"title":"Game 2","winner":"Elfnote","firstPlayer":"Elfnote","sideDeck":{"Elfnote":"Adds Elfnotes: Aristeia of Trust, Elfnotes: Quatrain of Succession, and Ghost Ogre & Snow Rabbit.","Toon Turbo":"Adds Droll & Lock Bird and Harpie's Feather Duster."},"openingHands":{"Elfnote":["Elfnote Tinia","Elfnote Regina","Elfnote Power Patron","Elfnotes: Welcome Home","Elfnotes: Aristeia of Trust"],"Toon Turbo":["Droll & Lock Bird","Funny Dark Rabbit","Comic Cat","Toon Bookmark","Harpie's Feather Duster"]},"turns":[{"title":"Turn 1 — Elfnote","lp":"Elfnote 8000 — Toon Turbo 8000","actions":["Tinia Special Summons itself to the center zone and places Elfnotes: A Plea for Help from the Deck.","Toon Turbo activates Droll & Lock Bird after the first Deck-to-hand addition later in the sequence, but the Elfnote cards placed face-up from the Deck are not added to the hand.","Welcome Home sends Regina from the hand to the GY and Special Summons Elfnote Lucina from the Deck.","Lucina adds Elfnote Fortuna. Droll now prevents additional Deck-to-hand searches for the turn.","Elfnote Power Patron is Normal Summoned, raises Tinia from Level 6 to Level 9, and Synchro Summons Elfnote June Pride.","June Pride returns itself to the Extra Deck and Special Summons Fortuna from the hand, Regina from the Deck, and Tinia from the GY.","Regina is placed in the center zone and Special Summons another Elfnote monster from the Deck.","Fortuna places Elfnotes: Rhapsodia of Madness. The previously drawn Aristeia is Set.","Elfnote uses Quatrain of Succession to create a Level 1 Elfnote Seraphim Token.","The token and a Level 6 Elfnote Synchro Summon Elfnote Seraphim Strelitzia into the center zone."],"audit":"Droll suppresses Power Patron's GY search but does not stop Welcome Home, Tinia, Fortuna, or Regina from placing or Special Summoning cards. Elfnote ends with Strelitzia plus at least three Elfnote monsters, satisfying Aristeia's Spell/Trap-negate condition.","endBoard":"Elfnote: Strelitzia in the center, Fortuna, Regina, Lucina, A Plea for Help, Welcome Home, Rhapsodia, Set Aristeia."},{"title":"Turn 2 — Toon Turbo","lp":"Elfnote 8000 — Toon Turbo 8000","actions":["Toon Turbo activates Harpie's Feather Duster.","Elfnote chains Aristeia of Trust. Because Elfnote controls three or more Elfnote monsters and a Synchro Monster, Aristeia negates Duster and destroys it.","Funny Dark Rabbit is Normal Summoned and activates.","Lucina rotates into the center zone and returns Funny to the hand.","Toon Bookmark adds Perfect World, which is activated.","Fortuna rotates and returns Perfect World to the hand.","Comic Cat is Normal Summoned, but Tinia rotates and temporarily banishes a random card from Toon Turbo's hand, removing Toon Dark Magician.","Strelitzia Special Summons a Level 6 Elfnote from the GY and reduces the Levels of the relevant monsters, disrupting Toon Turbo's planned Extra Deck arithmetic.","Toon Turbo cannot establish Toon World, cannot Special Summon Evil Box, and ends without a Fusion or Link board."],"audit":"Elfnote uses three different rotation effects on three different resources: Lucina removes the Normal Summon, Fortuna removes the Field Spell, and Tinia removes the Fusion extender from the hand. Strelitzia then changes Levels to prevent a generic recovery line.","endBoard":"Elfnote retains Strelitzia and the full continuous-card engine. Toon Turbo controls only Comic Cat."},{"title":"Turn 3 — Elfnote","lp":"Elfnote 8000 — Toon Turbo 0","actions":["Rhapsodia sends an Elfnote monster and revives a different-Attribute Elfnote from the GY.","Power Patron is restored and uses the center-zone monster for another Synchro Summon.","Junora the Power Patron of Tuning is Synchro Summoned and negates Toon Turbo's face-up cards.","Strelitzia, Junora, and the remaining Level 6 Elfnote monsters attack for lethal."],"audit":"Junora is summoned only after the opponent's field is established, maximizing its on-summon mass negate. Its column effect also prevents Comic Cat from becoming Extra Deck material.","endBoard":"Elfnote wins Game 2."}],"decidingFactor":"Elfnote's placed cards ignore Droll, Aristeia stops Feather Duster, and the center-zone rotations remove the Normal Summon, Field Spell, and hand extender independently."},{"title":"Game 3","winner":"Elfnote","firstPlayer":"Toon Turbo","sideDeck":{"Toon Turbo":"Chooses to play first and restores Mind Scan, Toon Terror, and Solemn Judgment.","Elfnote":"Adds Cosmic Cyclone, Dark Ruler No More, and Evenly Matched for a three-stage board-breaking plan."},"openingHands":{"Toon Turbo":["Funny Dark Rabbit","Comic Cat","Evil Box","Toon Dark Magician","Solemn Judgment"],"Elfnote":["Cosmic Cyclone","Dark Ruler No More","Evenly Matched","Elfnote Tinia","Elfnote Power Patron"]},"turns":[{"title":"Turn 1 — Toon Turbo","lp":"Toon Turbo 8000 — Elfnote 8000","actions":["Funny Dark Rabbit establishes Perfect World and grants the additional Normal Summon for Comic Cat.","Evil Box Special Summons itself and Sets Toon Terror.","Perfect World searches Toon Dark Magician.","The Toon Fusion line produces Dark Magician of Destruction and then Blue-Eyes Toon Ultimate Dragon.","Evil Box and an extender Link Summon I:P Masquerena.","Toon Turbo Sets Solemn Judgment and Toon Terror."],"audit":"This is Toon Turbo's maximum-pressure going-first board: a large Fusion attacker, a searching Fusion body, I:P interaction, an omni-negate, and a Counter Trap.","endBoard":"Toon Turbo: Blue-Eyes Toon Ultimate Dragon, Dark Magician of Destruction, I:P Masquerena, Comic Cat, Perfect World, Set Judgment, Set Toon Terror."},{"title":"Turn 2 — Elfnote","lp":"Toon Turbo 4000 — Elfnote 8000","actions":["During the Draw Phase, Elfnote activates Cosmic Cyclone targeting Perfect World.","Toon Turbo chains Toon Terror and negates Cosmic Cyclone.","Elfnote enters Main Phase and activates Dark Ruler No More.","Solemn Judgment negates Dark Ruler No More and Toon Turbo pays half its LP.","Elfnote enters the Battle Phase without controlling a card and activates Evenly Matched from the hand.","Toon Turbo has no remaining Spell/Trap negate. It keeps Blue-Eyes Toon Ultimate Dragon and banishes every other card face-down.","In Main Phase 2, Tinia Special Summons itself to the center zone and places Welcome Home.","Welcome Home sends a card from the hand and Special Summons Lucina from the Deck.","Lucina adds Fortuna. Power Patron is Normal Summoned.","Power Patron raises Tinia's Level and Synchro Summons June Pride.","June Pride returns itself to the Extra Deck and deploys Fortuna, Regina, and Tinia from the hand, Deck, and GY.","Fortuna places Rhapsodia. Regina in the center Special Summons another Elfnote from the Deck.","Elfnote ends with several rotations available against the one retained Fusion Monster."],"audit":"Cosmic Cyclone and Dark Ruler are intentionally used as two separate must-negate cards. Evenly Matched is the third layer and resolves after Toon Turbo has spent both Toon Terror and Solemn Judgment.","endBoard":"Elfnote: Fortuna, Regina, Tinia, Lucina, Welcome Home, Rhapsodia. Toon Turbo: Blue-Eyes Toon Ultimate Dragon, 4000 LP."},{"title":"Turn 3 — Toon Turbo","lp":"Toon Turbo 4000 — Elfnote 8000","actions":["Blue-Eyes Toon Ultimate Dragon attempts to attack through the Elfnote board.","Lucina rotates into the center zone and returns a Level 6 or lower supporting Toon monster when Toon Turbo attempts to rebuild.","Fortuna rotates and returns the newly activated Perfect World replacement to the hand.","Rhapsodia revives an Elfnote monster and negates Blue-Eyes Toon Ultimate Dragon for the turn because Elfnote controls a Synchro Monster after the opponent-turn sequence.","Toon Turbo cannot clear the center-zone board and passes."],"audit":"Elfnote does not need to destroy the large Fusion Monster. Negating it for the turn while controlling the attack lanes preserves every Elfnote body for the counterattack.","endBoard":"Elfnote retains four monsters. Toon Turbo controls a negated Blue-Eyes Toon Ultimate Dragon."},{"title":"Turn 4 — Elfnote","lp":"Toon Turbo 0 — Elfnote 8000","actions":["Power Patron and the center-zone Elfnote Synchro Summon Junora the Power Patron of Tuning.","Junora negates all face-up cards Toon Turbo controls, including Blue-Eyes Toon Ultimate Dragon.","Junora's column restriction prevents the Fusion Monster from being used as material for a last defensive Extra Deck effect.","Junora and the remaining Elfnote monsters attack for lethal."],"audit":"Junora is the correct final Synchro because its on-summon effect removes every remaining face-up interaction and its column effect prevents emergency material conversion.","endBoard":"Elfnote wins Game 3 and the match 2–1."}],"decidingFactor":"Elfnote forces Toon Terror and Solemn Judgment with two separate Spells, resolves Evenly Matched as the third layer, and converts the Main Phase 2 rebuild into June Pride, multiple rotations, and Junora."}],"analysis":["Elfnote wins 2–1 and earns its first match victory.","Toon Turbo is strongest when Comic Cat removes the initial center-zone monster and Mind Scan suppresses Welcome Home before Elfnote reaches three monsters.","Elfnote's full engine is substantially stronger than a June-Pride-only line. Strelitzia supplies another opponent-turn summon, Aristeia protects the continuous cards, and Junora converts the stabilized board into a mass negate.","Game 3 is decided by side-deck layering: Cosmic Cyclone, Dark Ruler No More, and Evenly Matched each demand a separate answer, but Toon Turbo has only two."]},{"id":"r4-m1-power-patron-branded","round":"Round 4","title":"Power Patron vs. Branded","players":["Power Patron","Branded"],"score":"Power Patron 2–1","status":"complete","detailLevel":"full","context":["Power Patron uses the current Fusion–Synchro–Xyz progression rather than treating Nerva as its only end point.","Branded is piloted around Phara-protected Branded Fusion, Super Polymerization, and the Retribution resource loop.","The match audit emphasizes response windows after Branded Fusion resolves and the conditions required to summon Vidolium the Unstable Power Patron of Unity."],"games":[{"title":"Game 1","winner":"Power Patron","firstPlayer":"Power Patron","openingHands":{"Power Patron":["Artmage Vandalism -Assault-","Plundered Power Patron Plane – Vidolia","Theorealize Liberation","Dominus Impulse","Prohibited Power Patron Portal - Terminus"],"Branded":["Phara the Primordial Goddess","Branded Fusion","Aluber the Jester of Despia","Super Polymerization","The Fallen & The Virtuous"]},"turns":[{"title":"Turn 1 — Power Patron","lp":"Power Patron 8000 — Branded 8000","actions":["Artmage Vandalism -Assault- adds Medius the Pure. Medius is Normal Summoned and Special Summons Power Patron DoomZ from the Deck.","Vandalism targets Power Patron DoomZ so it can be treated as an Artmage monster when used as Fusion Material this turn.","Plundered Power Patron Plane – Vidolia reveals Nerva the Power Patron of Creation, banishes Theorealize Liberation face-down, and Special Summons Nervedo the Shadebeast Power Patron from the Deck.","Nervedo destroys itself and Fusion Summons Nerva. Its face-up Extra Deck effect then Special Summons Artmage Power Patron from the Deck.","Artmage Power Patron uses itself and the reclassified Power Patron DoomZ to Fusion Summon Artmage Non-Finito.","Artmage Non-Finito Sets Artmage Impasto -Recapture- directly from the Deck.","Prohibited Power Patron Portal - Terminus sends Jupredo the Shademachine Power Patron from the Extra Deck to the GY, establishing a non-targeting Damage Step answer for a later turn.","Power Patron ends with Nerva, Non-Finito, Medius, a Set Impasto, and Dominus Impulse in hand."],"audit":"Medius is preserved beside Non-Finito instead of being consumed by the first Fusion Summon. That gives Power Patron a second legal Fusion line after Nerva has already rewritten one Artmage effect.","endBoard":"Power Patron: Nerva, Artmage Non-Finito, Medius; Vidolia and Vandalism; Set Impasto; Dominus Impulse in hand; Terminus in the GY."},{"title":"Turn 2 — Branded","lp"
