:"Power Patron 8000 — Branded 8000","actions":["Phara the Primordial Goddess reveals itself with Branded Fusion. Power Patron cannot respond to the activation or resolving effect of that named Spell.","Branded Fusion sends Fallen of Albaz and Tri-Brigade Mercourier to Fusion Summon Lubellion the Searing Dragon.","Lubellion activates in a new Chain. Power Patron responds with Dominus Impulse and negates Lubellion before it can produce Mirrorjade the Iceblade Dragon.","Branded Normal Summons Aluber the Jester of Despia. Aluber activates to search a Branded Spell/Trap.","Artmage Non-Finito chains its opponent-turn Fusion effect. Nerva chains to that Artmage activation and rewrites Non-Finito’s resolving effect into “Destroy all cards your opponent controls.”","The rewritten Non-Finito effect destroys Lubellion and Aluber. Aluber’s already-activated effect still resolves and adds Branded Retribution.","Branded Sets Super Polymerization, The Fallen & The Virtuous, and Branded Retribution, then passes."],"audit":"Phara protects Branded Fusion but not Lubellion’s separate monster effect. Power Patron correctly saves Dominus Impulse for Lubellion and saves Nerva for the point where Branded has committed both a Fusion Monster and Aluber.","endBoard":"Power Patron retains Nerva, Non-Finito, and Medius. Branded controls three Set cards."},{"title":"Turn 3 — Power Patron","lp":"Power Patron 8000 — Branded 2300","actions":["Power Patron draws Power Patron DoomZ and Normal Summons it.","Power Patron DoomZ targets Medius and Xyz Summons DoomZ Break - Diactorus, equipping itself to Diactorus.","Diactorus destroys the equipped DoomZ and then destroys the Set Super Polymerization before Power Patron places a second EARTH Illusion monster beside Nerva.","Branded activates The Fallen & The Virtuous and attempts to destroy Nerva.","Power Patron chains Artmage Impasto -Recapture-. Non-Finito is temporarily banished; The Fallen & The Virtuous is negated and destroyed.","Nerva and Diactorus attack directly for 5700 damage. Non-Finito returns during the End Phase."],"audit":"Diactorus targets Super Polymerization rather than the visibly lower-impact Trap. Impasto is then reserved for The Fallen & The Virtuous, leaving Branded with only Retribution and 2300 LP.","endBoard":"Power Patron: Nerva, Non-Finito, Diactorus. Branded: Set Branded Retribution, 2300 LP."},{"title":"Turn 4 — Branded","lp":"Power Patron 8000 — Branded 2300","actions":["Branded activates Branded Retribution and recovers Branded Fusion from the GY sequence created by Lubellion.","Branded Fusion attempts to restart the Fusion engine through Albion the Branded Dragon.","Non-Finito activates; Nerva rewrites that Artmage effect and destroys Albion plus Branded’s remaining field before a stable Mirrorjade can be established.","Branded passes with no monsters."],"audit":"Power Patron does not use Nerva on Retribution. It waits for the Extra Deck commitment so the rewritten effect removes both the Fusion body and the remaining card economy.","endBoard":"Branded controls no cards. Power Patron retains three attackers."},{"title":"Turn 5 — Power Patron","lp":"Power Patron 8000 — Branded 0","actions":["Nerva attacks directly and ends Game 1 before Power Patron needs another Extra Deck summon."],"audit":"No additional development is correct when one attack is already lethal.","endBoard":"Power Patron wins Game 1."}],"decidingFactor":"Power Patron respects Phara’s protected Spell window, then attacks the separate Lubellion and Aluber effect windows with Dominus Impulse and Nerva."},{"title":"Game 2","winner":"Branded","firstPlayer":"Branded","sideDeck":{"Branded":"Adds Droll & Lock Bird and preserves Super Polymerization plus The Fallen & The Virtuous.","Power Patron":"Adds Dark Ruler No More, Forbidden Droplet, Harpie’s Feather Duster, and Evenly Matched for the draw."},"openingHands":{"Branded":["Aluber the Jester of Despia","Phara the Primordial Goddess","Branded Fusion","Super Polymerization","The Fallen & The Virtuous"],"Power Patron":["Dark Ruler No More","Artmage Vandalism -Assault-","Plundered Power Patron Plane – Vidolia","Medius the Pure","Forbidden Droplet"]},"turns":[{"title":"Turn 1 — Branded","lp":"Branded 8000 — Power Patron 8000","actions":["Aluber the Jester of Despia is Normal Summoned and adds Branded Retribution.","Phara the Primordial Goddess reveals itself with Branded Fusion.","Branded Fusion sends Fallen of Albaz and Tri-Brigade Mercourier to Fusion Summon Lubellion the Searing Dragon.","Lubellion discards Branded Retribution and Fusion Summons Mirrorjade the Iceblade Dragon.","Branded Sets Super Polymerization and The Fallen & The Virtuous."],"audit":"Branded stops on Mirrorjade plus two differently functioning Quick-Play cards. Extending into another Fusion body would make Dark Ruler No More and Forbidden Droplet more efficient.","endBoard":"Branded: Mirrorjade, Aluber, Set Super Polymerization, Set The Fallen & The Virtuous; Phara in hand; Retribution in the GY."},{"title":"Turn 2 — Power Patron","lp":"Branded 8000 — Power Patron 8000","actions":["Power Patron activates Dark Ruler No More. Mirrorjade and Aluber are negated for the turn, but Branded’s Set Spells remain live.","Artmage Vandalism -Assault- adds Medius the Pure. Medius is Normal Summoned and Special Summons Power Patron DoomZ.","Vidolia reveals Nerva and Special Summons Nervedo from the Deck.","Branded activates The Fallen & The Virtuous, sends The Dragon that Devours the Dogma to the GY, and destroys Vidolia before the Power Patron chain can generate its complete follow-up.","Nervedo still destroys itself and Fusion Summons Nerva. Nervedo’s face-up Extra Deck effect Special Summons Artmage Power Patron.","Artmage Power Patron and DoomZ Fusion Summon Artmage Non-Finito.","Branded activates Super Polymerization, discarding Phara as cost and using Nerva plus Non-Finito—two EARTH Illusion monsters—to Fusion Summon Garura, Wings of Resonant Life.","Because Phara was discarded as a cost, Phara does not Special Summon itself.","Power Patron uses Forbidden Droplet to negate Garura and Mirrorjade, but the two Power Patron Fusion monsters have already become Fusion Material.","Power Patron ends with only Medius and no meaningful interaction."],"audit":"Dark Ruler handles monsters but cannot suppress the back row. Branded waits until Nerva and Non-Finito are simultaneously present, maximizing Super Polymerization and permanently removing the Nerva rewrite engine.","endBoard":"Branded: negated Mirrorjade, Aluber, and Garura. Power Patron: Medius."},{"title":"Turn 3 — Branded","lp":"Branded 8000 — Power Patron 0","actions":["Branded Retribution recovers Branded Fusion.","Branded Fusion produces Albion the Branded Dragon and a fresh Fusion attacker.","Mirrorjade removes Medius.","The Branded Fusion monsters, Aluber, and Garura attack for lethal."],"audit":"Branded uses Retribution only after Power Patron has spent both Dark Ruler No More and Forbidden Droplet. The second Branded Fusion is therefore uncontested.","endBoard":"Branded wins Game 2."}],"decidingFactor":"Power Patron’s monster negation does not answer the Set Spells. Super Polymerization converts Nerva and Non-Finito into Garura after both bosses have been committed."},{"title":"Game 3","winner":"Power Patron","firstPlayer":"Power Patron","sideDeck":{"Power Patron":"Adds Appointer of the Red Lotus and keeps Dominus Impulse. The objective is to remove Super Polymerization before committing two EARTH Illusions.","Branded":"Keeps Phara, Super Polymerization, and Cosmic Cyclone for the draw."},"openingHands":{"Power Patron":["Artmage Vandalism -Assault-","Plundered Power Patron Plane – Vidolia","Medius the Pure","Appointer of the Red Lotus","Dominus Impulse"],"Branded":["Phara the Primordial Goddess","Branded Fusion","Super Polymerization","Aluber the Jester of Despia","The Fallen & The Virtuous"]},"turns":[{"title":"Turn 1 — Power Patron","lp":"Power Patron 8000 — Branded 8000","actions":["Vandalism adds Medius. Medius is Normal Summoned and Special Summons Power Patron DoomZ.","Vidolia produces Nervedo, which Fusion Summons Nerva and Special Summons Artmage Power Patron from the Deck.","Artmage Power Patron and the reclassified DoomZ Fusion Summon Artmage Non-Finito.","Non-Finito Sets Artmage Impasto -Recapture-. Power Patron Sets Appointer of the Red Lotus."],"audit":"Power Patron preserves Medius and refuses an unnecessary Xyz Summon. Appointer is intended to remove the card that cannot be answered on Chain: Super Polymerization.","endBoard":"Power Patron: Nerva, Non-Finito, Medius; Vidolia, Vandalism, Set Impasto, Set Appointer; Dominus Impulse in hand."},{"title":"Turn 2 — Branded","lp":"Power Patron 6000 — Branded 8000","actions":["During the Standby Phase, Appointer of the Red Lotus pays 2000 LP, reveals Dominus Impulse, and temporarily banishes Super Polymerization from Branded’s hand.","Phara reveals itself with Branded Fusion.","Branded Fusion produces Lubellion. Lubellion activates in a new Chain, and Dominus Impulse negates it.","Aluber is Normal Summoned and activates to search. Non-Finito chains; Nerva rewrites Non-Finito’s effect and destroys Lubellion plus Aluber.","Aluber’s search still resolves and adds Branded Retribution.","Branded activates The Fallen & The Virtuous, sends The Dragon that Devours the Dogma, and destroys Nerva. Nerva is now in the GY as the Fusion component required by Vidolium.","Branded Sets Retribution and passes."],"audit":"Appointer removes Super Polymerization rather than Phara. Phara can protect Branded Fusion, but Dominus can still negate the resulting Lubellion in the next Chain.","endBoard":"Power Patron: Non-Finito and Medius. Nerva is in the GY. Branded: Set Retribution; Super Polymerization temporarily banished."},{"title":"Turn 3 — Power Patron","lp":"Power Patron 6000 — Branded 0","actions":["Vidolia reveals Junora the Power Patron of Tuning and Special Summons Junoldo the Shadespirit Power Patron from the Deck.","The Power Patron Level-modification line uses Junoldo and the available bodies to Synchro Summon Junora the Power Patron of Tuning.","Power Patron DoomZ is recovered through the engine and converts another monster into DoomZ Break - Diactorus.","Power Patron now has Nerva in the GY, Junora on the field, and Diactorus on the field: one Fusion, one Synchro, and one Xyz Monster.","Those three monsters are returned to the Extra Deck to Special Summon Vidolium the Unstable Power Patron of Unity.","Vidolium banishes every card in both GYs face-down, removing Branded Retribution, Fallen of Albaz, and The Dragon that Devours the Dogma from the resource game.","Vidolium, Artmage Non-Finito, and Medius attack for 9200 total damage."],"audit":"Vidolium is not summoned merely because it is available. It enters only after the exact Fusion–Synchro–Xyz requirement is met and after its mass GY banish removes Branded’s only realistic recovery route.","endBoard":"Power Patron wins Game 3 and the match 2–1."}],"decidingFactor":"Appointer removes Super Polymerization, Dominus stops Lubellion, and the surviving engine converts Nerva, Junora, and Diactorus into Vidolium for a 5000 ATK, GY-clearing finish."}],"analysis":["Power Patron wins 2–1 and moves to 3–1.","Phara protects Branded Fusion itself, not the separate Lubellion or Albion monster effect that follows.","Super Polymerization remains Branded’s strongest answer to Nerva plus Non-Finito, so Power Patron’s optimal Side Deck plan prioritizes Appointer over another ordinary negate.","Vidolium is a legitimate endgame rather than a decorative boss: returning a Fusion, Synchro, and Xyz Monster clears the Extra Deck zones and its on-summon GY banish turns off Retribution and Albaz recursion."]},{"id":"r4-m2-kewl-tune-toon","round":"Round 4","title":"Kewl Tune vs. Toon","players":["Kewl Tune","Toon"],"score":"Kewl Tune 2–1","status":"complete","detailLevel":"full","context":["Kewl Tune enters as the only undefeated deck at 3–0. Toon attacks the archetype’s GY-dependent Synchro-material effects with Dimension Shifter.","Kewl Tune’s Side Deck plan is built around Called by the Grave and layered going-second Spells rather than attempting to out-negate Toon Terror one card at a time.","The match audit focuses on when Kewl Tune should delay B2B and when Toon should preserve Hearts Crypter instead of converting it into Accesscode Talker."],"games":[{"title":"Game 1","winner":"Toon","firstPlayer":"Kewl Tune","openingHands":{"Kewl Tune":["Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Cue","Kewl Tune Synchro","Kewl Tune Playlist"],"Toon":["Dimension Shifter","Maliss in Underground","Funny Dark Rabbit","Toon Bookmark","Comic Cat"]},"turns":[{"title":"Turn 1 — Kewl Tune","lp":"Kewl Tune 8000 — Toon 8000","actions":["During the Standby Phase, Toon activates Dimension Shifter while its GY is empty.","Kewl Tune Rotary grants the additional Normal Summon. Kewl Tune Mix is Normal Summoned and adds Kewl Tune Reco.","Kewl Tune Cue is Normal Summoned and Special Summons Kewl Tune Clip from the Deck.","Cue and Rotary Synchro Summon Kewl Tune Track Maker, but both materials are banished instead of reaching the GY. Their Synchro-material effects are unavailable.","Track Maker adds JJ “Kewl Tune”. Kewl Tune Synchro uses the remaining Tuners to make Kewl Tune RS.","Because the materials continue to be banished, Kewl Tune cannot establish the usual Remix, Reco, or Playlist recursion and ends on Track Maker, RS, and a Set Playlist."],"audit":"Kewl Tune correctly stops short of a resource-negative B2B. Under Dimension Shifter, the archetype loses most material effects and nearly every GY target needed for its opponent-turn Synchro cards.","endBoard":"Kewl Tune: Track Maker, RS, JJ “Kewl Tune”, Set Playlist. Most engine materials are banished."},{"title":"Turn 2 — Toon","lp":"Kewl Tune 8000 — Toon 7400","actions":["Maliss in Underground banishes Maliss P Dormouse. Dormouse and Maliss P White Rabbit each pay 300 LP to Special Summon; White Rabbit Sets Maliss C MTP-07.","Funny Dark Rabbit is Normal Summoned and establishes Toon World the Perfect World.","Funny’s additional Normal Summon is used for Comic Cat.","Comic Cat Tributes Kewl Tune RS as cost and Special Summons Evil Box from the Deck. Evil Box Sets Toon Terror.","MTP-07 adds Maliss P March Hare. The Maliss bodies and Funny Link Summon Maliss Q Hearts Crypter.","Kewl Tune Playlist has no valid GY Tuner target because Dimension Shifter banished the Synchro materials.","Hearts Crypter shuffles Dormouse into the Deck and banishes Track Maker.","Toon attacks, leaving Kewl Tune with only JJ “Kewl Tune” and the inactive Playlist."],"audit":"Comic Cat removes RS before Toon commits Hearts Crypter. Toon preserves Hearts as interaction and a future 5000 ATK attacker instead of making Accesscode into an already weakened board.","endBoard":"Toon: Hearts Crypter pointing to Evil Box, Perfect World, Toon Terror. Kewl Tune: JJ “Kewl Tune” and Set Playlist."},{"title":"Turn 3 — Kewl Tune","lp":"Kewl Tune 2600 — Toon 7400","actions":["Dimension Shifter expires, but Kewl Tune has no GY engine because the first-turn cards were banished.","Kewl Tune Synchro attempts to add Kewl Tune Reco and begin a new line.","Toon Terror negates and destroys Kewl Tune Synchro.","Kewl Tune cannot assemble two bodies and passes."],"audit":"Toon Terror is held for the Spell that creates both a search and an immediate Synchro Summon, rather than being spent on the first Normal Summon.","endBoard":"Kewl Tune remains at 2600 LP with no monsters."},{"title":"Turn 4 — Toon","lp":"Kewl Tune 0 — Toon 6500","actions":["MTP-07 adds March Hare and banishes Hearts Crypter during resolution.","Hearts pays 900 LP, Special Summons itself, and doubles to 5000 ATK.","Perfect World searches Funny Dark Rabbit, and the Toon attackers finish Game 1."],"audit":"The 5000 ATK Hearts line remains more damage-efficient than consuming the supporting monsters for Accesscode Talker.","endBoard":"Toon wins Game 1."}],"decidingFactor":"Dimension Shifter banishes every Kewl Tune Synchro Material, eliminating the GY effects and Playlist targets that normally let Kewl Tune play through a removal exchange."},{"title":"Game 2","winner":"Kewl Tune","firstPlayer":"Kewl Tune","sideDeck":{"Kewl Tune":"Adds Called by the Grave and Crossout Designator-style protection for Dimension Shifter while retaining the full Tuner count.","Toon":"Keeps Dimension Shifter and adds Forbidden Droplet plus Infinite Impermanence."},"openingHands":{"Kewl Tune":["Called by the Grave","Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Cue","Kewl Tune Synchro"],"Toon":["Dimension Shifter","Maliss in Underground","Funny Dark Rabbit","Forbidden Droplet","Infinite Impermanence"]},"turns":[{"title":"Turn 1 — Kewl Tune","lp":"Kewl Tune 8000 — Toon 8000","actions":["Toon activates Dimension Shifter during the Standby Phase.","Kewl Tune chains Called by the Grave, banishes Dimension Shifter from the GY, and negates its effect.","Kewl Tune Rotary grants an additional Normal Summon. Kewl Tune Mix and Kewl Tune Cue begin the full Tuner sequence.","Cue Special Summons Kewl Tune Clip. Cue plus Rotary Synchro Summon Kewl Tune Track Maker.","Track Maker adds JJ “Kewl Tune”. Kewl Tune Synchro adds Kewl Tune Reco and produces Kewl Tune Loudness War.","A second Synchro line produces Kewl Tune RS, and Kewl Tune Remix is established as the opponent-turn conversion piece.","Kewl Tune ends without summoning Kewl Tune B2B."],"audit":"Called by the Grave is used immediately because Dimension Shifter is the only card that changes the entire architecture of the Kewl Tune turn. B2B is delayed so Loudness War, RS, and Remix can absorb the first three interactions separately.","endBoard":"Kewl Tune: Loudness War, RS, Remix, JJ “Kewl Tune”; Reco and other Tuners in the GY."},{"title":"Turn 2 — Toon","lp":"Kewl Tune 8000 — Toon 7400","actions":["Maliss in Underground produces Dormouse and White Rabbit, costing 600 LP. White Rabbit Sets MTP-07.","Kewl Tune RS negates Dormouse’s Deck-banish effect, limiting the number of free Maliss bodies.","Funny Dark Rabbit is Normal Summoned and establishes Perfect World.","Toon activates Forbidden Droplet, sending Underground and a spare card to negate RS and Loudness War.","MTP-07 adds March Hare, and Toon assembles Maliss Q Hearts Crypter.","Kewl Tune Remix Tributes itself, returns Kewl Tune Reco to the hand, Special Summons Kewl Tune Mix, and immediately Synchro Summons Kewl Tune B2B using the recovered Tuner line.","Hearts Crypter activates to banish B2B. B2B chains, Special Summons Reco, and Synchro Summons Baronne de Fleur before leaving the field.","Baronne negates Hearts Crypter’s activation and destroys it.","Toon ends with Perfect World and one small monster but no Hearts interaction."],"audit":"Forbidden Droplet defeats the first layer, but Remix is intentionally held outside that layer. B2B then converts Hearts Crypter’s Quick Effect into Baronne de Fleur, turning Toon’s removal attempt into Kewl Tune’s fourth interruption.","endBoard":"Kewl Tune: B2B, Baronne de Fleur, JJ “Kewl Tune”. Toon: Perfect World and one small monster."},{"title":"Turn 3 — Kewl Tune","lp":"Kewl Tune 8000 — Toon 0","actions":["Baronne destroys Toon’s remaining monster.","Kewl Tune Synchro produces Kewl Tune Crackle and clears Perfect World before combat.","B2B, Baronne, Crackle, and the Tuners attack for lethal."],"audit":"Perfect World is removed before combat so Toon cannot temporarily banish a Toon monster during a removal effect or preserve a search target.","endBoard":"Kewl Tune wins Game 2."}],"decidingFactor":"Called by the Grave restores the normal Kewl Tune graveyard engine, and Remix produces B2B only after Toon has spent Forbidden Droplet on the first Synchro layer."},{"title":"Game 3","winner":"Kewl Tune","firstPlayer":"Toon","sideDeck":{"Toon":"Chooses to play first and retains the maximum Toon Terror plus Hearts Crypter configuration.","Kewl Tune":"Adds Cosmic Cyclone, Dark Ruler No More, and Evenly Matched as three distinct must-answer cards."},"openingHands":{"Toon":["Maliss in Underground","Funny Dark Rabbit","Evil Box","Toon Terror","Infinite Impermanence"],"Kewl Tune":["Cosmic Cyclone","Dark Ruler No More","Evenly Matched","Kewl Tune Rotary","Kewl Tune Mix"]},"turns":[{"title":"Turn 1 — Toon","lp":"Toon 7400 — Kewl Tune 8000","actions":["Maliss in Underground produces Dormouse and White Rabbit, costing 600 LP. White Rabbit Sets MTP-07.","Funny Dark Rabbit is Normal Summoned and establishes Perfect World.","Evil Box Special Summons itself and Sets a second Toon Terror.","Dormouse, White Rabbit, and Funny Link Summon Maliss Q Hearts Crypter.","Toon Sets both Toon Terror copies, MTP-07, and Infinite Impermanence."],"audit":"Toon prioritizes two Counter Traps and Hearts Crypter rather than a higher-damage Link Monster because Kewl Tune is playing second with a known Side Deck.","endBoard":"Toon: Hearts Crypter pointing to Evil Box, Perfect World, two Toon Terror copies, MTP-07, Infinite Impermanence."},{"title":"Turn 2 — Kewl Tune","lp":"Toon 7400 — Kewl Tune 8000","actions":["During the Draw Phase, Kewl Tune activates Cosmic Cyclone targeting Perfect World.","Toon chains the first Toon Terror and negates Cosmic Cyclone.","During Main Phase 1, Kewl Tune activates Dark Ruler No More.","Toon chains the second Toon Terror and negates Dark Ruler No More.","Kewl Tune enters the Battle Phase without controlling a card and activates Evenly Matched at the end of the Battle Phase.","Toon has no Counter Trap remaining. Toon keeps Hearts Crypter and banishes Perfect World, Evil Box, MTP-07, Infinite Impermanence, and the remaining cards face-down.","In Main Phase 2, Rotary grants the additional Normal Summon. Mix is Normal Summoned and adds Kewl Tune Cue.","Cue is Normal Summoned and Special Summons Kewl Tune Clip. The line produces Track Maker, Loudness War, and Kewl Tune RS.","Kewl Tune ends with multiple Synchro interactions against the isolated Hearts Crypter."],"audit":"None of the three board breakers is redundant. Cosmic Cyclone and Dark Ruler force the two Toon Terrors; Evenly Matched then resolves as the third layer and removes every card except Hearts.","endBoard":"Kewl Tune: Loudness War, RS, Track Maker, JJ “Kewl Tune”. Toon: Hearts Crypter only."},{"title":"Turn 3 — Toon","lp":"Toon 7400 — Kewl Tune 8000","actions":["Hearts Crypter activates and attempts to banish Kewl Tune Loudness War.","Kewl Tune RS negates Hearts Crypter.","Kewl Tune Loudness War uses the material-effect package to remove Hearts Crypter from the field before Toon can rebuild Perfect World.","Toon sets a defensive card and passes."],"audit":"Kewl Tune answers Hearts with RS first, preserving the larger Synchro conversion effects for the Toon card drawn after Evenly Matched.","endBoard":"Kewl Tune retains three monsters. Toon has no monster."},{"title":"Turn 4 — Kewl Tune","lp":"Toon 0 — Kewl Tune 8000","actions":["Kewl Tune Synchro produces Kewl Tune B2B and Kewl Tune Reco supplies Baronne de Fleur.","B2B, Baronne, and the existing Synchro monsters attack for lethal."],"audit":"B2B is introduced only after Hearts Crypter and both Counter Traps have been exhausted.","endBoard":"Kewl Tune wins Game 3 and the match 2–1."}],"decidingFactor":"Kewl Tune treats the two Toon Terrors as two separate resources, forces both with Cosmic Cyclone and Dark Ruler No More, and resolves Evenly Matched as the third board breaker."}],"analysis":["Kewl Tune wins 2–1 and remains undefeated at 4–0.","Dimension Shifter is the single strongest Toon card in the matchup because it suppresses the Synchro-material effects and Playlist targets at the same time.","Kewl Tune’s best response is direct protection for the Shifter window, not a generic monster negate after the materials have already been banished.","Going second, the optimal plan is layered board breaking: two cards consume two Toon Terrors, and the third card resolves."]},{"id":"r4-m3-dark-magician-elfnote","round":"Round 4","title":"Dark Magician vs. Elfnote","players":["Dark Magician","Elfnote"],"score":"Elfnote 2–1","status":"complete","detailLevel":"full","context":["Dark Magician attempts to use Secret Village of the Spellcasters and Dimensional Barrier to prevent Elfnote from starting its Synchro engine.","Elfnote uses the complete center-zone package: June Pride, Seraphim Strelitzia, Aristeia of Trust, Quatrain of Succession, and Junora the Power Patron of Tuning.","The deciding game tests three separate board breakers against Elfnote’s Trap and Synchro layers."],"games":[{"title":"Game 1","winner":"Elfnote","firstPlayer":"Elfnote","openingHands":{"Elfnote":["Elfnote Tinia","Elfnote Power Patron","Elfnotes: Welcome Home","Elfnotes: Aristeia of Trust","Elfnotes: Quatrain of Succession"],"Dark Magician":["Magician’s Rod","Magicians’ Souls","Dark Magical Circle","Dark Magical Curtain","Harpie’s Feather Duster"]},"turns":[{"title":"Turn 1 — Elfnote","lp":"Elfnote 8000 — Dark Magician 8000","actions":["Elfnote Tinia Special Summons itself to the center Main Monster Zone and places Elfnotes: A Plea for Help from the Deck.","Elfnotes: Welcome Home sends an Elfnote monster from the hand to the GY and Special Summons Elfnote Lucina from the Deck.","Lucina adds Elfnote Fortuna. Elfnote Power Patron is Normal Summoned and raises Tinia’s Level.","Power Patron and Tinia Synchro Summon Elfnote June Pride.","June Pride returns itself to the Extra Deck and deploys Fortuna, Elfnote Regina, and Tinia from three different locations.","Fortuna places Elfnotes: Rhapsodia of Madness. Regina moves to the center zone and Special Summons another Level 6 Elfnote.","Elfnotes: Quatrain of Succession creates an Elfnote Seraphim Token. The Token and a Level 6 monster Synchro Summon Elfnote Seraphim Strelitzia into the center zone.","Elfnote Sets Elfnotes: Aristeia of Trust."],"audit":"Elfnote does not stop at June Pride. Strelitzia gives the deck an opponent-turn Summon and Level modulation, while three differently named Elfnote monsters make Aristeia a live Spell/Trap negate.","endBoard":"Elfnote: Strelitzia in the center, Fortuna, Regina, Lucina; A Plea for Help, Welcome Home, Rhapsodia; Set Aristeia."},{"title":"Turn 2 — Dark Magician","lp":"Elfnote 8000 — Dark Magician 8000","actions":["Dark Magician activates Harpie’s Feather Duster.","Elfnote chains Aristeia of Trust. Because Elfnote controls at least three Elfnote monsters and a Synchro Monster, Aristeia negates Duster and destroys it.","Dark Magical Circle is activated. Magician’s Rod is Normal Summoned and activates to search.","Elfnote Lucina rotates into the center zone and returns Magician’s Rod to the hand after its effect has activated. Rod still adds Soul Servant.","Magicians’ Souls sends Dark Magician from the Deck to the GY and Special Summons itself.","Dark Magical Curtain attempts to Special Summon Dark Magician from the Deck.","Elfnote Fortuna rotates and returns Dark Magical Circle to the hand before the Summon can generate Circle interaction.","Strelitzia Special Summons Elfnote Tinia from the GY and reduces the Levels of the Level 4-or-higher monsters, preventing the intended Rank 7 conversion.","Dark Magician ends with Magicians’ Souls and one Set card."],"audit":"Elfnote assigns a different effect to each resource: Aristeia stops the mass back-row removal, Lucina removes the Normal Summon body, Fortuna removes Circle, and Strelitzia changes the Extra Deck mathematics.","endBoard":"Elfnote retains Strelitzia and three Level 6 monsters. Dark Magician controls Magicians’ Souls and one Set card."},{"title":"Turn 3 — Elfnote","lp":"Elfnote 8000 — Dark Magician 0","actions":["Rhapsodia revives Elfnote Power Patron and prepares the center-zone Synchro line.","Power Patron and the available monsters Synchro Summon Junora the Power Patron of Tuning.","Junora negates every face-up card Dark Magician controls.","Junora, Strelitzia, Fortuna, and Regina attack for lethal."],"audit":"Junora is summoned only after Dark Magician has committed a face-up monster, maximizing the mass-negate effect.","endBoard":"Elfnote wins Game 1."}],"decidingFactor":"Elfnote presents more independent interaction layers than Dark Magician can remove with one Duster and one Circle turn."},{"title":"Game 2","winner":"Dark Magician","firstPlayer":"Dark Magician","sideDeck":{"Dark Magician":"Adds Secret Village of the Spellcasters, Dimensional Barrier, and Solemn Judgment.","Elfnote":"Adds Cosmic Cyclone, Evenly Matched, and Dark Ruler No More for the draw."},"openingHands":{"Dark Magician":["Magicians’ Souls","Magician’s Rod","Dark Magical Circle","Secret Village of the Spellcasters","Dimensional Barrier"],"Elfnote":["Elfnote Tinia","Elfnote Power Patron","Cosmic Cyclone","Evenly Matched","Elfnotes: Welcome Home"]},"turns":[{"title":"Turn 1 — Dark Magician","lp":"Dark Magician 8000 — Elfnote 8000","actions":["Magicians’ Souls sends Dark Magician to the GY and Special Summons itself.","Dark Magical Circle is activated and adds Soul Servant from the top three cards.","Magician’s Rod is Normal Summoned and adds Dark Magical Curtain.","Soul Servant places Dark Magician, the Pharaoh’s Servant on top of the Deck and then draws it.","Pharaoh’s Servant Special Summons itself, Sets The Gaze of Timaeus, and is then banished under its alternate route to Special Summon Dark Magician of Destruction.","Dark Magician of Destruction adds Secrets of Dark Magic.","Dark Magician activates Secret Village of the Spellcasters and Sets Dimensional Barrier."],"audit":"Dark Magician of Destruction is preserved as the Spellcaster that maintains Secret Village. The lock is backed by Dimensional Barrier rather than another reactive monster.","endBoard":"Dark Magician: Dark Magician of Destruction, Magicians’ Souls, Magician’s Rod, Circle, Secret Village, Set The Gaze of Timaeus, Set Dimensional Barrier."},{"title":"Turn 2 — Elfnote","lp":"Dark Magician 8000 — Elfnote 8000","actions":["Secret Village prevents Cosmic Cyclone and Elfnotes: Welcome Home from being activated because Elfnote controls no Spellcaster.","Elfnote Tinia Special Summons itself to the center zone. Elfnote Power Patron is Normal Summoned and attempts to begin the Synchro line.","Dark Magician activates Dimensional Barrier and declares Synchro.","Elfnote cannot Synchro Summon for the remainder of the turn and cannot use its locked Spells to replace the stopped line.","Elfnote sets one card and passes."],"audit":"Dimensional Barrier is held until Tinia and Power Patron are both committed, preventing Elfnote from preserving the Normal Summon for another line.","endBoard":"Elfnote: Tinia, Power Patron, one Set card. Dark Magician retains the full lock."},{"title":"Turn 3 — Dark Magician","lp":"Dark Magician 8000 — Elfnote 0","actions":["The Gaze of Timaeus uses Dark Magician of Destruction—currently named Dark Magician—to Fusion Summon Red-Eyes Dark Dragoon.","Dark Magical Circle and Dragoon remove Tinia and Power Patron.","Dragoon, Magicians’ Souls, Magician’s Rod, and the remaining Dark Magician Extra Deck pressure produce lethal damage."],"audit":"Dark Magician converts the single locked turn into damage rather than spending resources on a second control board.","endBoard":"Dark Magician wins Game 2."}],"decidingFactor":"Secret Village blocks Elfnote’s Spell engine and Dimensional Barrier declares the only Extra Deck mechanic Elfnote can access with its exposed monsters."},{"title":"Game 3","winner":"Elfnote","firstPlayer":"Elfnote","sideDeck":{"Elfnote":"Adds Solemn Judgment to protect the completed board from Evenly Matched while keeping Aristeia for ordinary Spell/Trap removal.","Dark Magician":"Keeps Harpie’s Feather Duster, Dark Ruler No More, and Evenly Matched as a three-card breaking package."},"openingHands":{"Elfnote":["Elfnote Tinia","Elfnote Power Patron","Elfnotes: Welcome Home","Elfnotes: Aristeia of Trust","Solemn Judgment"],"Dark Magician":["Harpie’s Feather Duster","Dark Ruler No More","Evenly Matched","Magician’s Rod","Dark Magical Curtain"]},"turns":[{"title":"Turn 1 — Elfnote","lp":"Elfnote 8000 — Dark Magician 8000","actions":["Tinia, Welcome Home, Lucina, and Elfnote Power Patron produce Elfnote June Pride.","June Pride deploys Elfnote Fortuna, Elfnote Regina, and Tinia from three different locations.","Fortuna places Elfnotes: Rhapsodia of Madness. Regina produces the fourth Elfnote body.","The Token line Synchro Summons Elfnote Seraphim Strelitzia into the center zone.","Elfnote Sets Aristeia of Trust and Solemn Judgment."],"audit":"Elfnote deliberately keeps one Counter Trap separate from Aristeia. Aristeia is the answer to removal; Solemn Judgment is reserved for Evenly Matched.","endBoard":"Elfnote: Strelitzia, Fortuna, Regina, Lucina; Welcome Home, Rhapsodia; Set Aristeia and Judgment."},{"title":"Turn 2 — Dark Magician","lp":"Elfnote 4000 — Dark Magician 8000","actions":["Dark Magician activates Harpie’s Feather Duster.","Elfnote chains Aristeia of Trust and negates Duster.","Dark Magician activates Dark Ruler No More. Elfnote’s monsters are negated for the turn, but the continuous Traps remain available.","Dark Magician enters the Battle Phase without controlling a card and activates Evenly Matched at the end of the Battle Phase.","Elfnote chains Solemn Judgment, pays 4000 LP, and negates Evenly Matched.","In Main Phase 2, Magician’s Rod is Normal Summoned and adds Soul Servant.","Dark Magical Curtain Special Summons Dark Magician from the Deck, but Circle is not yet face-up and no banish trigger is created.","Dark Magician of Destruction is produced through the alternate Extra Deck route, but the negated Elfnote monsters remain physically present as a four-monster wall.","Dark Magician ends without lethal."],"audit":"Dark Ruler resolves, but it does not remove the monsters. By assigning Aristeia to Duster and Judgment to Evenly, Elfnote survives the entire breaking package with every monster still present.","endBoard":"Elfnote retains four monsters at 4000 LP. Dark Magician controls Dark Magician of Destruction and Magician’s Rod."},{"title":"Turn 3 — Elfnote","lp":"Elfnote 4000 — Dark Magician 0","actions":["The effects negated by Dark Ruler No More return.","Strelitzia Special Summons Elfnote Power Patron and adjusts the Levels for the center-zone Synchro line.","Power Patron and the available monsters Synchro Summon Junora the Power Patron of Tuning.","Junora negates Dark Magician of Destruction, Magician’s Rod, and every other face-up card Dark Magician controls.","Junora’s column effect prevents Dark Magician’s monsters from being converted into emergency Extra Deck material.","Junora, Strelitzia, Fortuna, and Regina attack for lethal."],"audit":"Elfnote does not use Junora before Dark Magician commits its face-up Extra Deck monster. The delayed Synchro makes the mass negate cover the maximum number of cards.","endBoard":"Elfnote wins Game 3 and the match 2–1."}],"decidingFactor":"Elfnote assigns Aristeia to Duster and Solemn Judgment to Evenly Matched. Dark Ruler No More suppresses effects for one turn but leaves the full monster board available for Junora on the following turn."}],"analysis":["Elfnote wins 2–1 and moves to 2–2.","Dark Magician’s Secret Village plus Dimensional Barrier plan remains powerful when it goes first.","Elfnote’s completed board has interaction in both the monster zone and Spell/Trap zone, so one broad board breaker is not enough.","The deciding game is won by role assignment: Aristeia answers Duster, Judgment answers Evenly, and the monsters simply survive Dark Ruler until their effects return."]},{"id":"r4-m4-sky-striker-toon-turbo","round":"Round 4","title":"Sky Striker vs. Toon Turbo","players":["Sky Striker","Toon Turbo"],"score":"Sky Striker 2–1","status":"complete","detailLevel":"full","context":["Toon Turbo uses its submitted Dark Magician and Blue-Eyes Toon Fusion package rather than the Maliss-heavy line used by the separate Toon deck.","Sky Striker attempts to convert Widow Anchor’s temporary control into permanent removal by using the borrowed Fusion Monster as Link Material.","The deciding Side Deck game uses Cosmic Cyclone, Dark Ruler No More, and Evenly Matched as three separate checks against Toon Terror and Solemn Judgment."],"games":[{"title":"Game 1","winner":"Toon Turbo","firstPlayer":"Toon Turbo","openingHands":{"Toon Turbo":["Funny Dark Rabbit","Comic Cat","Evil Box","Toon Dark Magician","Mind Scan"],"Sky Striker":["Sky Striker Ace - Raye","Sky Striker Mobilize – Engage!","Sky Striker Mecha – Widow Anchor","Sky Striker Mecha – Linkage!","Radiant Typhoon Vision"]},"turns":[{"title":"Turn 1 — Toon Turbo","lp":"Toon Turbo 8000 — Sky Striker 8000","actions":["Funny Dark Rabbit is Normal Summoned, establishes Toon World the Perfect World, and grants the additional Normal Summon for Comic Cat.","Evil Box Special Summons itself and Sets Toon Terror.","Perfect World searches Toon Dark Magician.","The Toon Dark Magician engine produces Dark Magician of Destruction, which adds a Dark Magician support card.","Evil Box and an extender Link Summon I:P Masquerena.","Toon Turbo Sets Mind Scan and Toon Terror."],"audit":"Toon Turbo stops on a replaceable Fusion body and I:P instead of committing Blue-Eyes Toon Ultimate Dragon into an unknown hand containing Widow Anchor.","endBoard":"Toon Turbo: Dark Magician of Destruction, Comic Cat, I:P Masquerena, Perfect World, Set Mind Scan, Set Toon Terror."},{"title":"Turn 2 — Sky Striker","lp":"Toon Turbo 8000 — Sky Striker 6500","actions":["Mind Scan is activated during the Standby Phase and reveals Sky Striker’s hand.","Mind Scan declares Sky Striker Mobilize – Engage! before Engage is activated, negating every Engage activation for the turn.","Sky Striker Normal Summons Sky Striker Ace - Raye and Link Summons Sky Striker Ace – Hayate.","Hayate attacks directly for 1500 and sends Sky Striker Maneuver - Afterburners! to the GY.","Sky Striker activates Sky Striker Mecha – Linkage!. Toon Terror negates and destroys Linkage.","During the End Phase, I:P Masquerena and Dark Magician of Destruction Link Summon S:P Little Knight.","S:P Little Knight banishes Hayate until the next End Phase, preventing a Kagari conversion on the following turn."],"audit":"Mind Scan declares Engage rather than Widow Anchor because the search-and-draw engine is the card that would produce multiple replacement Spells. Toon Terror is held for Linkage, the effect that clears the Main Monster Zone and changes Link identity.","endBoard":"Toon Turbo: S:P Little Knight, Comic Cat, Perfect World. Sky Striker: Hayate temporarily banished and no active Link Monster."},{"title":"Turn 3 — Toon Turbo","lp":"Toon Turbo 8000 — Sky Striker 0","actions":["Perfect World searches Evil Box. Evil Box Special Summons itself and Sets another Toon Trap.","Comic Cat Tributes itself and Special Summons Toon Dark Magician from the Deck.","The Fusion line produces Blue-Eyes Toon Ultimate Dragon after Widow Anchor and Linkage have been identified and disrupted.","S:P Little Knight removes Sky Striker’s remaining set interaction.","Blue-Eyes Toon Ultimate Dragon, Evil Box, and the remaining attackers produce lethal damage."],"audit":"The large Fusion Monster is introduced only after the hand is known through Mind Scan and Linkage has been negated.","endBoard":"Toon Turbo wins Game 1."}],"decidingFactor":"Mind Scan suppresses Engage, Toon Terror stops Linkage, and I:P becomes S:P before Sky Striker can convert Hayate into Kagari."},{"title":"Game 2","winner":"Sky Striker","firstPlayer":"Sky Striker","sideDeck":{"Sky Striker":"Adds Cosmic Cyclone and Solemn Judgment while increasing access to Widow Anchor.","Toon Turbo":"Adds Harpie’s Feather Duster, Droll & Lock Bird, and Toon Terror."},"openingHands":{"Sky Striker":["Sky Striker Ace - Raye","Sky Striker Ace - Roze","Sky Striker Mobilize – Engage!","Sky Striker Mecha – Widow Anchor","Cosmic Cyclone"],"Toon Turbo":["Harpie’s Feather Duster","Funny Dark Rabbit","Toon Bookmark","Toon Dark Magician","Comic Cat"]},"turns":[{"title":"Turn 1 — Sky Striker","lp":"Sky Striker 8000 — Toon Turbo 8000","actions":["Engage adds Sky Striker Mecha – Linkage!.","Raye is Normal Summoned. Roze Special Summons itself.","Raye and Roze Link Summon Sky Striker Ace – Zero.","Zero adds Sky Striker Maneuver - Afterburners!.","Sky Striker Sets Widow Anchor, Linkage, and Cosmic Cyclone."],"audit":"Zero uses its search effect on Sky Striker’s turn and therefore retains its Tribute effect for Toon Turbo’s turn, because the once-per-turn choice resets on the new turn.","endBoard":"Sky Striker: Zero and three Set Spells."},{"title":"Turn 2 — Toon Turbo","lp":"Sky Striker 8000 — Toon Turbo 8000","actions":["Toon Turbo activates Harpie’s Feather Duster.","Sky Striker chains Linkage, sends Widow Anchor to the GY, and converts Zero into Sky Striker Ace – Kagari.","Kagari returns Engage from the GY.","Cosmic Cyclone is chained before Duster resolves and banishes Toon Bookmark.","Duster resolves after the chained Spells have left the field and destroys no remaining card.","Funny Dark Rabbit is Normal Summoned and establishes Perfect World. Comic Cat is Normal Summoned through Funny’s additional Summon.","Toon Dark Magician is Special Summoned and produces Dark Magician of Destruction.","The recovered Engage adds a second Widow Anchor after Sky Striker reaches the required Spell count.","Widow Anchor negates Dark Magician of Destruction and takes control of it.","Kagari and the borrowed Dark Magician of Destruction Link Summon Sky Striker Ace – Zeke.","Zeke temporarily banishes Comic Cat. Toon Turbo ends with Perfect World and Funny but no Extra Deck monster."],"audit":"Sky Striker intentionally sends the first Widow Anchor with Linkage. Kagari recovers Engage, which finds the second Anchor after Dark Magician of Destruction has been committed. The borrowed Fusion Monster then becomes permanent Zeke material.","endBoard":"Sky Striker: Zeke and follow-up Spells. Toon Turbo: Perfect World and Funny Dark Rabbit."},{"title":"Turn 3 — Sky Striker","lp":"Sky Striker 8000 — Toon Turbo 0","actions":["Afterburners destroys Funny Dark Rabbit and removes Perfect World after the third Spell is established in the GY.","Zeke converts through Sky Striker Ace – Camellia, Kagari, and Sky Striker Ace – Hayate.","Linkage provides the final Link conversion and additional attack.","The Sky Striker Link ladder attacks for lethal."],"audit":"Perfect World is destroyed before combat, preventing Toon Turbo from restoring its Toon status or using a protected search target.","endBoard":"Sky Striker wins Game 2."}],"decidingFactor":"Linkage preserves value through Duster, and the second Widow Anchor converts Dark Magician of Destruction into Zeke rather than merely negating it."},{"title":"Game 3","winner":"Sky Striker","firstPlayer":"Toon Turbo","sideDeck":{"Toon Turbo":"Chooses to play first and keeps Toon Terror plus Solemn Judgment behind its maximum Fusion board.","Sky Striker":"Adds Cosmic Cyclone, Dark Ruler No More, and Evenly Matched as three separate board-breaking layers."},"openingHands":{"Toon Turbo":["Funny Dark Rabbit","Evil Box","Toon Dark Magician","Toon Terror","Solemn Judgment"],"Sky Striker":["Cosmic Cyclone","Dark Ruler No More","Evenly Matched","Sky Striker Ace - Raye","Sky Striker Mobilize – Engage!"]},"turns":[{"title":"Turn 1 — Toon Turbo","lp":"Toon Turbo 8000 — Sky Striker 8000","actions":["Funny Dark Rabbit establishes Perfect World and grants the additional Normal Summon for Comic Cat.","Evil Box Special Summons itself and Sets Toon Terror.","The Toon Dark Magician line produces Dark Magician of Destruction and Blue-Eyes Toon Ultimate Dragon.","Evil Box and an extender Link Summon I:P Masquerena.","Toon Turbo Sets Toon Terror and Solemn Judgment."],"audit":"Toon Turbo presents its highest-pressure board because it is playing first in the deciding game. The cost is that most of the hand is committed to the field.","endBoard":"Toon Turbo: Blue-Eyes Toon Ultimate Dragon, Dark Magician of Destruction, I:P Masquerena, Comic Cat, Perfect World, Set Toon Terror, Set Solemn Judgment."},{"title":"Turn 2 — Sky Striker","lp":"Toon Turbo 4000 — Sky Striker 8000","actions":["During the Draw Phase, Sky Striker activates Cosmic Cyclone targeting Perfect World.","Toon Turbo chains Toon Terror and negates Cosmic Cyclone.","During Main Phase 1, Sky Striker activates Dark Ruler No More.","Toon Turbo chains Solemn Judgment, pays half its LP, and negates Dark Ruler No More.","Sky Striker enters the Battle Phase without controlling a card and activates Evenly Matched at the end of the Battle Phase.","Toon Turbo has no remaining Spell/Trap negate. It keeps Blue-Eyes Toon Ultimate Dragon and banishes every other field card face-down.","In Main Phase 2, Engage adds Sky Striker Mecha – Widow Anchor.","Raye is Normal Summoned and Link Summons Sky Striker Ace – Hayate. Hayate loads a Sky Striker Spell and is converted into Sky Striker Ace – Kagari.","Kagari returns Engage. The second Engage adds Sky Striker Mecha – Linkage! and draws after the third Spell reaches the GY.","Sky Striker Sets Widow Anchor and ends."],"audit":"Cosmic Cyclone and Dark Ruler are not expected to resolve. Their job is to consume Toon Terror and Solemn Judgment so Evenly Matched can compress the maximum board to one Fusion Monster.","endBoard":"Sky Striker: Kagari and Set Widow Anchor. Toon Turbo: Blue-Eyes Toon Ultimate Dragon, 4000 LP."},{"title":"Turn 3 — Toon Turbo","lp":"Toon Turbo 4000 — Sky Striker 8000","actions":["Blue-Eyes Toon Ultimate Dragon attempts to attack and rebuild the Toon pressure.","Sky Striker activates Widow Anchor, negates the Fusion Monster, and takes control because three Spells are in the GY.","Kagari and the borrowed Blue-Eyes Toon Ultimate Dragon Link Summon Sky Striker Ace – Zeke.","The Fusion Monster is permanently removed from Toon Turbo’s field as Link Material.","Zeke temporarily banishes the defensive monster Toon Turbo Normal Summons after losing the Fusion Monster."],"audit":"Widow Anchor is not spent in Sky Striker’s own End Phase. It is reserved for the attack declaration, when taking the sole retained Fusion Monster removes Toon Turbo’s only meaningful card and supplies Zeke material.","endBoard":"Sky Striker: Zeke and multiple Spells. Toon Turbo: no active monster."},{"title":"Turn 4 — Sky Striker","lp":"Toon Turbo 0 — Sky Striker 8000","actions":["Zeke converts into Camellia, Hayate, and Kagari through Linkage.","Afterburners removes the returned defensive monster.","The Link ladder attacks for lethal."],"audit":"No control resource is held back because Toon Turbo has no remaining Field Spell, Counter Trap, or Fusion Monster.","endBoard":"Sky Striker wins Game 3 and the match 2–1."}],"decidingFactor":"Sky Striker uses two board breakers to consume Toon Turbo’s two negates, resolves Evenly Matched as the third layer, and turns the one retained Fusion Monster into Zeke with Widow Anchor."}],"analysis":["Sky Striker wins 2–1 and moves to 2–2.","Toon Turbo wins when Mind Scan and Toon Terror prevent the first Engage–Linkage loop.","Sky Striker’s best removal is conversion: Widow Anchor takes Dark Magician of Destruction or Blue-Eyes Toon Ultimate Dragon, then Zeke turns temporary control into permanent removal.","The deciding game is another example of layered board breaking. Two negates cannot answer three independently timed Spells."]},{"id":"r5-m1-power-patron-toon","round":"Round 5","title":"Power Patron vs. Toon","players":["Power Patron","Toon"],"score":"Power Patron 2–1","status":"complete","detailLevel":"full","context":["Power Patron enters at 3–1; Toon enters at 2–2.","The matchup turns on whether Toon can keep Perfect World and Toon Terror active long enough to prevent Nerva, Diactorus, and Vidolium from converting the board.","Power Patron sides Cosmic Cyclone and Book of Eclipse; Toon sides Dimension Shifter, Mind Scan, and Evenly Matched."],"games":[{"title":"Game 1","winner":"Toon","firstPlayer":"Toon","openingHands":{"Toon":["Dimension Shifter","Maliss in Underground","Funny Dark Rabbit","Evil Box","Toon Terror"],"Power Patron":["Artmage Vandalism -Assault-","Medius the Pure","Plundered Power Patron Plane – Vidolia","Artmage Impasto -Recapture-","Theorealize Liberation"]},"turns":[{"title":"Turn 1 — Toon","lp":"Toon 7400 — Power Patron 8000","actions":["Toon activates Dimension Shifter before committing cards.","Maliss in Underground banishes Dormouse; Dormouse and White Rabbit return for 600 LP, and White Rabbit Sets MTP-07.","Funny Dark Rabbit is Normal Summoned, establishes Toon World the Perfect World, and grants the additional Normal Summon.","Evil Box Special Summons itself and Sets Toon Terror.","Dormouse, White Rabbit, and Funny Link Summon Maliss Q Hearts Crypter.","Toon ends on Hearts Crypter pointing to Evil Box, Perfect World, Toon Terror, and MTP-07."],"audit":"Dimension Shifter is the correct opener because Power Patron relies on Nervedo and other face-up Extra Deck/GY transitions. Hearts is held as the primary removal body rather than converted into a damage-only Link.","endBoard":"Toon: Hearts Crypter, Evil Box, Perfect World, Toon Terror, MTP-07."},{"title":"Turn 2 — Power Patron","lp":"Toon 6500 — Power Patron 8000","actions":["Vandalism adds Medius. Medius is Normal Summoned and attempts to Special Summon Power Patron DoomZ.","Toon Terror negates Medius and destroys it.","Vidolia reveals Nerva and Special Summons Nervedo from the Deck.","Nervedo banishes the top three cards face-down and destroys itself, but Dimension Shifter banishes it instead of allowing the normal face-up Extra Deck/GY follow-up.","Nerva is Fusion Summoned, but Hearts Crypter shuffles a banished Maliss card into the Deck and banishes Nerva.","Power Patron sets Impasto and passes with no face-up Artmage monster, leaving Impasto inactive."],"audit":"Toon Terror is spent on Medius, not Vandalism, because the monster effect creates the first additional body. Hearts then removes the actual boss after Power Patron has committed Vidolia.","endBoard":"Power Patron has only Set Impasto; Toon retains Hearts, Evil Box, and Perfect World."},{"title":"Turn 3 — Toon","lp":"Toon 6500 — Power Patron 0","actions":["MTP-07 adds March Hare and banishes Hearts Crypter.","Hearts pays 900 LP, Special Summons itself, and doubles to 5000 ATK.","Perfect World searches Comic Cat. Comic Cat removes the Set Impasto by forcing the remaining Power Patron resource off the field.","Hearts, Evil Box, March Hare, and Funny attack for lethal."],"audit":"Toon avoids unnecessary Link climbing. A 5000 ATK Hearts plus the existing bodies already exceeds lethal.","endBoard":"Toon wins Game 1."}],"decidingFactor":"Dimension Shifter breaks the Nervedo and Medius resource loop, while Toon Terror and Hearts answer the starter and boss in separate interactions."},{"title":"Game 2","winner":"Power Patron","firstPlayer":"Power Patron","sideDeck":{"Power Patron":"Adds Cosmic Cyclone, Book of Eclipse, and Forbidden Droplet; chooses to play first.","Toon":"Adds Evenly Matched and Harpie's Feather Duster."},"openingHands":{"Power Patron":["Artmage Vandalism -Assault-","Medius the Pure","Plundered Power Patron Plane – Vidolia","Prohibited Power Patron Portal - Terminus","Cosmic Cyclone"],"Toon":["Evenly Matched","Funny Dark Rabbit","Maliss in Underground","Toon Bookmark","Harpie's Feather Duster"]},"turns":[{"title":"Turn 1 — Power Patron","lp":"Power Patron 8000 — Toon 8000","actions":["Vandalism adds a second Medius. The first Medius is Normal Summoned and Special Summons Power Patron DoomZ.","Vidolia reveals Nerva and Special Summons Nervedo.","Nervedo destroys itself and Fusion Summons Nerva; its face-up Extra Deck effect Special Summons Artmage Power Patron.","Artmage Power Patron and DoomZ Fusion Summon Artmage Non-Finito.","Non-Finito Sets Artmage Impasto -Recapture-.","Terminus sends Jupredo to the GY. Power Patron Sets Cosmic Cyclone and Impasto."],"audit":"Power Patron preserves Medius beside Nerva and Non-Finito, giving Impasto a legal target and preserving an additional Fusion-material line.","endBoard":"Power Patron: Nerva, Non-Finito, Medius, Set Impasto, Set Cosmic Cyclone."},{"title":"Turn 2 — Toon","lp":"Power Patron 8000 — Toon 7400","actions":["Toon enters the Battle Phase and activates Evenly Matched.","Power Patron chains Impasto, temporarily banishing Non-Finito and negating Evenly Matched.","Toon activates Harpie's Feather Duster.","Power Patron chains Cosmic Cyclone to banish Toon Bookmark before Duster resolves; Duster clears the remaining set cards.","Maliss in Underground produces Dormouse and White Rabbit for 600 LP.","Funny Dark Rabbit establishes Perfect World.","Nerva is held until Toon commits Hearts Crypter and Evil Box.","When Non-Finito returns and its Artmage effect is activated, Nerva rewrites it into destruction of all cards Toon controls, clearing Hearts, Evil Box, Perfect World, and MTP-07."],"audit":"Impasto is assigned to Evenly Matched, the only card that would erase the entire board without targeting. Cosmic Cyclone then removes Bookmark so Toon cannot protect the Field Spell line.","endBoard":"Power Patron retains Nerva, Non-Finito, and Medius; Toon has no field."},{"title":"Turn 3 — Power Patron","lp":"Power Patron 8000 — Toon 0","actions":["Power Patron draws DoomZ and Normal Summons it.","DoomZ and Medius create DoomZ Break - Diactorus.","Diactorus clears Toon's final set card.","Nerva, Non-Finito, and Diactorus attack for lethal."],"audit":"Diactorus is used before combat to remove the only unknown defensive card.","endBoard":"Power Patron wins Game 2."}],"decidingFactor":"Power Patron assigns Impasto to Evenly Matched, preserves Nerva for the fully developed Toon board, and removes Bookmark before the Field Spell can be protected."},{"title":"Game 3","winner":"Power Patron","firstPlayer":"Toon","sideDeck":{"Toon":"Chooses to play first and adds Mind Scan plus a second Toon Terror.","Power Patron":"Retains Cosmic Cyclone, Forbidden Droplet, and Book of Eclipse."},"openingHands":{"Toon":["Funny Dark Rabbit","Comic Cat","Evil Box","Mind Scan","Toon Terror"],"Power Patron":["Cosmic Cyclone","Book of Eclipse","Forbidden Droplet","Medius the Pure","Artmage Vandalism -Assault-"]},"turns":[{"title":"Turn 1 — Toon","lp":"Toon 8000 — Power Patron 8000","actions":["Funny establishes Perfect World and grants an additional Normal Summon for Comic Cat.","Evil Box Special Summons itself and Sets a second Toon Terror.","Perfect World searches Toon Dark Magician.","Funny and Evil Box become I:P Masquerena while Comic Cat remains available as Tribute removal.","Toon Sets Mind Scan and both Toon Terror copies."],"audit":"Toon keeps Comic Cat on the field instead of using it as Link Material because it is the cleanest answer to Medius or Nerva without starting a Chain.","endBoard":"Toon: Comic Cat, I:P, Perfect World, Mind Scan, two Toon Terror."},{"title":"Turn 2 — Power Patron","lp":"Toon 8000 — Power Patron 8000","actions":["During the Draw Phase, Cosmic Cyclone targets Perfect World.","The first Toon Terror negates Cosmic Cyclone.","Power Patron activates Book of Eclipse.","The second Toon Terror negates Book of Eclipse.","Vandalism adds a second Medius.","Medius is Normal Summoned and activates; Comic Cat Tributes Medius as cost and Special Summons Funny Dark Rabbit from the Deck.","Power Patron chains Forbidden Droplet, sending Vandalism and a card from hand to negate Comic Cat's summoned Funny and I:P.","The second Medius is Special Summoned through the remaining Artmage line and produces Power Patron DoomZ.","Vidolia produces Nervedo, which Fusion Summons Nerva.","I:P is already negated, so Toon cannot convert it into S:P. Nerva and DoomZ clear the remaining monsters.","Power Patron establishes Non-Finito and Diactorus, ending with Toon stripped of both Counter Traps and its Link interaction."],"audit":"Cosmic Cyclone and Book of Eclipse are intentionally used as two separate Counter-Trap checks. Droplet is then reserved for Comic Cat's replacement body and I:P after the two Toon Terrors are gone.","endBoard":"Power Patron: Nerva, Non-Finito, Diactorus. Toon: no monsters and only Perfect World."},{"title":"Turn 3 — Toon","lp":"Toon 8000 — Power Patron 8000","actions":["Perfect World searches Evil Box, but Evil Box cannot survive Diactorus plus Nerva.","Toon Dark Magician attempts to create a Fusion line.","Non-Finito and Nerva convert the activation into a full-field destruction, leaving Toon with no attacker.","Toon passes."],"audit":"Power Patron does not spend Diactorus on the first search. It waits until a monster is committed, preserving Nerva's rewrite for the Fusion attempt.","endBoard":"Power Patron retains all three Extra Deck threats."},{"title":"Turn 4 — Power Patron","lp":"Toon 0 — Power Patron 8000","actions":["Power Patron uses the accumulated Fusion, Synchro, and Xyz resources to Special Summon Vidolium the Unstable Power Patron of Unity.","Vidolium banishes both GYs face-down and enters at 5000 ATK.","Vidolium and the remaining attacker deal lethal."],"audit":"Vidolium is summoned only after Toon has exhausted its Counter Traps and GY recursion, making the mass GY banish decisive rather than merely flashy.","endBoard":"Power Patron wins Game 3 and the match 2–1."}],"decidingFactor":"Power Patron forces both Toon Terrors with independent Spells, uses Droplet on the remaining monster interactions, and closes with Vidolium after Toon has no recursion left."}],"analysis":["Power Patron wins 2–1 and moves to 4–1.","Toon remains dangerous whenever Dimension Shifter is live, but its going-first board has only two Counter Traps; layered Spell pressure can exhaust both.","Comic Cat is correctly preserved as non-chain Tribute removal, but Forbidden Droplet neutralizes the replacement body and I:P simultaneously.","Vidolium is optimal only after both decks have invested heavily in the GY and Power Patron has already established one Fusion, one Synchro, and one Xyz resource."]},{"id":"r5-m2-toon-turbo-kewl-tune","round":"Round 5","title":"Toon Turbo vs. Kewl Tune","players":["Toon Turbo","Kewl Tune"],"score":"Kewl Tune 2–1","status":"complete","detailLevel":"full","context":["Kewl Tune is the tournament leader at 4–0; Toon Turbo enters at 1–3.","Toon Turbo can produce Dragoon, Blue-Eyes Toon Ultimate Dragon, I:P, and Toon Terror in the same game.","Kewl Tune sides Book of Eclipse, Dark Ruler No More, and Evenly Matched to separate Toon Turbo's interaction into multiple forced responses."],"games":[{"title":"Game 1","winner":"Toon Turbo","firstPlayer":"Toon Turbo","openingHands":{"Toon Turbo":["Funny Dark Rabbit","Comic Cat","Evil Box","Toon Dark Magician","Toon Terror"],"Kewl Tune":["Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Cue","Kewl Tune Synchro","Triple Tactics Talent"]},"turns":[{"title":"Turn 1 — Toon Turbo","lp":"Toon Turbo 8000 — Kewl Tune 8000","actions":["Funny establishes Perfect World and grants Comic Cat's additional Normal Summon.","Evil Box Special Summons itself and Sets Toon Terror.","Toon Dark Magician produces Dark Magician of Destruction, which adds Fusion follow-up.","Funny and Evil Box become I:P Masquerena.","Toon Turbo Sets Toon Terror and retains Comic Cat."],"audit":"The board preserves three distinct interaction types: Counter Trap, non-chain Tribute removal, and I:P into S:P.","endBoard":"Toon Turbo: Dark Magician of Destruction, Comic Cat, I:P, Perfect World, Toon Terror."},{"title":"Turn 2 — Kewl Tune","lp":"Toon Turbo 8000 — Kewl Tune 8000","actions":["Rotary reveals itself with Mix and grants an additional Normal Summon.","Mix is Normal Summoned and adds Kewl Tune Reco.","Comic Cat Tributes Mix and Special Summons Funny from the Deck.","Cue is Normal Summoned with Rotary's additional Summon and attempts to Special Summon Clip.","Toon Terror negates Cue and destroys it.","Kewl Tune Synchro adds Reco, but I:P converts Funny and Dark Magician of Destruction into S:P Little Knight.","S:P banishes Rotary, leaving Kewl Tune without enough live bodies to reach B2B.","Kewl Tune sets Triple Tactics Talent as a bluff and passes."],"audit":"Toon Turbo uses Comic Cat on Mix because Mix is the first guaranteed search plus Synchro body. Toon Terror is saved for Cue, the Deck-summoning effect, and I:P removes the final Tuner.","endBoard":"Kewl Tune has no monsters; Toon Turbo retains S:P and Comic Cat."},{"title":"Turn 3 — Toon Turbo","lp":"Toon Turbo 8000 — Kewl Tune 0","actions":["Perfect World searches Evil Box. Evil Box Special Summons itself.","The Fusion line creates Blue-Eyes Toon Ultimate Dragon.","S:P removes the set bluff.","Blue-Eyes Toon Ultimate Dragon, Evil Box, S:P, and Comic Cat attack for lethal."],"audit":"Toon Turbo commits the large Fusion only after Kewl Tune has no Synchro response window.","endBoard":"Toon Turbo wins Game 1."}],"decidingFactor":"Comic Cat, Toon Terror, and I:P answer Mix, Cue, and Rotary in three separate layers."},{"title":"Game 2","winner":"Kewl Tune","firstPlayer":"Kewl Tune","sideDeck":{"Kewl Tune":"Adds Droll & Lock Bird and Kewl Tune Playlist while playing first.","Toon Turbo":"Adds Harpie's Feather Duster and Forbidden Droplet."},"openingHands":{"Kewl Tune":["Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Cue","Kewl Tune Synchro","Kewl Tune Playlist"],"Toon Turbo":["Harpie's Feather Duster","Funny Dark Rabbit","Comic Cat","Forbidden Droplet","Toon Bookmark"]},"turns":[{"title":"Turn 1 — Kewl Tune","lp":"Kewl Tune 8000 — Toon Turbo 8000","actions":["Rotary grants the additional Normal Summon.","Mix adds Reco; Cue Special Summons Clip.","Cue and Rotary Synchro Summon Track Maker, which adds JJ “Kewl Tune”.","Track Maker and Mix become Loudness War.","Kewl Tune Synchro produces RS, while Remix is established as the delayed opponent-turn bridge.","Kewl Tune Sets Playlist and ends without summoning B2B prematurely."],"audit":"Kewl Tune preserves B2B for the second interaction wave. Loudness War, RS, Remix, and Playlist each answer a different class of card.","endBoard":"Kewl Tune: Loudness War, RS, Remix, JJ, Playlist."},{"title":"Turn 2 — Toon Turbo","lp":"Kewl Tune 8000 — Toon Turbo 8000","actions":["Harpie's Feather Duster is activated.","Kewl Tune chains Playlist, applies Reco's material effect, and returns Reco to the hand before Playlist is destroyed.","Funny is Normal Summoned and activates.","RS negates Funny.","Forbidden Droplet sends Duster and a card from hand to negate RS and Loudness War.","Comic Cat is Normal Summoned through Funny's still-resolving additional Summon.","Remix Tributes itself, recovers Rotary and Special Summons Mix, then Synchro Summons Kewl Tune B2B using the negated Loudness War.","Mix's material effect destroys Comic Cat before it can Tribute B2B.","When Toon Turbo activates Toon Bookmark, B2B Special Summons Reco and Synchro Summons Baronne de Fleur.","Baronne negates Bookmark. Toon Turbo cannot establish Perfect World and ends."],"audit":"Droplet handles the visible first layer, but Remix converts those negated Synchros into B2B after the Chain. B2B then punishes the next necessary activation by producing Baronne.","endBoard":"Kewl Tune: B2B and Baronne. Toon Turbo has only a negated Funny."},{"title":"Turn 3 — Kewl Tune","lp":"Kewl Tune 8000 — Toon Turbo 0","actions":["Baronne destroys Funny.","Kewl Tune Synchro produces Crackle and temporarily removes Toon Turbo's Extra Deck answer.","B2B, Baronne, Crackle, and the Tuners attack for lethal."],"audit":"No additional search is needed after Baronne removes the only monster.","endBoard":"Kewl Tune wins Game 2."}],"decidingFactor":"Remix converts a Droplet-negated board into B2B, and B2B turns Toon Bookmark into Baronne de Fleur."},{"title":"Game 3","winner":"Kewl Tune","firstPlayer":"Toon Turbo","sideDeck":{"Toon Turbo":"Chooses to play first and adds Solemn Judgment plus a second Toon Terror.","Kewl Tune":"Adds Cosmic Cyclone, Dark Ruler No More, and Evenly Matched."},"openingHands":{"Toon Turbo":["Funny Dark Rabbit","Evil Box","Toon Dark Magician","Toon Terror","Solemn Judgment"],"Kewl Tune":["Cosmic Cyclone","Dark Ruler No More","Evenly Matched","Kewl Tune Rotary","Kewl Tune Mix"]},"turns":[{"title":"Turn 1 — Toon Turbo","lp":"Toon Turbo 8000 — Kewl Tune 8000","actions":["Funny establishes Perfect World.","Evil Box Special Summons itself and Sets a second Toon Terror.","Toon Dark Magician produces Dark Magician of Destruction and Blue-Eyes Toon Ultimate Dragon.","Evil Box and Funny become I:P Masquerena.","Toon Turbo Sets Toon Terror and Solemn Judgment."],"audit":"Toon Turbo presents maximum pressure rather than holding resources because it must beat Kewl Tune before B2B becomes live.","endBoard":"Toon Turbo: Blue-Eyes Toon Ultimate Dragon, Dark Magician of Destruction, I:P, Perfect World, Toon Terror, Judgment."},{"title":"Turn 2 — Kewl Tune","lp":"Toon Turbo 4000 — Kewl Tune 8000","actions":["During the Draw Phase, Cosmic Cyclone targets Perfect World.","Toon Terror negates Cosmic Cyclone.","In Main Phase, Dark Ruler No More is activated.","Solemn Judgment negates Dark Ruler and halves Toon Turbo's LP.","Kewl Tune enters the Battle Phase with no cards and activates Evenly Matched.","Toon Turbo has no remaining Spell/Trap negate and keeps Blue-Eyes Toon Ultimate Dragon, banishing everything else face-down.","In Main Phase 2, Rotary and Mix begin the Kewl Tune engine.","Mix adds Cue. Rotary grants the additional Normal Summon.","Cue Special Summons Clip, creating Track Maker and then Loudness War.","Kewl Tune Synchro produces RS and sets up Remix."],"audit":"The three board breakers are deliberately sequenced as three independent must-answer cards. Toon Turbo has only two negates, so Evenly Matched resolves.","endBoard":"Kewl Tune: Loudness War, RS, Remix. Toon Turbo: Blue-Eyes Toon Ultimate Dragon at 4000 LP."},{"title":"Turn 3 — Toon Turbo","lp":"Toon Turbo 4000 — Kewl Tune 8000","actions":["Blue-Eyes Toon Ultimate Dragon attempts to clear Loudness War.","Loudness War copies the appropriate material effect and disrupts the attack line.","Remix converts itself and the GY Tuners into B2B.","B2B responds to Toon Turbo's follow-up monster effect by producing Baronne de Fleur.","Baronne negates the final effect, leaving the Fusion Monster exposed."],"audit":"Kewl Tune does not overcommit before the attack. Remix waits until the first interaction has traded, then B2B creates Baronne on the opponent's next activation.","endBoard":"Kewl Tune controls B2B and Baronne; Toon Turbo has only the negated Fusion Monster."},{"title":"Turn 4 — Kewl Tune","lp":"Toon Turbo 0 — Kewl Tune 8000","actions":["Baronne destroys Blue-Eyes Toon Ultimate Dragon.","B2B and the supporting Tuners attack for lethal."],"audit":"The Fusion is removed before combat to prevent any surprise replacement or battle effect.","endBoard":"Kewl Tune wins Game 3 and the match 2–1."}],"decidingFactor":"Kewl Tune forces Toon Turbo's two negates with Cosmic Cyclone and Dark Ruler, resolves Evenly Matched as the third layer, and rebuilds into B2B plus Baronne."}],"analysis":["Kewl Tune wins 2–1 and remains undefeated at 5–0.","Toon Turbo wins when its three interaction layers line up one-for-one with Mix, Cue, and Rotary.","Kewl Tune's superior adaptation is delaying B2B until Remix has absorbed the first board-breaking exchange.","The decisive Game 3 again demonstrates that two negates cannot cover three separately timed must-answer Spells."]},{"id":"r5-m3-elfnote-branded","round":"Round 5","title":"Elfnote vs. Branded","players":["Elfnote","Branded"],"score":"Branded 2–1","status":"complete","detailLevel":"full","context":["Both decks enter at 2–2.","Elfnote wins extended games through continuous-card rotations; Branded wins by compressing interaction into Mirrorjade, The Fallen & The Virtuous, and Super Polymerization.","Branded sides Cosmic Cyclone and Evenly Matched; Elfnote sides Aristeia of Trust, Solemn Judgment, and Dimensional Barrier."],"games":[{"title":"Game 1","winner":"Branded","firstPlayer":"Branded","openingHands":{"Branded":["Aluber the Jester of Despia","Branded Fusion","Phara the Primordial Goddess","The Fallen & The Virtuous","Super Polymerization"],"Elfnote":["Elfnote Tinia","Elfnote Power Patron","Elfnotes: Welcome Home","Elfnote Fortuna","Infinite Impermanence"]},"turns":[{"title":"Turn 1 — Branded","lp":"Branded 8000 — Elfnote 8000","actions":["Aluber is Normal Summoned and adds Branded Retribution.","Phara reveals itself with Branded Fusion, protecting the Spell from responses.","Branded Fusion sends Fallen of Albaz and Mercourier to summon Lubellion.","Lubellion discards Retribution and produces Mirrorjade.","Branded Sets The Fallen & The Virtuous and Super Polymerization."],"audit":"Branded stops at Mirrorjade plus two different interaction types, preserving Extra Deck and hand resources for Elfnote's rebuild.","endBoard":"Branded: Mirrorjade, Aluber, two Set cards."},{"title":"Turn 2 — Elfnote","lp":"Branded 8000 — Elfnote 8000","actions":["Tinia Special Summons itself to the center zone and places A Plea for Help.","Welcome Home sends Fortuna and Special Summons Lucina from the Deck.","Lucina adds Regina.","Power Patron is Normal Summoned and raises Tinia's Level for June Pride.","Mirrorjade banishes Tinia before it can be used as Synchro Material.","Elfnote attempts to continue with Lucina and Power Patron.","Super Polymerization discards Phara and uses two DARK-compatible bodies to create Mudragon, removing the remaining Synchro materials.","Elfnote ends with only A Plea for Help."],"audit":"Mirrorjade removes the center-zone monster before Level modification matters. Super Polymerization is held until Elfnote commits the remaining two bodies.","endBoard":"Branded retains Mirrorjade and Mudragon; Elfnote has no monsters."},{"title":"Turn 3 — Branded","lp":"Branded 8000 — Elfnote 0","actions":["Retribution recovers Branded Fusion.","Branded Fusion creates Albion and a second Fusion attacker.","The Fallen & The Virtuous clears A Plea for Help.","Mirrorjade, Mudragon, and the new Fusion attackers deal lethal."],"audit":"The continuous Spell is removed before combat so no center-zone protection can reappear through an Elfnote revival.","endBoard":"Branded wins Game 1."}],"decidingFactor":"Mirrorjade removes Tinia before the Level increase, and Super Polymerization consumes Elfnote's remaining Synchro materials after they are committed."},{"title":"Game 2","winner":"Elfnote","firstPlayer":"Elfnote","sideDeck":{"Elfnote":"Adds Aristeia of Trust, Solemn Judgment, and Dimensional Barrier.","Branded":"Adds Cosmic Cyclone and Evenly Matched."},"openingHands":{"Elfnote":["Elfnote Tinia","Elfnotes: Welcome Home","Elfnote Power Patron","Elfnotes: Aristeia of Trust","Dimensional Barrier"],"Branded":["Evenly Matched","Aluber the Jester of Despia","Branded Fusion","Cosmic Cyclone","The Fallen & The Virtuous"]},"turns":[{"title":"Turn 1 — Elfnote","lp":"Elfnote 8000 — Branded 8000","actions":["Tinia Special Summons itself to the center and places A Plea for Help.","Welcome Home deploys Lucina; Lucina adds Fortuna.","Power Patron raises Tinia and Synchro Summons June Pride.","June Pride returns itself and deploys Fortuna, Regina, and Tinia from hand, Deck, and GY.","Fortuna places Rhapsodia; Regina Special Summons another Elfnote.","Elfnote Sets Aristeia and Dimensional Barrier."],"audit":"Elfnote establishes four differently named monsters, ensuring Aristeia can negate a Spell/Trap and destroy it while a Synchro Monster is present.","endBoard":"Elfnote: four monsters, A Plea, Welcome Home, Rhapsodia, Aristeia, Barrier."},{"title":"Turn 2 — Branded","lp":"Elfnote 8000 — Branded 8000","actions":["Branded enters the Battle Phase and activates Evenly Matched.","Aristeia negates Evenly Matched and destroys it.","In Main Phase 2, Cosmic Cyclone targets Rhapsodia.","Elfnote allows Rhapsodia to be banished, preserving Dimensional Barrier for the actual Fusion turn.","Aluber is Normal Summoned and adds Branded Fusion.","Dimensional Barrier declares Fusion.","Branded Fusion and The Fallen & The Virtuous remain unusable for the turn.","Elfnote's rotation effects return Aluber to the hand and remove the remaining setup."],"audit":"Aristeia is assigned to Evenly because it threatens the entire board. Cosmic Cyclone receives no response. Dimensional Barrier is saved until Aluber confirms the Fusion plan.","endBoard":"Branded ends with no field; Elfnote retains its monster engine."},{"title":"Turn 3 — Elfnote","lp":"Elfnote 8000 — Branded 0","actions":["Power Patron uses the center-zone monster to Synchro Summon Junora.","Junora negates Branded's remaining face-up cards.","Junora and the Level 6 Elfnote monsters attack for lethal."],"audit":"Junora is chosen over another value Synchro because the game is ending and the mass negate removes all residual interaction.","endBoard":"Elfnote wins Game 2."}],"decidingFactor":"Aristeia and Dimensional Barrier are assigned to different threats: Evenly Matched is negated first, then Fusion Summons are prohibited after Aluber resolves."},{"title":"Game 3","winner":"Branded","firstPlayer":"Branded","sideDeck":{"Branded":"Adds Dogmatika Ecclesia, Cosmic Cyclone, and a second Super Polymerization.","Elfnote":"Retains Dimensional Barrier and adds Ghost Belle & Haunted Mansion."},"openingHands":{"Branded":["Dogmatika Ecclesia, the Virtuous","Aluber the Jester of Despia","Branded Fusion","Cosmic Cyclone","Super Polymerization"],"Elfnote":["Elfnote Tinia","Elfnote Fortuna","Elfnotes: Welcome Home","Dimensional Barrier","Ghost Belle & Haunted Mansion"]},"turns":[{"title":"Turn 1 — Branded","lp":"Branded 8000 — Elfnote 8000","actions":["Aluber adds The Fallen & The Virtuous.","Branded Fusion produces Albion and then Mirrorjade.","Ecclesia Special Summons itself after the Extra Deck monster is established and adds follow-up.","Branded Sets Super Polymerization and The Fallen & The Virtuous."],"audit":"Ecclesia is established as a Spellcaster body and follow-up attacker while Mirrorjade remains the primary interruption.","endBoard":"Branded: Mirrorjade, Aluber, Ecclesia, two Set cards."},{"title":"Turn 2 — Elfnote","lp":"Branded 8000 — Elfnote 8000","actions":["Tinia Special Summons itself and places A Plea for Help.","Welcome Home sends Fortuna and attempts to Special Summon Lucina from the Deck.","Mirrorjade banishes Tinia before the center-zone engine can rotate.","Lucina is summoned and adds Power Patron.","Power Patron is Normal Summoned and attempts to create the June Pride line.","Super Polymerization uses Lucina and Power Patron as materials for Mudragon.","Elfnote activates Dimensional Barrier and declares Fusion, but the already-resolved Super Polymerization cannot be undone; it only stops additional Fusion Summons for the turn.","Elfnote passes with no Synchro Monster."],"audit":"Branded makes Super Polymerization the first Fusion effect of the opponent's turn. Barrier is therefore too late to save the committed Synchro materials, even though it blocks further Fusion Summons.","endBoard":"Branded retains Mirrorjade, Mudragon, and Ecclesia."},{"title":"Turn 3 — Branded","lp":"Branded 8000 — Elfnote 0","actions":["Mirrorjade clears the final Elfnote card.","Ecclesia and the Fusion monsters attack.","The Fallen & The Virtuous removes A Plea for Help before the final attack.","Branded reaches lethal damage."],"audit":"The continuous protection card is removed before combat, preventing a revived center monster from changing the damage calculation.","endBoard":"Branded wins Game 3 and the match 2–1."}],"decidingFactor":"Branded uses Super Polymerization before Dimensional Barrier can protect the Synchro materials, then keeps Mirrorjade for the final center-zone threat."}],"analysis":["Branded wins 2–1 and moves to 3–2.","Elfnote wins when Aristeia and Dimensional Barrier can be assigned to Evenly Matched and Branded Fusion separately.","Branded's optimal counterplay is to make Super Polymerization the first Fusion event on Elfnote's turn, forcing Barrier to arrive after the materials are already gone.","Mirrorjade should target Tinia, not the first searcher, because removing the center-zone monster collapses the Level and rotation engine."]},{"id":"r5-m4-sky-striker-dark-magician","round":"Round 5","title":"Sky Striker vs. Dark Magician","players":["Sky Striker","Dark Magician"],"score":"Sky Striker 2–1","status":"complete","detailLevel":"full","context":["Sky Striker enters at 2–2; Dark Magician enters at 0–4.","Dark Magician's best route is Secret Village plus Dragoon. Sky Striker answers through Kaiju-style monster removal, Cosmic Cyclone, and Linkage.","Sky Striker's resource objective is to reach three Spells in the GY before using Widow Anchor on Dragoon or Dark Magician of Destruction."],"games":[{"title":"Game 1","winner":"Sky Striker","firstPlayer":"Sky Striker","openingHands":{"Sky Striker":["Sky Striker Ace - Raye","Sky Striker Mobilize – Engage!","Sky Striker Mecha – Linkage!","Sky Striker Mecha – Widow Anchor","Radiant Typhoon Vision"],"Dark Magician":["Magician's Rod","Magicians' Souls","Dark Magical Circle","Dark Magical Curtain","Soul Servant"]},"turns":[{"title":"Turn 1 — Sky Striker","lp":"Sky Striker 8000 — Dark Magician 8000","actions":["Engage adds Afterburners.","Raye is Normal Summoned and Link Summons Shizuku.","Shizuku adds a second Sky Striker Spell during the End Phase.","Sky Striker Sets Widow Anchor and Linkage."],"audit":"Sky Striker does not overextend into a blind Dark Magical Circle line. Shizuku guarantees the third Spell setup on the following turn.","endBoard":"Sky Striker: Shizuku, Set Widow Anchor, Set Linkage."},{"title":"Turn 2 — Dark Magician","lp":"Sky Striker 8000 — Dark Magician 8000","actions":["Dark Magical Circle is activated.","Rod adds The Gaze of Timaeus.","Magicians' Souls sends Dark Magician to the GY and Special Summons itself.","Dark Magical Curtain Special Summons Dark Magician and triggers Circle.","Linkage sends Shizuku to the GY and Special Summons Kagari; Kagari returns Engage.","Circle banishes Kagari.","Secrets of Dark Magic uses Dark Magician and Souls to Fusion Summon Red-Eyes Dark Dragoon.","Widow Anchor negates Dragoon but cannot take control yet because Sky Striker has only two Spells in the GY.","Dark Magician ends with Dragoon and Rod."],"audit":"Linkage is used before Circle resolves so Shizuku becomes a Spell-count resource and Kagari recovers Engage. Widow Anchor is still assigned to Dragoon even without control-taking because stopping its destruction effect preserves the game.","endBoard":"Dark Magician: negated Dragoon and Rod. Sky Striker has Engage and Afterburners."},{"title":"Turn 3 — Sky Striker","lp":"Sky Striker 8000 — Dark Magician 0","actions":["Engage adds a second Widow Anchor and draws after the third Spell reaches the GY.","Afterburners destroys Rod.","Widow Anchor takes control of Dragoon.","Dragoon and a Sky Striker Link Monster become Sky Striker Ace – Zeke, permanently removing Dragoon from Dark Magician's field.","The Link ladder through Kagari, Hayate, and Linkage produces lethal damage."],"audit":"Once three Spells are established, Widow Anchor's temporary control is converted into permanent removal by using Dragoon as Link Material for Zeke.","endBoard":"Sky Striker wins Game 1."}],"decidingFactor":"Sky Striker survives the first Dragoon turn, reaches three Spells, then converts Widow Anchor's borrowed Dragoon into Zeke."},{"title":"Game 2","winner":"Dark Magician","firstPlayer":"Dark Magician","sideDeck":{"Dark Magician":"Adds Secret Village of the Spellcasters, Solemn Judgment, and Dimensional Barrier.","Sky Striker":"Adds Cosmic Cyclone and Evenly Matched."},"openingHands":{"Dark Magician":["Magicians' Souls","Mag
