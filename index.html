fnote","openingHands":{"Elfnote":["Elfnote Tinia","Elfnotes: Welcome Home","Elfnote Lucina","Elfnote Power Patron","Elfnotes: Aristeia of Trust"],"Sky Striker":["Sky Striker Mobilize – Engage!","Sky Striker Ace - Raye","Sky Striker Mecha – Widow Anchor","Cosmic Cyclone","Sky Striker Maneuver - Afterburners!"]},"turns":[{"title":"Turn 1 — Elfnote","lp":"Elfnote 8000 — Sky Striker 8000","actions":["Elfnote Tinia Special Summons itself to the center Main Monster Zone.","Tinia places Elfnotes: A Plea for Help.","Elfnotes: Welcome Home sends Lucina and Special Summons Elfnote Fortuna from the Deck.","Fortuna places Elfnotes: Rhapsodia of Madness.","Elfnote Power Patron raises Tinia's Level and Synchro Summons Elfnote June Pride in the center zone.","June Pride returns itself to the Extra Deck and deploys Regina from the hand, Lucina from the GY, and Tinia from the Deck.","Elfnote activates Aristeia and ends with three differently named Elfnote monsters plus three Continuous cards."],"audit":"The board layers targeting protection, destruction protection, a Spell/Trap negate, and GY rotation. No single Sky Striker Spell can answer all four functions.","endBoard":"Elfnote: Tinia in center, Regina, Lucina, A Plea, Welcome Home, Rhapsodia, Aristeia."},{"title":"Turn 2 — Sky Striker","lp":"Elfnote 8000 — Sky Striker 8000","actions":["Cosmic Cyclone targets Elfnotes: Welcome Home.","Aristeia negates Cosmic Cyclone and destroys it because Elfnote controls three Elfnote monsters and completed a Synchro Summon.","Engage adds Sky Striker Mecha – Linkage!.","Raye is Normal Summoned and Link Summons Kagari; Kagari returns Engage.","Afterburners targets Regina, but A Plea for Help prevents the relevant Elfnote monsters from being targeted.","Widow Anchor attempts to negate Tinia, but A Plea for Help again blocks the target.","Rhapsodia sends Lucina, revives Fortuna, and removes Kagari's ability to continue the Link ladder.","Sky Striker ends with no monster and insufficient damage."],"audit":"Sky Striker correctly leads with Cosmic Cyclone to test Aristeia, but without Evenly Matched in the opening five, the targeting restrictions and Rhapsodia rotation stop every remaining one-for-one Spell.","endBoard":"Elfnote retains its center-zone board and all three Continuous cards."},{"title":"Turn 3 — Elfnote","lp":"Elfnote 8000 — Sky Striker 0","actions":["Elfnote Power Patron uses the protected center monster to Synchro Summon Junora the Power Patron of Tuning.","Junora negates Sky Striker's remaining face-up cards.","Junora and the Elfnote monsters attack for lethal."],"audit":"Junora is selected because the game has moved from resource development to immediate damage and a mass negate.","endBoard":"Elfnote wins Game 1."}],"decidingFactor":"A Plea for Help denies the targeting-based Sky Striker Spells while Aristeia negates Cosmic Cyclone, leaving Welcome Home and Rhapsodia intact."},{"title":"Game 2","winner":"Sky Striker","firstPlayer":"Sky Striker","sideDeck":{"Sky Striker":"Adds Shark Cannon, Mystical Space Typhoon, and Solemn Judgment; chooses to play first.","Elfnote":"Adds Dimensional Barrier and Solemn Judgment."},"openingHands":{"Sky Striker":["Radiant Typhoon Vision","Mystical Space Typhoon","Sky Striker Ace - Raye","Sky Striker Mobilize – Engage!","Sky Striker Mecha - Shark Cannon"],"Elfnote":["Elfnote Tinia","Elfnotes: Welcome Home","Elfnote Lucina","Elfnote Power Patron","Dimensional Barrier"]},"turns":[{"title":"Turn 1 — Sky Striker","lp":"Sky Striker 8000 — Elfnote 8000","actions":["Radiant Typhoon Vision draws two cards and discards Sky Striker Mecha – Linkage!, placing two Spells into the GY.","Engage adds Sky Striker Mecha – Widow Anchor and draws after the third Spell reaches the GY.","Raye Link Summons Shizuku.","Sky Striker Sets Widow Anchor, Shark Cannon, and Mystical Space Typhoon.","Shizuku adds Sky Striker Special Maneuver - Lemnisgate! during the End Phase."],"audit":"Sky Striker prioritizes three Spells in the GY before Elfnote begins, turning both Widow Anchor and Shark Cannon into their enhanced versions.","endBoard":"Sky Striker: Shizuku, Widow Anchor, Shark Cannon, MST, Lemnisgate in hand."},{"title":"Turn 2 — Elfnote","lp":"Sky Striker 8000 — Elfnote 8000","actions":["Tinia Special Summons itself to the center and places Elfnotes: A Plea for Help.","Welcome Home sends Lucina and attempts to Special Summon Fortuna from the Deck.","Shark Cannon chains to Welcome Home and banishes Lucina from the GY, removing the intended revival target and reducing the later Rhapsodia line.","Fortuna is still Special Summoned and places Rhapsodia.","Elfnote Power Patron is Normal Summoned and raises Tinia's Level.","Tinia and Power Patron Synchro Summon Elfnote June Pride.","Widow Anchor negates June Pride and takes control of it because three Spells are in the GY.","Raye Special Summons itself when Shizuku leaves through the Elfnote interaction.","Borrowed June Pride and Raye Link Summon Sky Striker Ace – Zeke.","Zeke temporarily banishes Fortuna, leaving Elfnote without three names for Aristeia.","Dimensional Barrier declares Synchro, but Sky Striker has already converted the Synchro Monster into a Link Monster and does not need another Synchro Summon."],"audit":"Shark Cannon removes Lucina before Welcome Home can build the full GY rotation. Widow Anchor is held until June Pride appears, then the borrowed Synchro is converted into Zeke rather than returned in the End Phase.","endBoard":"Sky Striker: Zeke and Raye follow-up. Elfnote has Tinia and Continuous cards but no active June Pride."},{"title":"Turn 3 — Sky Striker","lp":"Sky Striker 8000 — Elfnote 0","actions":["Mystical Space Typhoon destroys A Plea for Help.","Lemnisgate shuffles matched Sky Striker monsters and Spells into the Deck and returns Welcome Home to the hand.","Engage adds Linkage and draws.","Zeke, Hayate, Kagari, and the Linkage conversion deal lethal damage."],"audit":"The targeting-protection card is removed before the Link ladder, and Lemnisgate uses non-destruction removal on Welcome Home so the center monster cannot be protected during combat.","endBoard":"Sky Striker wins Game 2."}],"decidingFactor":"Sky Striker reaches three Spells before Elfnote starts, uses Shark Cannon on the GY target, then takes June Pride with Widow Anchor and converts it permanently into Zeke."},{"title":"Game 3","winner":"Sky Striker","firstPlayer":"Elfnote","sideDeck":{"Elfnote":"Chooses to play first and adds Solemn Judgment plus a second Aristeia.","Sky Striker":"Adds Evenly Matched and Cosmic Cyclone while retaining Widow Anchor."},"openingHands":{"Elfnote":["Elfnote Tinia","Elfnotes: Welcome Home","Elfnote Lucina","Elfnote Power Patron","Elfnotes: Aristeia of Trust"],"Sky Striker":["Cosmic Cyclone","Evenly Matched","Sky Striker Mobilize – Engage!","Sky Striker Ace - Raye","Sky Striker Mecha – Widow Anchor"]},"turns":[{"title":"Turn 1 — Elfnote","lp":"Elfnote 8000 — Sky Striker 8000","actions":["Tinia Special Summons itself to the center and places A Plea for Help.","Welcome Home sends Lucina and deploys Fortuna.","Fortuna places Rhapsodia.","Elfnote Power Patron raises Tinia and Synchro Summons June Pride.","June Pride deploys Regina, Lucina, and Tinia from three different locations.","Elfnote activates Aristeia and ends with a full Continuous-card board."],"audit":"Elfnote repeats its strongest board because it won Game 1 with the same layered protection. The weakness is that Aristeia can negate only one Spell/Trap each turn.","endBoard":"Elfnote: three monsters, A Plea, Welcome Home, Rhapsodia, Aristeia."},{"title":"Turn 2 — Sky Striker","lp":"Elfnote 8000 — Sky Striker 8000","actions":["During the Draw Phase, Cosmic Cyclone targets Aristeia.","Aristeia negates Cosmic Cyclone and destroys it.","Sky Striker enters the Battle Phase and activates Evenly Matched as the second must-answer Spell/Trap.","Aristeia has already been used, so Evenly Matched resolves. Elfnote keeps June Pride and banishes every other card face-down.","In Main Phase 2, Engage adds Linkage.","Raye is Normal Summoned and Link Summons Kagari; Kagari returns Engage.","Engage adds a second Widow Anchor and draws because three Spells are now in the GY.","Widow Anchor negates June Pride and takes control of it.","Borrowed June Pride and Kagari Link Summon Sky Striker Ace – Zeke.","Zeke leaves Elfnote with no field while Raye remains available in the GY."],"audit":"Cosmic Cyclone is offered to Aristeia deliberately. Once the once-per-turn negate is spent, Evenly Matched removes the targeting and destruction protections without targeting or destroying them.","endBoard":"Sky Striker: Zeke with Engage and Widow Anchor follow-up. Elfnote has no field."},{"title":"Turn 3 — Elfnote","lp":"Sky Striker 8000 — Elfnote 8000","actions":["Elfnote draws Tinia and Special Summons it to the center.","Tinia attempts to place Welcome Home.","Widow Anchor negates Tinia before the Continuous engine can be rebuilt.","Elfnote passes with one negated monster."],"audit":"Sky Striker saves Widow Anchor for Tinia rather than spending it on a non-engine draw, preventing the first Continuous card from returning.","endBoard":"Sky Striker retains Zeke; Elfnote has a negated Tinia."},{"title":"Turn 4 — Sky Striker","lp":"Sky Striker 8000 — Elfnote 0","actions":["Zeke temporarily banishes Tinia.","Engage adds Linkage and draws.","The Hayate, Kagari, and Linkage sequence attacks for lethal."],"audit":"The direct-attack Link ladder avoids giving Elfnote another center-zone combat window.","endBoard":"Sky Striker wins Game 3 and the match 2–1."}],"decidingFactor":"Sky Striker deliberately feeds Cosmic Cyclone into Aristeia, resolves Evenly Matched as the second layer, and converts the surviving June Pride into Zeke with Widow Anchor."}],"analysis":["Sky Striker wins 2–1 and finishes 5–2 in third place.","Elfnote wins when its three Continuous cards remain together, because targeting protection, destruction protection, and GY rotation cover different removal types.","Sky Striker's post-side plan is not to overpower all three cards individually; it forces Aristeia once and then resolves Evenly Matched.","Widow Anchor is again converted into permanent removal by using the borrowed opposing boss as Link Material for Zeke."]}],"tournamentStatus":"Tournament complete","champion":{"deck":"Kewl Tune","record":"7–0","games":"14–7","summary":"Undefeated round-robin champion. Power Patron finishes second at 6–1, and Sky Striker takes third at 5–2."},"tiebreakers":"Toon ranks above Branded on their Round 1 head-to-head result. Elfnote ranks above Toon Turbo on their Round 3 head-to-head result."};

pell Fragrance"],"overrides":{"Funny Dark Rabbit":{"apiName":"Funny Dark Rabbit","status":"OCG card — English database translation","role":"Toon starter, additional Normal Summon enabler, and Field/Continuous Spell access.","effect":"After this card is Normal or Special Summoned, you can Normal Summon 1 monster that mentions \"Toon World\" during your Main Phase this turn, in addition to your Normal Summon/Set (you can only gain this effect once per turn). This card is treated as a Toon monster while \"Toon World\" is on the field. Once per turn: You can add to your hand or place face-up on your field, 1 \"Toon\" Field or Continuous Spell from your Deck."},"Toon World the Perfect World":{"apiName":"Toon World the Perfect World","status":"OCG card — English database translation","role":"Primary Toon Field Spell; repeated search engine and non-Chain temporary protection.","effect":"This card's name becomes \"Toon World\" while in the Field Zone. Once per turn: You can add 1 \"Toon\" card, or 1 card that mentions a \"Toon\" card's name, from your Deck to your hand. You can only use this effect of \"Toon World the Perfect World\" thrice per turn. Before resolving another activated card or effect, you can banish 1 Toon monster you control until immediately after that card/effect resolves, also you cannot banish monsters with that same original name with this effect for the rest of this turn."},"Comic Cat":{"apiName":"Comic Cat","status":"OCG card — English database translation","role":"Quick-effect removal that can Tribute an opponent's monster while Toon World is active.","effect":"This card is treated as a Toon monster while \"Toon World\" is on the field. During the Main Phase (Quick Effect): You can Tribute 1 monster (if you control \"Toon World\", you can Tribute 1 monster your opponent controls, even though you do not control it), and if you do, Special Summon 1 monster that mentions \"Toon World\" from your hand or Deck, ignoring its Summoning conditions. You can only use this effect of \"Comic Cat\" once per turn."},"Kewl Tune B2B":{"apiName":"Kewl Tune B2B","status":"Released-card database entry","role":"Level 10 Tuner Synchro boss that raises opposing Levels, grants Tuners a second attack, and Synchro Summons in response to monster effects.","effect":"1 Tuner + 1 or more Synchro Monsters. Opposing monsters have their Levels increased by 2, and your Tuners can make a second attack each Battle Phase. When the opponent activates a monster effect, B2B can recover or Special Summon a non-Level-10 Tuner from the GY or banishment and then immediately Synchro Summon. This response can be used twice per turn."},"Elfnote June Pride":{"apiName":"Elfnote June Pride","status":"Released-card database entry","role":"Level 10 center-zone Synchro that restricts attacks and converts itself into three Elfnote monsters from different locations.","effect":"1 Tuner + 1 non-Tuner Spellcaster. While it occupies the center Main Monster Zone, neither player can attack except with center-zone monsters. During the Main Phase, it can return itself to the Extra Deck and Special Summon up to one Elfnote each from the hand, Deck, and GY."},"Mind Scan":{"apiName":"Mind Scan","status":"OCG card — English database translation","role":"Continuous information and pre-emptive disruption card for Toon decks.","effect":"While you have a Toon card on the field or in the GY, the opponent must keep their hand revealed and you may inspect their Set cards. Its additional effect can name and negate an opponent's visible card outside the current Chain under its Toon-related conditions."},"Evil Box":{"apiName":"Evil Box","status":"OCG card — English database translation","role":"Self-Summoning Toon extender, Toon Trap access, and GY disruption.","effect":"If you control \"Toon World\": You can Special Summon this card from your hand, then you can add to your hand or Set 1 \"Toon\" Trap from your Deck. You can only use this effect of \"Evil Box\" once per turn. This card is treated as a Toon monster while \"Toon World\" is on the field. Once per turn (Quick Effect): You can target 1 card in either GY; place it on the bottom of the Deck."},"Dark-Eyes Illusionist Faceless Mage":{"apiName":"Dark-Eyes Illusionist Faceless Mage","status":"OCG card — English database translation","role":"Places Mind Scan or recovers and Special Summons a Toon-related monster from the GY.","effect":"If this card battles a monster, neither can be destroyed by that battle. You can discard this card, then activate 1 of these effects (but you can only use each effect once per turn); ● Place 1 \"Mind Scan\" from your hand or Deck face-up on your field. ● Add 1 other monster from your GY to your hand that mentions \"Toon World\", then you can Special Summon it, ignoring its Summoning conditions."},"Toon Terror":{"apiName":"Toon Terror","status":"Released-card database entry","role":"Omni-negate while Toon World and a Toon monster are present.","effect":"When a Spell/Trap Card, or monster effect, is activated, while you control both \"Toon World\" and a Toon monster(s): Negate the activation, and if you do, destroy that card. You can only activate 1 \"Toon Terror\" per turn."},"Maliss in Underground":{"apiName":"Maliss in Underground","status":"Released-card database entry","role":"Banishes a Maliss card from hand, Deck, or GY on activation and starts the Maliss recursion engine.","effect":"When this card is activated: You can banish 1 \"Maliss\" card from your hand, Deck, or GY. While 3 or more of your \"Maliss\" Traps with different names are banished, \"Maliss\" Link Monsters you control gain 3000 ATK. While you control a \"Maliss\" Link Monster, your opponent's monsters can only target \"Maliss\" Link Monsters for attacks. You can only activate 1 \"Maliss in Underground\" per turn."},"Maliss P Dormouse":{"apiName":"Maliss <P> Dormouse","status":"Released-card database entry","role":"Banishes another Maliss monster from the Deck and revives itself when banished.","effect":"\"Maliss\" Link Monsters that point to this card cannot be destroyed by card effects. During your Main Phase: You can banish 1 \"Maliss\" monster from your Deck, also for the rest of this turn, \"Maliss\" monsters you control gain 600 ATK. If this card is banished: You can pay 300 LP; Special Summon it, also you cannot Special Summon from the Extra Deck for the rest of this turn, except Link Monsters. You can only use each effect once per turn."},"Maliss P White Rabbit":{"apiName":"Maliss <P> White Rabbit","status":"Released-card database entry","role":"Sets a Maliss Trap on summon and revives itself when banished.","effect":"You take no damage from battles involving \"Maliss\" Link Monsters that point to this card. If this card is Normal or Special Summoned: You can Set 1 \"Maliss\" Trap from your Deck with a different name than the cards in your GY. If this card is banished: You can pay 300 LP; Special Summon it, also you cannot Special Summon from the Extra Deck for the rest of this turn, except Link Monsters. You can only use each effect once per turn."},"Maliss P March Hare":{"apiName":"Maliss <P> March Hare","status":"Released-card database entry","role":"Hand extender that banishes another Maliss card and can recover a banished Maliss monster.","effect":"Your opponent cannot target \"Maliss\" Link Monsters that point to this card with card effects. During the Main Phase, if this card is in your hand (Quick Effect): You can banish 1 other \"Maliss\" card from your hand or GY, and if you do, Special Summon this card. If this card is banished: You can pay 300 LP, then target 1 of your banished \"Maliss\" monsters; add it to your hand. You can only use each effect once per turn."},"Maliss C MTP-07":{"apiName":"Maliss <C> MTP-07","status":"Released-card database entry","role":"Same-turn Trap searcher and field banish when a Maliss Link is controlled.","effect":"You can activate this card the turn it was Set, by banishing 1 face-up \"Maliss\" monster you control. Add 1 \"Maliss\" monster from your Deck to your hand, then if you control a \"Maliss\" Link Monster, you can banish 1 card on the field. You can only activate 1 \"Maliss MTP-07\" per turn."},"Maliss Q Hearts Crypter":{"apiName":"Maliss <Q> Hearts Crypter","status":"Released-card database entry","role":"The card sometimes referred to as Hearts Crypter or Hearts Cipher in the narration; Link-3 interaction, recursion, and a 5000 ATK attacker.","effect":"Three monsters, including a Maliss monster. As a Quick Effect, it shuffles one of your banished Maliss cards into the Deck and then banishes a card on the field. If Hearts Crypter is banished, you can pay 900 LP to Special Summon it and double its ATK."},"Phara the Primordial Goddess":{"apiName":"Phara the Primordial Goddess","status":"Released-card database entry","role":"Protects a named Spell/Trap activation and rewards being sent to the GY by a Spell/Trap effect—not by a cost.","effect":"You can reveal this card and 1 Spell/Trap in your hand; until the end of the next turn, neither player can activate cards or effects in response to the activation of cards, or effects of cards, with the revealed Spell/Trap's name. If this card is sent from the hand or field to the GY by a Spell/Trap effect: You can Special Summon this card. If this card is Special Summoned from the GY: You can take control of 1 monster your opponent controls with the highest ATK. You can only use each effect once per turn."},"The Fallen & The Virtuous":{"apiName":"The Fallen & The Virtuous","status":"Released-card database entry","role":"Quick-Play removal or revival and an Extra Deck send enabler.","effect":"(This card is always treated as a \"Branded\" and \"Dogmatika\" card.) Activate 1 of these effects; ● Send 1 monster that mentions \"Fallen of Albaz\" from your Extra Deck to the GY, then target 1 face-up card on the field; destroy it. ● If you have an \"Ecclesia\" monster in your field or GY: Target 1 monster in either GY; Speci let activeCard="";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const norm=s=>String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[–—]/g,"-");
$("version").textContent=[DB.tournament,DB.tournamentStatus,DB.updated].filter(Boolean).join(" · ");
function cardEntries(){
 const full=(CARDS.known||[]).map(n=>({label:n,card:n}));
 const alias=Object.entries(CARDS.aliases||{}).map(([label,card])=>({label,card}));
 const seen=new Set();
 return [...full,...alias]
  .filter(x=>{const k=norm(x.label)+"|"+x.card;if(seen.has(k))return false;seen.add(k);return true})
  .sort((a,b)=>b.label.length-a.label.length);
}
const CARD_ENTRIES=cardEntries();

function findCardMatches(text){
 const raw=String(text??""), normalized=norm(raw), candidates=[];
 CARD_ENTRIES.forEach(entry=>{
   const needle=norm(entry.label);
   if(!needle)return;
   let pos=0;
   while((pos=normalized.indexOf(needle,pos))!==-1){
     const end=pos+needle.length;
     const before=pos===0 || !/[a-z0-9]/i.test(normalized[pos-1]);
     const after=end===normalized.length || !/[a-z0-9]/i.test(normalized[end]);
     if(before&&after)candidates.push({start:pos,end,card:entry.card,label:raw.slice(pos,end)});
     pos=Math.max(end,pos+1);
   }
 });
 candidates.sort((a,b)=>a.start-b.start || (b.end-b.start)-(a.end-a.start));
 const chosen=[];
 let cursor=-1;
 for(const m of candidates){
   if(m.start>=cursor){chosen.push(m);cursor=m.end;}
 }
 return chosen;
}

function linkify(text){
 const raw=String(text??""), matches=findCardMatches(raw);
 if(!matches.length)return esc(raw);
 let out="",cursor=0;
 matches.forEach(m=>{
   out+=esc(raw.slice(cursor,m.start));
   out+=`<span class="card-link" data-card="${esc(m.card)}">${esc(raw.slice(m.start,m.end))}</span>`;
   cursor=m.end;
 });
 return out+esc(raw.slice(cursor));
}

function cardsInGame(game){
 const found=[];
 const seen=new Set();
 const walk=value=>{
   if(typeof value==="string"){
     findCardMatches(value).forEach(m=>{if(!seen.has(m.card)){seen.add(m.card);found.push(m.card);}});
   }else if(Array.isArray(value)){
     value.forEach(walk);
   }else if(value&&typeof value==="object"){
     Object.values(value).forEach(walk);
   }
 };
 walk(game);
 return found.sort((a,b)=>a.localeCompare(b));
}

function renderGameCards(game){
 const list=cardsInGame(game);
 if(!list.length)return "";
 return `<details class="card-reference"><summary>Cards referenced in this game (${list.length})</summary><div class="card-chip-list">${list.map(n=>`<span class="card-chip" data-card="${esc(n)}">${esc(n)}</span>`).join("")}</div></details>`;
}
function renderMatches(filter=""){
 const f=norm(filter);
 $("matchList").innerHTML=DB.matches.filter(m=>norm(JSON.stringify(m)).includes(f)).slice().reverse().map(m=>`
 <article class="match" id="${m.id}">
  <div class="match-head"><div><div class="muted">${esc(m.round)}</div><h2>${esc(m.title)}</h2><div class="score">${esc(m.score)}</div></div>
  <span class="badge ${m.status==="provisional"?"provisional":""}">${m.detailLevel==="full"?"Full report":m.detailLevel==="pending"?"Replay pending":"Condensed archive"}</span></div>
  ${m.context.map(x=>`<p class="context">${linkify(x)}</p>`).join("")}
  ${m.games.map((g,gi)=>`<details><summary><div class="game-title"><span>${esc(g.title)} — ${esc(g.winner)}</span><span>⌄</span></div></summary>
    ${g.firstPlayer?`<p><b>First player:</b> ${esc(g.firstPlayer)}</p>`:""}
    ${g.sideDeck?`<div class="turn"><h4>Side decking</h4>${Object.entries(g.sideDeck).map(([k,v])=>`<p><b>${esc(k)}:</b> ${linkify(v)}</p>`).join("")}</div>`:""}
    ${g.openingHands?`<div class="turn"><h4>Opening hands</h4>${Object.entries(g.openingHands).map(([k,v])=>`<p><b>${esc(k)}:</b> ${v.map(linkify).join(", ")}</p>`).join("")}</div>`:""}
    ${renderGameCards(g)}
    ${g.turns.map(t=>`<details class="turn"><summary>${esc(t.title)} ${t.lp?`<span class="muted">· ${esc(t.lp)}</span>`:""}</summary>
      <ol>${t.actions.map(a=>`<li>${linkify(a)}</li>`).join("")}</ol>
      ${t.audit?`<div class="audit"><b>Extra Deck audit:</b> ${linkify(t.audit)}</div>`:""}
      ${t.endBoard?`<div class="endboard"><b>End state:</b> ${linkify(t.endBoard)}</div>`:""}
    </details>`).join("")}
    ${g.decidingFactor?`<p><b>Deciding factor:</b> ${linkify(g.decidingFactor)}</p>`:""}
  </details>`).join("")}
  ${m.analysis?.length?`<details><summary>Match analysis</summary>${m.analysis.map(x=>`<p>${linkify(x)}</p>`).join("")}</details>`:""}
 </article>`).join("") || `<div class="panel">No match found.</div>`;
}
function renderStandings(){
 $("standingsList").innerHTML=DB.standings.map((s,i)=>`<div class="turn"><b>${i+1}. ${esc(s.deck)}</b><span style="float:right">${esc(s.matches)} · ${esc(s.games)}</span></div>`).join("");
 if(DB.champion){
   $("championTitle").textContent=`🏆 ${DB.champion.deck} — ${DB.champion.record}`;
   $("championSummary").textContent=`${DB.champion.games} in games. ${DB.champion.summary}`;
 }
 $("tiebreakerNote").textContent=DB.tiebreakers||"";
}
function renderCards(filter=""){$("cardList").innerHTML=CARDS.known.filter(n=>norm(n).includes(norm(filter))).map(n=>`<div class="turn"><span class="card-link" data-card="${esc(n)}">${esc(n)}</span></div>`).join("")}
async function official(name){
 const key="solCard:"+norm(name),cached=localStorage.getItem(key);if(cached)return JSON.parse(cached);
 const r=await fetch("https://db.ygoprodeck.com/api/v7/cardinfo.php?name="+encodeURIComponent(name));
 if(!r.ok)throw Error("Not found in the released-card database.");
 const j=await r.json(),c=j.data?.[0];if(!c)throw Error("Not found.");
 const d={name:c.name,status:"Released-card database entry",effect:c.desc,type:c.type,attribute:c.attribute,race:c.race,level:c.level,atk:c.atk,def:c.def,linkval:c.linkval,image:c.card_images?.[0]?.image_url_small};
 localStorage.setItem(key,JSON.stringify(d));return d;
}
function showCard(d){
 $("cName").textContent=d.name||activeCard;$("cStatus").textContent=d.status||"";$("cText").textContent=d.effect||"No effect text stored.";$("cRole").textContent=d.role||"";
 const vals=[d.type,d.attribute,d.race,d.level!=null?"Level/Rank "+d.level:null,d.linkval?"Link-"+d.linkval:null,d.atk!=null?"ATK "+d.atk:null,d.def!=null?"DEF "+d.def:null].filter(Boolean);
 $("cStats").innerHTML=vals.map(v=>`<span>${esc(v)}</span>`).join("");
 const img=$("cArt"); if(d.image){img.src=d.image;img.style.display="block"}else{img.removeAttribute("src");img.style.display="none"}
}
async function openCard(name){
 activeCard=name;$("cardModal").classList.add("open");
 const ov=CARDS.overrides[name];
 if(ov){showCard({name,...ov});try{const d=await official(ov.apiName||name);showCard({...d,role:ov.role,status:d.status+" · tournament note retained"})}catch{}}
 else{try{showCard(await official(name))}catch(e){showCard({name,status:"Unreleased or unavailable",effect:e.message,role:"This card needs a verified tournament translation embedded in the next update."})}}
}
document.addEventListener("click",e=>{const c=e.target.closest("[data-card]");if(c)openCard(c.dataset.card)});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.view).classList.add("active")});
$("matchSearch").oninput=e=>renderMatches(e.target.value);$("cardSearch").oninput=e=>renderCards(e.target.value);
$("closeCard").onclick=()=>$("cardModal").classList.remove("open");$("cardModal").onclick=e=>{if(e.target===$("cardModal"))$("cardModal").classList.remove("open")};
renderMatches();renderStandings();renderCards();
</script>
