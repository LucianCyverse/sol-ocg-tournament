ician's Rod","Dark Magical Circle","Secret Village of the Spellcasters","Solemn Judgment"],"Sky Striker":["Cosmic Cyclone","Evenly Matched","Sky Striker Ace - Raye","Sky Striker Mobilize – Engage!","Sky Striker Mecha – Linkage!"]},"turns":[{"title":"Turn 1 — Dark Magician","lp":"Dark Magician 8000 — Sky Striker 8000","actions":["Souls sends Dark Magician and Special Summons itself.","Circle is activated.","Rod adds Dark Magical Curtain.","Curtain Special Summons Dark Magician and triggers Circle's setup.","The Gaze of Timaeus creates Red-Eyes Dark Dragoon.","Secret Village is activated while Rod remains as the controlling Spellcaster.","Dark Magician Sets Solemn Judgment."],"audit":"Rod is preserved so Secret Village remains active even if Dragoon is removed. Judgment protects the Field Spell from the first board breaker.","endBoard":"Dark Magician: Dragoon, Rod, Circle, Secret Village, Judgment."},{"title":"Turn 2 — Sky Striker","lp":"Dark Magician 4000 — Sky Striker 8000","actions":["Sky Striker activates Cosmic Cyclone targeting Secret Village.","Solemn Judgment negates Cosmic Cyclone and halves Dark Magician's LP.","Secret Village now prevents Engage, Linkage, and the rest of the Sky Striker Spell engine.","Raye is Normal Summoned and becomes Hayate.","Dragoon negates Hayate's attempt to generate value and destroys it.","Sky Striker cannot activate Evenly Matched in Main Phase and has no remaining route through the lock."],"audit":"Judgment is correctly spent on Cosmic Cyclone, because losing Secret Village would unlock the entire Sky Striker hand. Dragoon handles the lone monster line.","endBoard":"Dark Magician retains Dragoon and Secret Village."},{"title":"Turn 3 — Dark Magician","lp":"Dark Magician 4000 — Sky Striker 0","actions":["Circle and Rod generate follow-up Dark Magician access.","Dragoon destroys Sky Striker's final card and gains ATK.","Dragoon and the additional Spellcaster attack for lethal."],"audit":"Dark Magician attacks only after clearing the last possible Raye recursion target.","endBoard":"Dark Magician wins Game 2."}],"decidingFactor":"Solemn Judgment protects Secret Village from Cosmic Cyclone, leaving Sky Striker unable to activate its Spell engine."},{"title":"Game 3","winner":"Sky Striker","firstPlayer":"Sky Striker","sideDeck":{"Sky Striker":"Chooses to play first and retains Cosmic Cyclone, Solemn Judgment, and Widow Anchor.","Dark Magician":"Retains Secret Village and adds Harpie's Feather Duster."},"openingHands":{"Sky Striker":["Sky Striker Ace - Raye","Sky Striker Ace - Roze","Sky Striker Mobilize – Engage!","Cosmic Cyclone","Solemn Judgment"],"Dark Magician":["Secret Village of the Spellcasters","Harpie's Feather Duster","Magician's Rod","Dark Magical Circle","Dark Magical Curtain"]},"turns":[{"title":"Turn 1 — Sky Striker","lp":"Sky Striker 8000 — Dark Magician 8000","actions":["Engage adds Linkage.","Raye is Normal Summoned; Roze Special Summons itself.","Raye and Roze Link Summon Sky Striker Ace – Zero.","Zero adds Widow Anchor.","Sky Striker Sets Cosmic Cyclone, Widow Anchor, and Solemn Judgment."],"audit":"Zero is chosen because it provides the search now and can Tribute itself on Dark Magician's turn if necessary.","endBoard":"Sky Striker: Zero, three Set cards."},{"title":"Turn 2 — Dark Magician","lp":"Sky Striker 8000 — Dark Magician 8000","actions":["Dark Magician activates Harpie's Feather Duster.","Solemn Judgment negates Duster.","Dark Magical Circle is activated.","Rod is Normal Summoned and adds Secret Village follow-up.","Before Secret Village can resolve as a lock, Cosmic Cyclone banishes it.","Dark Magical Curtain Special Summons Dark Magician and triggers Circle.","Zero Tributes itself, Special Summons Raye and Roze, and destroys Circle.","The already-activated Circle effect resolves and banishes Raye, but Roze remains.","Dark Magician attempts to create Dragoon.","Widow Anchor negates the Fusion threat at the first legal window."],"audit":"Judgment is assigned to Duster; Cosmic Cyclone is reserved specifically for Secret Village. Zero trades itself for Circle while leaving Roze as the next Link starter.","endBoard":"Sky Striker retains Roze and follow-up; Dark Magician has a negated Fusion threat."},{"title":"Turn 3 — Sky Striker","lp":"Sky Striker 8000 — Dark Magician 0","actions":["Roze becomes Kagari, which returns Engage.","Engage adds a second Widow Anchor and draws after the third Spell reaches the GY.","Widow Anchor takes control of Dragoon.","Dragoon and Kagari become Zeke.","Linkage converts Zeke through the Sky Striker ladder, and the accumulated attacks reach lethal."],"audit":"The second Widow Anchor is used only after three Spells are present, allowing Dragoon to be taken and permanently converted into Link Material.","endBoard":"Sky Striker wins Game 3 and the match 2–1."}],"decidingFactor":"Sky Striker assigns Judgment to Duster, Cosmic Cyclone to Secret Village, and Zero to Circle, preserving Widow Anchor for Dragoon."}],"analysis":["Sky Striker wins 2–1 and moves to 3–2.","Dark Magician's Secret Village plan is strong enough to win when Judgment protects it.","Sky Striker wins the deciding game by assigning one answer to each lock component rather than using two cards on the same threat.","Widow Anchor is most valuable after the third Spell reaches the GY, because Dragoon can then be taken and used as Link Material for Zeke."]},{"id":"r6-m1-power-patron-elfnote","round":"Round 6","title":"Power Patron vs. Elfnote","players":["Power Patron","Elfnote"],"score":"Power Patron 2–1","status":"complete","detailLevel":"full","context":["Power Patron enters at 4–1; Elfnote enters at 2–3.","The critical rules interaction is Elfnote's center-zone protection: Welcome Home can preserve the center monster through Nerva's destruction rewrite, so Power Patron must remove the Continuous Spell before committing the wipe.","Power Patron sides Cosmic Cyclone and Solemn Judgment. Elfnote sides Dimensional Barrier, Evenly Matched, and additional copies of Aristeia."],"games":[{"title":"Game 1","winner":"Power Patron","firstPlayer":"Power Patron","openingHands":{"Power Patron":["Artmage Vandalism -Assault-","Medius the Pure","Plundered Power Patron Plane – Vidolia","Prohibited Power Patron Portal - Terminus","Artmage Impasto -Recapture-"],"Elfnote":["Elfnote Tinia","Elfnote Lucina","Elfnote Power Patron","Elfnotes: A Plea for Help","Infinite Impermanence"]},"turns":[{"title":"Turn 1 — Power Patron","lp":"Power Patron 8000 — Elfnote 8000","actions":["Artmage Vandalism -Assault- adds Medius the Pure and makes the eventual Fusion materials interchangeable.","Medius the Pure is Normal Summoned and Special Summons Power Patron DoomZ from the Deck.","Plundered Power Patron Plane – Vidolia reveals Nerva the Power Patron of Creation and deploys Nervedo the Shadebeast Power Patron.","Nervedo banishes three cards face-down, destroys itself, and Fusion Summons Nerva.","Nervedo's face-up Extra Deck effect deploys Artmage Power Patron.","Artmage Power Patron and the remaining Artmage body produce Artmage Non-Finito.","Non-Finito Sets Artmage Impasto -Recapture-. Terminus places Jupredo in the GY for the later Xyz branch."],"audit":"The first-turn line deliberately keeps Nerva and Non-Finito separate. Nerva is the mass-removal threat; Non-Finito supplies the opponent-turn Fusion or a safe Artmage activation that Nerva can rewrite.","endBoard":"Power Patron: Nerva, Non-Finito, DoomZ, Vandalism, Set Impasto."},{"title":"Turn 2 — Elfnote","lp":"Power Patron 8000 — Elfnote 8000","actions":["Elfnote Tinia Special Summons itself to the center Main Monster Zone and places Elfnotes: A Plea for Help.","Elfnote Lucina Special Summons itself and searches Elfnote Regina.","Elfnote Power Patron is Normal Summoned and targets Tinia to begin the Level-10 Synchro line.","Power Patron chains Artmage Power Patron's Fusion effect.","Nerva changes that activated Artmage effect into destruction of every card Elfnote controls.","A Plea for Help prevents targeting but does not prevent destruction, so Tinia, Lucina, Elfnote Power Patron, and the Continuous Spell are all cleared.","Elfnote sets Infinite Impermanence and passes."],"audit":"Power Patron waits until Elfnote has committed the center monster, searcher, Synchro enabler, and protection card. Because the protection chosen was A Plea for Help rather than Welcome Home, Nerva's rewritten effect clears the complete board.","endBoard":"Power Patron retains Nerva and Non-Finito; Elfnote has one Set card."},{"title":"Turn 3 — Power Patron","lp":"Power Patron 8000 — Elfnote 0","actions":["Power Patron DoomZ and a revived Medius the Pure create DoomZ Break - Diactorus.","Infinite Impermanence negates Diactorus, but Non-Finito Fusion Summons Artmage Diactorus using the remaining bodies.","Nerva, Non-Finito, and Artmage Diactorus attack for lethal."],"audit":"Power Patron does not expose Nerva to the Set Impermanence first. The Xyz body draws the interruption, leaving the Fusion attackers live.","endBoard":"Power Patron wins Game 1."}],"decidingFactor":"Elfnote selects targeting protection instead of destruction protection, allowing Nerva to erase every committed engine piece at once."},{"title":"Game 2","winner":"Elfnote","firstPlayer":"Elfnote","sideDeck":{"Elfnote":"Adds Dimensional Barrier, Evenly Matched, and a second Aristeia; chooses to play first.","Power Patron":"Adds Cosmic Cyclone and Book of Eclipse to answer the Continuous-card engine."},"openingHands":{"Elfnote":["Elfnote Tinia","Elfnotes: Welcome Home","Elfnote Lucina","Elfnote Power Patron","Dimensional Barrier"],"Power Patron":["Artmage Vandalism -Assault-","Medius the Pure","Plundered Power Patron Plane – Vidolia","Power Patron DoomZ","Book of Eclipse"]},"turns":[{"title":"Turn 1 — Elfnote","lp":"Elfnote 8000 — Power Patron 8000","actions":["Tinia Special Summons itself to the center Main Monster Zone and places Elfnotes: Aristeia of Trust.","Elfnotes: Welcome Home sends Lucina and Special Summons Elfnote Fortuna from the Deck.","Fortuna places Elfnotes: Rhapsodia of Madness.","Elfnote Power Patron raises Tinia's Level and Synchro Summons Elfnote June Pride.","June Pride returns itself to the Extra Deck and deploys Regina from the hand, Lucina from the GY, and Tinia from the Deck.","Lucina searches follow-up while Regina supplies the third differently named Elfnote.","Elfnote Sets Dimensional Barrier."],"audit":"Welcome Home is chosen because it prevents the center monster from being destroyed by Nerva. Aristeia covers a Spell/Trap, while Dimensional Barrier independently covers the first Fusion attempt.","endBoard":"Elfnote: Tinia in the center, Regina, Lucina, Welcome Home, Aristeia, Rhapsodia, Set Barrier."},{"title":"Turn 2 — Power Patron","lp":"Elfnote 8000 — Power Patron 8000","actions":["Artmage Vandalism -Assault- is activated.","Aristeia negates Vandalism and destroys it because Elfnote controls at least three Elfnote monsters and has completed a Synchro Summon.","Medius the Pure is Normal Summoned and Special Summons Power Patron DoomZ.","Plundered Power Patron Plane – Vidolia attempts to establish the Fusion branch.","Dimensional Barrier declares Fusion, shutting off Nerva and Non-Finito for the turn.","Power Patron pivots into DoomZ Break - Diactorus, but Welcome Home protects Tinia from effect destruction.","Rhapsodia sends Lucina, revives Fortuna, and negates Diactorus for the turn.","Power Patron sets Book of Eclipse and passes."],"audit":"Elfnote assigns Aristeia to the search Spell and waits to reveal Dimensional Barrier until Vidolia confirms the Fusion line. Power Patron's Xyz pivot cannot remove the center monster through Welcome Home.","endBoard":"Elfnote retains the center lock, three monsters, and two Continuous cards."},{"title":"Turn 3 — Elfnote","lp":"Elfnote 8000 — Power Patron 0","actions":["Elfnote Power Patron uses the protected center monster to Synchro Summon Junora the Power Patron of Tuning.","Junora negates every face-up Power Patron card.","Book of Eclipse is activated, but Aristeia negates it.","Junora, Tinia, Regina, and Fortuna attack for lethal."],"audit":"Junora is selected over another value Synchro because the mass negate removes the Xyz body and the remaining engine cards immediately.","endBoard":"Elfnote wins Game 2."}],"decidingFactor":"Welcome Home preserves the center monster through destruction, while Aristeia and Dimensional Barrier are reserved for different parts of Power Patron's engine."},{"title":"Game 3","winner":"Power Patron","firstPlayer":"Power Patron","sideDeck":{"Power Patron":"Chooses to play first and adds Solemn Judgment while retaining Cosmic Cyclone.","Elfnote":"Adds Evenly Matched and keeps Dimensional Barrier."},"openingHands":{"Power Patron":["Artmage Vandalism -Assault-","Medius the Pure","Plundered Power Patron Plane – Vidolia","Cosmic Cyclone","Solemn Judgment"],"Elfnote":["Evenly Matched","Elfnote Tinia","Elfnotes: Welcome Home","Elfnote Power Patron","Dimensional Barrier"]},"turns":[{"title":"Turn 1 — Power Patron","lp":"Power Patron 8000 — Elfnote 8000","actions":["Vandalism adds Medius. Medius deploys Power Patron DoomZ.","Vidolia reaches Nervedo, which Fusion Summons Nerva.","Nervedo's face-up Extra Deck effect deploys Artmage Power Patron.","The remaining bodies produce Artmage Non-Finito.","Non-Finito Sets Artmage Impasto -Recapture-.","Power Patron Sets Cosmic Cyclone and Solemn Judgment."],"audit":"The board is intentionally not compressed into Vidolium. Nerva plus back-row interaction is stronger against a deck whose protection depends on face-up Continuous cards.","endBoard":"Power Patron: Nerva, Non-Finito, DoomZ, Cosmic Cyclone, Judgment, Impasto."},{"title":"Turn 2 — Elfnote","lp":"Power Patron 4000 — Elfnote 8000","actions":["Elfnote enters the Battle Phase and activates Evenly Matched.","Solemn Judgment negates Evenly Matched and halves Power Patron's LP.","Tinia Special Summons itself to the center and activates its effect.","Tinia places Elfnotes: Welcome Home.","As Welcome Home activates, Cosmic Cyclone chains and banishes it; because it is a Continuous Spell, it does not remain face-up to apply its protection.","Elfnote Power Patron is Normal Summoned and targets Tinia for the Synchro line.","Power Patron activates Artmage Power Patron's effect; Nerva rewrites it into destruction of every Elfnote card.","Tinia, Elfnote Power Patron, and Dimensional Barrier are destroyed before a Synchro Monster is made."],"audit":"Judgment is assigned only to Evenly Matched. Cosmic Cyclone is reserved for Welcome Home, the one card that would let Tinia survive Nerva's destruction rewrite.","endBoard":"Power Patron retains its entire monster board; Elfnote has no field."},{"title":"Turn 3 — Power Patron","lp":"Power Patron 4000 — Elfnote 0","actions":["DoomZ and the recovered Medius create DoomZ Break - Diactorus.","The accumulated Fusion, Synchro, and Xyz resources are returned to summon Vidolium the Unstable Power Patron of Unity.","Vidolium banishes both GYs face-down and attacks alongside the remaining monster for lethal."],"audit":"Vidolium is delayed until Elfnote's revival cards are in the GY, maximizing the value of its full graveyard banish.","endBoard":"Power Patron wins Game 3 and the match 2–1."}],"decidingFactor":"Power Patron answers Evenly Matched and Welcome Home with different cards, then times Nerva after Elfnote has committed both its center monster and Synchro enabler."}],"analysis":["Power Patron wins 2–1 and moves to 5–1.","Welcome Home is the central matchup card because it can preserve the center monster during Nerva's destruction rewrite.","Cosmic Cyclone is therefore more important than generic monster negation: removing the Continuous Spell before resolution makes the Nerva wipe complete.","Elfnote's Game 2 demonstrates the correct defensive split—Aristeia for Vandalism, Dimensional Barrier for the Fusion branch, and Rhapsodia for the Xyz pivot."]},{"id":"r6-m2-kewl-tune-dark-magician","round":"Round 6","title":"Kewl Tune vs. Dark Magician","players":["Kewl Tune","Dark Magician"],"score":"Kewl Tune 2–1","status":"complete","detailLevel":"full","context":["Kewl Tune enters undefeated at 5–0; Dark Magician enters at 0–5.","Dark Magician's clearest win condition is Secret Village plus Red-Eyes Dark Dragoon. Kewl Tune can continue playing through monster effects, but it must use Reco's Synchro-material trigger to remove Secret Village before activating its Spells.","Kewl Tune sides Cosmic Cyclone, Book of Eclipse, and Kewl Tune Playlist. Dark Magician sides Secret Village, Solemn Judgment, and Dimensional Barrier."],"games":[{"title":"Game 1","winner":"Kewl Tune","firstPlayer":"Kewl Tune","openingHands":{"Kewl Tune":["Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Cue","Kewl Tune Reco","Kewl Tune Synchro"],"Dark Magician":["Magician's Rod","Magicians' Souls","Dark Magical Circle","The Gaze of Timaeus","Soul Servant"]},"turns":[{"title":"Turn 1 — Kewl Tune","lp":"Kewl Tune 8000 — Dark Magician 8000","actions":["Kewl Tune Rotary reveals itself with Mix and immediately Normal Summons Mix.","Mix adds Kewl Tune Cue. Cue is Normal Summoned and Special Summons Kewl Tune Clip.","Cue, Clip, and the in-hand Reco establish Kewl Tune Track Maker and Kewl Tune Loudness War.","Kewl Tune Synchro converts the remaining Tuners into Kewl Tune RS.","The final material sequence produces Kewl Tune B2B while leaving Reco and Mix available in the GY."],"audit":"B2B is made only after Loudness War is established. This ensures the first opposing monster activation creates a second Synchro interaction rather than forcing B2B to defend alone.","endBoard":"Kewl Tune: B2B, Loudness War, RS, two Tuners in the GY."},{"title":"Turn 2 — Dark Magician","lp":"Kewl Tune 8000 — Dark Magician 8000","actions":["Dark Magical Circle is activated.","Magician's Rod is Normal Summoned and activates to search Dark Magical Curtain.","B2B responds to Rod's monster effect, Special Summons Reco, and immediately Synchro Summons Baronne de Fleur.","Rod resolves and adds the Spell.","Magicians' Souls sends Dark Magician to the GY and attempts to Special Summon itself.","Baronne negates Souls and destroys it.","The Gaze of Timaeus targets Dark Magician in the GY.","RS negates the Spell activation.","Dark Magician cannot establish Dragoon and sets Soul Servant."],"audit":"B2B is triggered by Rod, not Circle. Waiting for the first monster effect creates Baronne before Souls or The Gaze of Timaeus can resolve.","endBoard":"Kewl Tune retains B2B, Loudness War, Baronne, and RS; Dark Magician has only Circle and a Set card."},{"title":"Turn 3 — Kewl Tune","lp":"Kewl Tune 8000 — Dark Magician 0","actions":["Reco is used as Synchro Material and destroys Dark Magical Circle.","Mix is used as Synchro Material and destroys Magician's Rod.","B2B gives the remaining Tuners a second attack.","B2B, Baronne, Loudness War, and the Tuners attack for lethal."],"audit":"Kewl Tune uses the two material triggers on separate card types, clearing the Continuous Spell and monster before combat.","endBoard":"Kewl Tune wins Game 1."}],"decidingFactor":"B2B turns Rod's mandatory engine activation into Baronne before Dark Magician can resolve Souls or The Gaze of Timaeus."},{"title":"Game 2","winner":"Dark Magician","firstPlayer":"Dark Magician","sideDeck":{"Dark Magician":"Adds Secret Village of the Spellcasters, Solemn Judgment, and Dimensional Barrier.","Kewl Tune":"Adds Cosmic Cyclone, Book of Eclipse, and Playlist."},"openingHands":{"Dark Magician":["Magicians' Souls","Magician's Rod","Dark Magical Circle","Secret Village of the Spellcasters","The Gaze of Timaeus"],"Kewl Tune":["Kewl Tune Rotary","Kewl Tune Cue","Kewl Tune Reco","Kewl Tune Mix","Book of Eclipse"]},"turns":[{"title":"Turn 1 — Dark Magician","lp":"Dark Magician 8000 — Kewl Tune 8000","actions":["Magicians' Souls sends Dark Magician to the GY and Special Summons itself.","Dark Magical Circle is activated.","Magician's Rod is Normal Summoned and adds Soul Servant.","The Gaze of Timaeus shuffles Dark Magician from the GY into the Deck to Fusion Summon Red-Eyes Dark Dragoon.","Secret Village of the Spellcasters is activated while Rod remains face-up.","Dark Magician sets Soul Servant."],"audit":"Rod remains on the field so Secret Village stays active even if Dragoon is temporarily negated.","endBoard":"Dark Magician: Dragoon, Rod, Circle, Secret Village, Set Soul Servant."},{"title":"Turn 2 — Kewl Tune","lp":"Dark Magician 8000 — Kewl Tune 8000","actions":["Secret Village prevents Book of Eclipse from being activated.","Rotary reveals itself with Reco and Normal Summons Reco through its monster effect.","Cue is Normal Summoned and Special Summons Mix.","Reco and Mix are used for Kewl Tune Track Maker; Reco's Synchro-material effect targets Secret Village.","Dragoon discards Soul Servant, negates Reco's effect, and destroys the newly Summoned Track Maker.","Kewl Tune continues with Cue and Rotary, but Dark Magical Circle banishes the next Synchro body when Dark Magician is revived through Soul Servant's setup.","With Secret Village still face-up, Kewl Tune cannot activate Book of Eclipse or Kewl Tune Synchro and passes."],"audit":"Kewl Tune correctly tries to remove Secret Village through a monster-triggered Reco effect. Dragoon's negate is assigned to that effect because it is the only action that would unlock the Spell hand.","endBoard":"Dark Magician retains Dragoon, Rod, Circle, and Secret Village."},{"title":"Turn 3 — Dark Magician","lp":"Dark Magician 8000 — Kewl Tune 0","actions":["Dragoon destroys the remaining Kewl Tune monster and gains ATK.","Circle banishes the final face-up card when Dark Magician returns.","Dragoon, Rod, and Dark Magician attack for lethal."],"audit":"Dark Magician clears the last Tuner before combat to prevent Clip or Remix from creating an opponent-turn Synchro.","endBoard":"Dark Magician wins Game 2."}],"decidingFactor":"Dragoon negates Reco's material trigger, preserving Secret Village and locking every Kewl Tune Spell in hand."},{"title":"Game 3","winner":"Kewl Tune","firstPlayer":"Kewl Tune","sideDeck":{"Kewl Tune":"Chooses to play first and retains Playlist plus Cosmic Cyclone.","Dark Magician":"Adds Harpie's Feather Duster and keeps Secret Village."},"openingHands":{"Kewl Tune":["Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Cue","Kewl Tune Remix","Kewl Tune Playlist"],"Dark Magician":["Harpie's Feather Duster","Magician's Rod","Secret Village of the Spellcasters","Dark Magical Circle","The Gaze of Timaeus"]},"turns":[{"title":"Turn 1 — Kewl Tune","lp":"Kewl Tune 8000 — Dark Magician 8000","actions":["Rotary immediately Normal Summons Mix; Mix adds Reco.","Cue is Normal Summoned and Special Summons Clip.","The material sequence produces Loudness War and Kewl Tune RS.","Kewl Tune Remix is established as the opponent-turn bridge.","Kewl Tune Sets Playlist instead of committing every Tuner to B2B."],"audit":"The first-turn board keeps Remix available so a board wipe can be converted into B2B after the first exchange.","endBoard":"Kewl Tune: Loudness War, RS, Remix, Set Playlist."},{"title":"Turn 2 — Dark Magician","lp":"Kewl Tune 8000 — Dark Magician 8000","actions":["Harpie's Feather Duster is activated.","Playlist chains, applies Reco's material effect to destroy Dark Magical Circle after it is activated, then returns Reco to the hand.","Duster resolves and destroys Playlist.","Secret Village of the Spellcasters is activated.","Magician's Rod is Normal Summoned and activates.","B2B is not yet on the field, so Kewl Tune allows Rod to search The Gaze of Timaeus.","Remix Tributes itself, recovers two Tuners, and Synchro Summons Kewl Tune B2B.","Dark Magician activates The Gaze of Timaeus.","RS negates the Quick-Play Spell.","When Rod's follow-up monster effect activates, B2B Special Summons Reco and Synchro Summons Baronne de Fleur.","Reco's material effect destroys Secret Village."],"audit":"Playlist is activated before Duster resolves, turning the threatened Trap into removal. Remix waits until Dark Magician has committed Rod, and B2B then converts the next monster activation into Baronne.","endBoard":"Kewl Tune: B2B, Baronne, Loudness War. Dark Magician has only Rod."},{"title":"Turn 3 — Kewl Tune","lp":"Kewl Tune 8000 — Dark Magician 0","actions":["Baronne destroys Rod.","B2B and the remaining Tuners make two attacks each where applicable.","Kewl Tune reaches lethal damage."],"audit":"With Secret Village and Circle gone, no additional Synchro climb is needed.","endBoard":"Kewl Tune wins Game 3 and the match 2–1."}],"decidingFactor":"Playlist converts Harpie's Feather Duster into value, Remix creates B2B after Rod is committed, and Reco removes Secret Village through a monster effect."}],"analysis":["Kewl Tune wins 2–1 and remains undefeated at 6–0.","Secret Village is not an automatic win because Kewl Tune can generate removal through Reco's Synchro-material monster effect.","Dark Magician takes Game 2 by assigning Dragoon's negate specifically to Reco's attempt to destroy Secret Village.","Kewl Tune adapts in Game 3 by preserving Playlist and Remix, forcing Dark Magician to interact with three different resource layers."]},{"id":"r6-m3-toon-toon-turbo","round":"Round 6","title":"Toon vs. Toon Turbo","players":["Toon","Toon Turbo"],"score":"Toon Turbo 2–1","status":"complete","detailLevel":"full","context":["Toon enters at 2–3; Toon Turbo enters at 1–4.","Both decks use Perfect World, Funny Dark Rabbit, Comic Cat, Evil Box, and Toon Terror. The difference is structural: Toon uses the Maliss Link engine, while Toon Turbo converts Toon bodies and the GY into Blue-Eyes Toon Ultimate Dragon and Dark Magician Fusions.","Only one Toon Terror can be activated per turn, so the mirror is decided by presenting a second must-answer effect after the Counter Trap is spent."],"games":[{"title":"Game 1","winner":"Toon","firstPlayer":"Toon","openingHands":{"Toon":["Dimension Shifter","Maliss in Underground","Funny Dark Rabbit","Evil Box","Toon Terror"],"Toon Turbo":["Funny Dark Rabbit","Comic Cat","Toon Dark Magician","Toon Bookmark","Dominus Impulse"]},"turns":[{"title":"Turn 1 — Toon","lp":"Toon 7400 — Toon Turbo 8000","actions":["Dimension Shifter is activated before any card is committed.","Maliss in Underground banishes Maliss P Dormouse.","Dormouse returns for 300 LP, banishes Maliss P White Rabbit, and White Rabbit returns for another 300 LP.","White Rabbit Sets Maliss C MTP-07.","Funny Dark Rabbit establishes Toon World the Perfect World.","Evil Box Special Summons itself and Sets Toon Terror.","The three Maliss bodies Link Summon Maliss Q Hearts Crypter.","Toon ends on Hearts Crypter, Evil Box, Perfect World, MTP-07, and Toon Terror."],"audit":"Dimension Shifter is used before Underground so every Toon Turbo Fusion material and recovery card will be banished instead of reaching the GY.","endBoard":"Toon: Hearts Crypter, Evil Box, Perfect World, MTP-07, Toon Terror."},{"title":"Turn 2 — Toon Turbo","lp":"Toon 7400 — Toon Turbo 8000","actions":["Toon Bookmark attempts to search Toon World the Perfect World.","Toon Terror negates Bookmark and destroys it.","Funny Dark Rabbit is Normal Summoned and places Perfect World directly from the Deck.","Comic Cat is Normal Summoned through Funny's additional Normal Summon.","Comic Cat attempts to Tribute Hearts Crypter and Special Summon Toon Dark Magician.","Hearts Crypter chains, shuffles a banished Maliss card into the Deck, and banishes Comic Cat before it resolves.","Dominus Impulse cannot negate the non-Chain Link Summon already completed and is held.","Toon Turbo passes with Funny and Perfect World."],"audit":"Toon Terror is used on Bookmark because it is the first action that would make every Toon Turbo card live. Hearts is reserved for Comic Cat, the nonstandard Tribute-removal threat.","endBoard":"Toon retains Hearts, Evil Box, MTP-07, and its Field Spell."},{"title":"Turn 3 — Toon","lp":"Toon 6500 — Toon Turbo 0","actions":["MTP-07 adds Maliss P March Hare and banishes Hearts Crypter.","Hearts pays 900 LP, Special Summons itself, and doubles to 5000 ATK.","Perfect World searches Comic Cat.","Comic Cat Tributes Funny Dark Rabbit and Special Summons Evil Box from the Deck.","Hearts, both Evil Box bodies, and March Hare attack for lethal."],"audit":"The 5000 ATK Hearts line is chosen over a longer Link climb because Toon Turbo has no remaining monster interaction.","endBoard":"Toon wins Game 1."}],"decidingFactor":"Dimension Shifter removes Toon Turbo's Fusion materials from normal circulation, while Toon Terror and Hearts answer Bookmark and Comic Cat separately."},{"title":"Game 2","winner":"Toon Turbo","firstPlayer":"Toon Turbo","sideDeck":{"Toon Turbo":"Adds Mind Scan, Solemn Judgment, and Evenly Matched; chooses to play first.","Toon":"Adds Cosmic Cyclone, Book of Eclipse, and Evenly Matched."},"openingHands":{"Toon Turbo":["Funny Dark Rabbit","Evil Box","Toon Dark Magician","Mind Scan","Solemn Judgment"],"Toon":["Evenly Matched","Cosmic Cyclone","Maliss in Underground","Funny Dark Rabbit","Comic Cat"]},"turns":[{"title":"Turn 1 — Toon Turbo","lp":"Toon Turbo 8000 — Toon 8000","actions":["Funny Dark Rabbit establishes Toon World the Perfect World and places Mind Scan.","Evil Box Special Summons itself and Sets Toon Terror.","Toon Dark Magician sends the required Toon resource and establishes Blue-Eyes Toon Dragon.","Blue-Eyes Toon Dragon and two Toon monsters are returned from the hand, field, and GY to Special Summon Blue-Eyes Toon Ultimate Dragon.","Blue-Eyes Toon Ultimate Dragon recovers Toon Dark Magician from the GY.","Toon Turbo Sets Solemn Judgment and Toon Terror.","Mind Scan reveals Toon's hand and identifies Evenly Matched, Cosmic Cyclone, Underground, Funny, and Comic Cat."],"audit":"Mind Scan allows Toon Turbo to assign its two negates in advance. Toon Terror is reserved for Evenly Matched; Judgment is reserved for Cosmic Cyclone or Book of Eclipse.","endBoard":"Toon Turbo: Blue-Eyes Toon Ultimate Dragon, Perfect World, Mind Scan, Toon Terror, Judgment."},{"title":"Turn 2 — Toon","lp":"Toon Turbo 4000 — Toon 8000","actions":["During the Draw Phase, Cosmic Cyclone targets Toon World the Perfect World.","Solemn Judgment negates Cosmic Cyclone and halves Toon Turbo's LP.","Toon enters the Battle Phase and activates Evenly Matched.","Toon Terror negates Evenly Matched and destroys it.","Maliss in Underground begins the Dormouse and White Rabbit line.","White Rabbit Sets MTP-07.","Comic Cat is Normal Summoned and attempts to Tribute Blue-Eyes Toon Ultimate Dragon.","Perfect World temporarily banishes the Fusion Monster before Comic Cat resolves, so Comic Cat must Tribute itself and summons Funny Dark Rabbit instead.","Blue-Eyes Toon Ultimate Dragon returns immediately after the effect resolves.","Toon cannot reach Hearts Crypter with enough remaining bodies and passes."],"audit":"The two back-row negates are assigned using Mind Scan's information. Perfect World's temporary banish preserves the Fusion Monster from Comic Cat without spending another activation.","endBoard":"Toon Turbo retains Blue-Eyes Toon Ultimate Dragon and Perfect World; Toon has Funny and one Maliss body."},{"title":"Turn 3 — Toon Turbo","lp":"Toon Turbo 4000 — Toon 0","actions":["Blue-Eyes Toon Ultimate Dragon recovers Evil Box from the GY.","Evil Box Special Summons itself and Sets Toon Briefcase.","Perfect World searches Toon Dark Magician.","Blue-Eyes Toon Ultimate Dragon allows the Toon monsters to attack directly.","The Fusion Monster and the supporting Toon bodies deal lethal damage."],"audit":"Toon Turbo does not Link away the Fusion. Its direct-attack effect and 4500 ATK are already the shortest lethal line.","endBoard":"Toon Turbo wins Game 2."}],"decidingFactor":"Mind Scan exposes the full board-breaking sequence, allowing Judgment, Toon Terror, and Perfect World to answer Cosmic Cyclone, Evenly Matched, and Comic Cat in order."},{"title":"Game 3","winner":"Toon Turbo","firstPlayer":"Toon","sideDeck":{"Toon":"Chooses to play first and keeps Dimension Shifter plus Toon Terror.","Toon Turbo":"Adds Book of Eclipse, Cosmic Cyclone, and a second copy of Mind Scan."},"openingHands":{"Toon":["Dimension Shifter","Funny Dark Rabbit","Evil Box","Toon Terror","Maliss P White Rabbit"],"Toon Turbo":["Cosmic Cyclone","Book of Eclipse","Funny Dark Rabbit","Toon Dark Magician","Evil Box"]},"turns":[{"title":"Turn 1 — Toon","lp":"Toon 8000 — Toon Turbo 8000","actions":["Dimension Shifter is activated.","Funny Dark Rabbit establishes Perfect World.","Maliss P White Rabbit is Normal Summoned through Funny's additional Normal Summon and Sets MTP-07.","Evil Box Special Summons itself and Sets Toon Terror.","Funny, White Rabbit, and Evil Box Link Summon Maliss Q Hearts Crypter.","Toon ends on Hearts, Perfect World, MTP-07, and Toon Terror."],"audit":"Toon chooses Hearts over I:P because Hearts provides removal without requiring cards to enter the GY under Dimension Shifter.","endBoard":"Toon: Hearts Crypter, Perfect World, MTP-07, Toon Terror."},{"title":"Turn 2 — Toon Turbo","lp":"Toon 8000 — Toon Turbo 8000","actions":["Cosmic Cyclone targets Perfect World.","Toon Terror negates Cosmic Cyclone and destroys it.","Book of Eclipse resolves as the second must-answer Spell, flipping Hearts Crypter face-down.","Funny Dark Rabbit is Normal Summoned and establishes Toon Turbo's own Perfect World.","Evil Box Special Summons itself and Sets Toon Terror.","Toon Dark Magician establishes Blue-Eyes Toon Dragon.","The available Toon materials are returned to Special Summon Blue-Eyes Toon Ultimate Dragon.","MTP-07 cannot banish the face-down Hearts without a face-up Maliss Link Monster.","Blue-Eyes Toon Ultimate Dragon and the remaining bodies attack, leaving Toon at 1700 LP."],"audit":"Cosmic Cyclone is intentionally sacrificed to Toon Terror. Book of Eclipse then resolves because only one Toon Terror may be activated that turn.","endBoard":"Toon Turbo: Blue-Eyes Toon Ultimate Dragon, Perfect World, Toon Terror. Toon: face-down Hearts, MTP-07, 1700 LP."},{"title":"Turn 3 — Toon","lp":"Toon 1700 — Toon Turbo 8000","actions":["Hearts Crypter is Flip Summoned, but it no longer has a banished Maliss card available to recycle under Dimension Shifter.","MTP-07 adds March Hare and attempts to banish Blue-Eyes Toon Ultimate Dragon.","Toon Terror negates MTP-07 and destroys it.","March Hare Special Summons itself, but Toon cannot produce enough damage through the 4500 ATK Fusion Monster.","Toon sets its final card and passes."],"audit":"Toon Turbo uses Toon Terror on MTP-07, the one effect that could banish the Fusion Monster and restore Hearts' interaction.","endBoard":"Toon Turbo retains the Fusion Monster and Field Spell."},{"title":"Turn 4 — Toon Turbo","lp":"Toon 0 — Toon Turbo 8000","actions":["Perfect World searches Comic Cat.","Comic Cat removes Hearts Crypter.","Blue-Eyes Toon Ultimate Dragon attacks directly for lethal."],"audit":"Comic Cat clears Hearts before combat so no revived Maliss Link can alter the damage step.","endBoard":"Toon Turbo wins Game 3 and the match 2–1."}],"decidingFactor":"Toon Turbo deliberately feeds Cosmic Cyclone into the once-per-turn Toon Terror, then resolves Book of Eclipse to shut off Hearts Crypter before executing the Fusion line."}],"analysis":["Toon Turbo wins 2–1 and moves to 2–4.","The mirror demonstrates why the once-per-turn clause on Toon Terror matters: a second board breaker always resolves unless another independent negate is present.","Toon wins when Dimension Shifter and Hearts prevent Toon Turbo from recycling Fusion materials.","Toon Turbo wins the post-side games by using Mind Scan to assign responses and by forcing Toon Terror before resolving Book of Eclipse."]},{"id":"r6-m4-branded-sky-striker","round":"Round 6","title":"Branded vs. Sky Striker","players":["Branded","Sky Striker"],"score":"Sky Striker 2–1","status":"complete","detailLevel":"full","context":["Branded enters at 3–2; Sky Striker enters at 3–2.","Sky Striker can exploit Mirrorjade's delayed End Phase destruction: after taking Mirrorjade with Widow Anchor and using it as Link Material, Raye can rebuild after the delayed wipe.","Branded sides Anti-Spell Fragrance and Cosmic Cyclone. Sky Striker sides Evenly Matched, Shark Cannon, and additional back-row removal."],"games":[{"title":"Game 1","winner":"Branded","firstPlayer":"Branded","openingHands":{"Branded":["Aluber the Jester of Despia","Branded Fusion","Phara the Primordial Goddess","The Fallen & The Virtuous","Branded Retribution"],"Sky Striker":["Sky Striker Ace - Raye","Sky Striker Mobilize – Engage!","Sky Striker Mecha – Widow Anchor","Sky Striker Mecha – Linkage!","Radiant Typhoon Vision"]},"turns":[{"title":"Turn 1 — Branded","lp":"Branded 8000 — Sky Striker 8000","actions":["Phara the Primordial Goddess reveals itself with Branded Fusion, preventing either player from chaining to activations of Branded Fusion through the end of the next turn.","Aluber the Jester of Despia is Normal Summoned and adds Super Polymerization.","Branded Fusion sends Fallen of Albaz and Tri-Brigade Mercourier to Fusion Summon Lubellion the Searing Dragon.","Lubellion discards Branded Retribution and Fusion Summons Mirrorjade the Iceblade Dragon.","Mercourier provides follow-up.","Branded Sets The Fallen & The Virtuous and Super Polymerization."],"audit":"Phara is revealed with Branded Fusion before the search line, ensuring the central Fusion Spell cannot be stopped by Ash Blossom or another response.","endBoard":"Branded: Mirrorjade, Aluber, The Fallen & The Virtuous, Super Polymerization."},{"title":"Turn 2 — Sky Striker","lp":"Branded 8000 — Sky Striker 8000","actions":["Radiant Typhoon Vision draws two cards and discards Linkage, placing two Spells into the GY.","Engage adds Afterburners.","Raye is Normal Summoned and Link Summons Hayate.","Hayate attacks directly and sends Shark Cannon to the GY.","Afterburners destroys Aluber and, with three Spells now in the GY, also destroys Super Polymerization.","Mirrorjade banishes Hayate.","Linkage sends the remaining Set card and Special Summons Kagari; Kagari returns Engage.","The Fallen & The Virtuous sends an Albaz Fusion from the Extra Deck and destroys Kagari.","Sky Striker ends without a Link Monster."],"audit":"Sky Striker uses Afterburners only after three Spells are established, converting one card into monster and back-row removal. Branded has deliberately split Mirrorjade and The Fallen & The Virtuous into two separate answers.","endBoard":"Branded retains Mirrorjade; Sky Striker has Engage but no monster."},{"title":"Turn 3 — Branded","lp":"Branded 8000 — Sky Striker 0","actions":["Branded Retribution recovers Branded Fusion.","Branded Fusion produces Albion the Branded Dragon and a second Fusion attacker.","Mirrorjade and Albion clear the remaining Sky Striker cards.","The Fusion monsters attack for lethal."],"audit":"Branded rebuilds before entering combat so Widow Anchor cannot stop the full damage total with one negate.","endBoard":"Branded wins Game 1."}],"decidingFactor":"Branded presents Mirrorjade and The Fallen & The Virtuous as two separate removal effects, exhausting Sky Striker's first Link ladder."},{"title":"Game 2","winner":"Sky Striker","firstPlayer":"Sky Striker","sideDeck":{"Sky Striker":"Adds Shark Cannon, Cosmic Cyclone, and Solemn Judgment while playing first.","Branded":"Adds Anti-Spell Fragrance and Cosmic Cyclone."},"openingHands":{"Sky Striker":["Radiant Typhoon Vision","Mystical Space Typhoon","Sky Striker Ace - Raye","Sky Striker Mobilize – Engage!","Sky Striker Mecha – Widow Anchor"],"Branded":["Aluber the Jester of Despia","Branded Fusion","The Fallen & The Virtuous","Anti-Spell Fragrance","Cosmic Cyclone"]},"turns":[{"title":"Turn 1 — Sky Striker","lp":"Sky Striker 8000 — Branded 8000","actions":["Radiant Typhoon Vision draws two and discards a Quick-Play Spell.","Engage adds Sky Striker Mecha - Shark Cannon.","Raye Link Summons Shizuku.","Sky Striker Sets Widow Anchor, Shark Cannon, and Mystical Space Typhoon.","Shizuku adds Sky Striker Special Maneuver - Lemnisgate! during the End Phase."],"audit":"Vision is used before Engage so the deck reaches three Spells quickly and ensures Widow Anchor and Shark Cannon have their enhanced effects.","endBoard":"Sky Striker: Shizuku, Widow Anchor, Shark Cannon, MST, Lemnisgate in hand."},{"title":"Turn 2 — Branded","lp":"Sky Striker 8000 — Branded 8000","actions":["Anti-Spell Fragrance is activated in the Standby Phase.","Mystical Space Typhoon chains and destroys Anti-Spell before it can lock the Spells in hand.","Aluber is Normal Summoned and adds Branded Fusion.","Branded Fusion creates Albion and then Mirrorjade.","Shark Cannon targets Fallen of Albaz in the GY and Special Summons it to Sky Striker's field because three Spells are in the GY.","Mirrorjade attempts to banish Shizuku.","Widow Anchor negates Mirrorjade and takes control of it.","Sky Striker keeps the borrowed Mirrorjade until its own turn while Branded Sets The Fallen & The Virtuous and Cosmic Cyclone."],"audit":"MST is reserved specifically for Anti-Spell. Shark Cannon removes Albaz from Branded's GY and supplies a Main Monster Zone body only after Widow Anchor is ready to take Mirrorjade.","endBoard":"Sky Striker controls Shizuku, borrowed Mirrorjade, and borrowed Albaz."},{"title":"Turn 3 — Sky Striker","lp":"Sky Striker 8000 — Branded 8000","actions":["Mirrorjade is used as Link Material with the borrowed Albaz to Link Summon Sky Striker Ace – Camellia.","Camellia sends Linkage from the Deck to the GY.","Cosmic Cyclone banishes Lemnisgate before it can recycle the GY.","Engage adds a second Widow Anchor and draws a card.","Camellia and Raye produce Sky Striker Ace – Zeke, temporarily banishing Albion.","Hayate and Linkage attacks reduce Branded to 1800 LP.","During the End Phase, Mirrorjade's delayed destruction clears the Sky Striker Link Monster.","Because a face-up Sky Striker Ace Link Monster left the field due to the opponent's Mirrorjade effect, Raye Special Summons itself from the GY."],"audit":"Sky Striker intentionally converts Mirrorjade into Link Material. Its delayed wipe removes the Link body, but that destruction also turns on Raye's recursion, so Branded does not gain a clean reset.","endBoard":"Sky Striker ends with Raye and a large Spell advantage; Branded is at 1800 LP."},{"title":"Turn 4 — Branded","lp":"Sky Striker 8000 — Branded 1800","actions":["The Fallen & The Virtuous destroys Raye.","Raye chains and Special Summons Kagari.","Kagari returns Engage.","Branded cannot establish enough damage through the second Widow Anchor and passes."],"audit":"Raye chains before being destroyed, denying Branded the clean removal and recovering Engage through Kagari.","endBoard":"Sky Striker retains Kagari, Engage, and Widow Anchor."},{"title":"Turn 5 — Sky Striker","lp":"Sky Striker 8000 — Branded 0","actions":["Engage adds Linkage and draws.","Kagari becomes Hayate and attacks directly.","Linkage converts Hayate into the final attacker for lethal."],"audit":"The direct-attack Linkage line avoids interacting with Branded's remaining set card.","endBoard":"Sky Striker wins Game 2."}],"decidingFactor":"Sky Striker uses the opponent's Mirrorjade as Link Material, then converts Mirrorjade's delayed board wipe into Raye recursion."},{"title":"Game 3","winner":"Sky Striker","firstPlayer":"Branded","sideDeck":{"Branded":"Chooses to play first and keeps Anti-Spell Fragrance plus Super Polymerization.","Sky Striker":"Adds Evenly Matched, Cosmic Cyclone, and a second Shark Cannon."},"openingHands":{"Branded":["Aluber the Jester of Despia","Branded Fusion","Phara the Primordial Goddess","Anti-Spell Fragrance","Super Polymerization"],"Sky Striker":["Evenly Matched","Cosmic Cyclone","Sky Striker Ace - Raye","Sky Striker Mobilize – Engage!","Sky Striker Mecha – Widow Anchor"]},"turns":[{"title":"Turn 1 — Branded","lp":"Branded 8000 — Sky Striker 8000","actions":["Phara reveals itself with Branded Fusion.","Aluber adds The Fallen & The Virtuous.","Branded Fusion produces Lubellion and then Mirrorjade.","Branded Sets Anti-Spell Fragrance, Super Polymerization, and The Fallen & The Virtuous."],"audit":"Branded keeps the board compact: one monster and three back-row cards minimize the damage from Evenly Matched while still representing multiple interactions.","endBoard":"Branded: Mirrorjade, Anti-Spell, Super Polymerization, The Fallen & The Virtuous."},{"title":"Turn 2 — Sky Striker","lp":"Branded 8000 — Sky Striker 8000","actions":["During the Draw Phase, Cosmic Cyclone targets Anti-Spell Fragrance.","Branded chains Anti-Spell, but Cosmic Cyclone banishes it before the continuous restriction can apply after the Chain resolves.","Sky Striker enters the Battle Phase and activates Evenly Matched.","Branded keeps Mirrorjade and banishes Super Polymerization plus The Fallen & The Virtuous face-down.","In Main Phase 2, Engage adds Linkage.","Raye is Normal Summoned and Link Summons Kagari.","Kagari returns Engage.","Mirrorjade banishes Kagari.","Linkage sends Engage and Special Summons Shizuku.","Shizuku adds Shark Cannon during the End Phase."],"audit":"Cosmic Cyclone is used in the Draw Phase so Anti-Spell cannot force Engage and Linkage to be Set. Evenly Matched then removes both reactive back-row cards before the Link engine begins.","endBoard":"Branded retains Mirrorjade only; Sky Striker has Shizuku and Shark Cannon."},{"title":"Turn 3 — Branded","lp":"Branded 8000 — Sky Striker 8000","actions":["Mirrorjade sends an Albaz Fusion to the GY and attempts to banish Shizuku.","Widow Anchor negates Mirrorjade and takes control because three Spells are in the GY.","Branded Normal Summons Aluber and searches Branded Fusion.","Shark Cannon banishes Fallen of Albaz from the GY before Branded Fusion can use the expected resource loop.","Branded Fusion still creates Albion using a second Albaz, but the line has fewer follow-up targets and cannot produce lethal."],"audit":"Widow Anchor is saved for Mirrorjade's active removal. Shark Cannon is then used on Albaz, reducing the quality of both Branded Fusion and the End Phase recursion.","endBoard":"Sky Striker controls borrowed Mirrorjade and Shizuku; Branded controls Albion and Aluber."},{"title":"Turn 4 — Sky Striker","lp":"Branded 8000 — Sky Striker 8000","actions":["Borrowed Mirrorjade and Shizuku Link Summon Sky Striker Ace – Zeke.","Zeke temporarily banishes Albion.","Engage adds Afterburners and draws.","Afterburners destroys Aluber.","Sky Striker Special Maneuver - Lemnisgate! shuffles matching Sky Striker monsters and Spells into the Deck and returns Branded's final face-up card to the hand.","The Linkage ladder through Hayate and Kagari reduces Branded to 900 LP.","Mirrorjade's delayed End Phase destruction clears the Link Monster, and Raye revives."],"audit":"Lemnisgate is used after the GY contains matched monsters and Spells, generating removal while recycling the limited Link-1 monsters.","endBoard":"Sky Striker ends with Raye and Engage; Branded is at 900 LP."},{"title":"Turn 5 — Branded","lp":"Branded 900 — Sky Striker 8000","actions":["Branded attempts one final Branded Fusion line.","Engage has already found a second Widow Anchor, which negates the new Fusion Monster.","Branded passes without lethal."],"audit":"Sky Striker does not spend Widow Anchor on the starter; it waits for the Fusion Monster that would produce removal or lethal damage.","endBoard":"Branded has one negated Fusion Monster."},{"title":"Turn 6 — Sky Striker","lp":"Branded 0 — Sky Striker 8000","actions":["Raye becomes Hayate.","Hayate attacks directly for the final 900 damage."],"audit":"The direct attack avoids the negated Fusion Monster entirely.","endBoard":"Sky Striker wins Game 3 and the match 2–1."}],"decidingFactor":"Cosmic Cyclone removes Anti-Spell before it applies, Evenly Matched strips the reactive back row, and Widow Anchor converts Mirrorjade into Link Material a second time."}],"analysis":["Sky Striker wins 2–1 and moves to 4–2.","The matchup rewards Sky Striker for using Mirrorjade as Link Material rather than merely negating it.","Mirrorjade's delayed End Phase destruction is not a clean answer when it destroys a Sky Striker Link Monster and therefore revives Raye.","Branded wins Game 1 by splitting removal across Mirrorjade and The Fallen & The Virtuous, but loses the post-side games when Anti-Spell is removed before it can constrain the Spell engine."]},{"id":"r7-m1-power-patron-toon-turbo","round":"Round 7","title":"Power Patron vs. Toon Turbo","players":["Power Patron","Toon Turbo"],"score":"Power Patron 2–1","status":"complete","detailLevel":"full","context":["Power Patron enters the final round at 5–1; Toon Turbo enters at 2–4.","Toon Turbo can expose and pre-assign its interaction with Mind Scan, but Toon Terror remains once per turn. Power Patron's objective is to force that Counter Trap with the first Artmage activation and preserve Nerva for the second.","Power Patron sides Cosmic Cyclone, Solemn Judgment, and Book of Eclipse. Toon Turbo sides Evenly Matched, Harpie's Feather Duster, Mind Scan, and Solemn Judgment."],"games":[{"title":"Game 1","winner":"Power Patron","firstPlayer":"Power Patron","openingHands":{"Power Patron":["Artmage Vandalism -Assault-","Medius the Pure","Plundered Power Patron Plane – Vidolia","Prohibited Power Patron Portal - Terminus","Artmage Impasto -Recapture-"],"Toon Turbo":["Funny Dark Rabbit","Evil Box","Toon Dark Magician","Forbidden Droplet","Toon Terror"]},"turns":[{"title":"Turn 1 — Power Patron","lp":"Power Patron 8000 — Toon Turbo 8000","actions":["Artmage Vandalism -Assault- adds a second Medius the Pure and makes the Fusion materials interchangeable.","Medius the Pure is Normal Summoned and Special Summons Power Patron DoomZ.","Plundered Power Patron Plane – Vidolia reveals Nerva the Power Patron of Creation and deploys Nervedo the Shadebeast Power Patron.","Nervedo destroys itself and Fusion Summons Nerva; its face-up Extra Deck effect Special Summons Artmage Power Patron.","Artmage Power Patron and the remaining Artmage body Fusion Summon Artmage Non-Finito.","Non-Finito Sets a second Artmage Impasto -Recapture-. Terminus places Jupredo the Shademachine Power Patron in the GY for the Xyz branch.","Power Patron ends with Nerva, Non-Finito, DoomZ, and two differently timed Artmage activations."],"audit":"The board is intentionally split. Toon Terror can stop one Artmage activation, but it cannot be activated a second time during the same turn, leaving Nerva live for the next effect.","endBoard":"Power Patron: Nerva, Non-Finito, DoomZ, two Set Impasto cards."},{"title":"Turn 2 — Toon Turbo","lp":"Power Patron 8000 — Toon Turbo 8000","actions":["Funny Dark Rabbit is Normal Summoned and establishes Toon World the Perfect World.","Evil Box Special Summons itself and Sets Toon Terror.","Toon Dark Magician enters through the Toon engine and begins the Fusion package.","Non-Finito activates its opponent-turn Fusion effect. Toon Terror negates that activation and destroys Non-Finito.","Toon Turbo activates Forbidden Droplet, sending a card from hand and Perfect World to negate Nerva and DoomZ.","Power Patron chains the second Artmage Impasto -Recapture-, temporarily banishing Artmage Power Patron and negating Droplet.","Artmage Power Patron then activates after returning. Nerva rewrites that effect into destruction of every card Toon Turbo controls.","Perfect World is no longer face-up to hide a Toon monster, so Funny, Evil Box, Toon Dark Magician, and Toon Terror are all destroyed."],"audit":"Toon Turbo correctly spends Toon Terror on the first opponent-turn Fusion effect, but that leaves no Counter Trap for the second Artmage activation. Sending Perfect World with Droplet also removes its temporary-banish protection before Nerva resolves.","endBoard":"Power Patron retains Nerva and DoomZ; Toon Turbo has no field."},{"title":"Turn 3 — Power Patron","lp":"Power Patron 8000 — Toon Turbo 0","actions":["Power Patron DoomZ and the recovered Medius the Pure Xyz Summon DoomZ Break - Diactorus.","Diactorus clears Toon Turbo's final Set card.","Nerva, Diactorus, and the revived Artmage attacker deal lethal damage."],"audit":"Diactorus is used before combat so no unknown Toon Trap can interrupt the lethal sequence.","endBoard":"Power Patron wins Game 1."}],"decidingFactor":"Power Patron presents two separate Artmage activations. Toon Terror stops the first, while Impasto protects the second from Forbidden Droplet and allows Nerva to clear the field."},{"title":"Game 2","winner":"Toon Turbo","firstPlayer":"Toon Turbo","sideDeck":{"Toon Turbo":"Adds Mind Scan, Solemn Judgment, and Evenly Matched; chooses to play first.","Power Patron":"Adds Cosmic Cyclone, Evenly Matched, and Book of Eclipse."},"openingHands":{"Toon Turbo":["Funny Dark Rabbit","Evil Box","Toon Dark Magician","Mind Scan","Solemn Judgment"],"Power Patron":["Cosmic Cyclone","Evenly Matched","Artmage Vandalism -Assault-","Medius the Pure","Plundered Power Patron Plane – Vidolia"]},"turns":[{"title":"Turn 1 — Toon Turbo","lp":"Toon Turbo 8000 — Power Patron 8000","actions":["Funny Dark Rabbit establishes Toon World the Perfect World and places Mind Scan.","Evil Box Special Summons itself and Sets Toon Terror.","Toon Dark Magician establishes Blue-Eyes Toon Dragon.","Blue-Eyes Toon Dragon and two Toon monsters are returned to Special Summon Blue-Eyes Toon Ultimate Dragon.","Blue-Eyes Toon Ultimate Dragon recovers Toon Dark Magician from the GY.","Toon Turbo Sets Toon Terror and Solemn Judgment.","Mind Scan reveals Cosmic Cyclone, Evenly Matched, Vandalism, Medius, and Vidolia."],"audit":"Mind Scan establishes the response map before Power Patron draws: Judgment is reserved for Cosmic Cyclone, Toon Terror for Evenly Matched, and Perfect World for the first monster-removal attempt.","endBoard":"Toon Turbo: Blue-Eyes Toon Ultimate Dragon, Perfect World, Mind Scan, Toon Terror, Judgment."},{"title":"Turn 2 — Power Patron","lp":"Toon Turbo 4000 — Power Patron 8000","actions":["During the Draw Phase, Cosmic Cyclone targets Toon World the Perfect World.","Solemn Judgment negates Cosmic Cyclone and halves Toon Turbo's LP.","Power Patron enters the Battle Phase and activates Evenly Matched.","Toon Terror negates Evenly Matched and destroys it.","Vandalism adds a second Medius the Pure.","Medius is Normal Summoned and attempts to Special Summon Power Patron DoomZ.","Mind Scan's declared Medius effect is applied, blanking the first starter for the turn.","Vidolia deploys Nervedo, but Perfect World temporarily banishes Blue-Eyes Toon Ultimate Dragon before Nervedo's removal line resolves.","Nervedo produces Nerva, and the returning 4500 ATK Fusion Monster forces Power Patron to stop without a safe second Artmage activation."],"audit":"The visible hand lets Toon Turbo spend each response on the exact threat it was meant to answer. Perfect World preserves the Fusion Monster without starting a new Chain.","endBoard":"Toon Turbo retains Blue-Eyes Toon Ultimate Dragon and Perfect World; Power Patron has Nerva but no protected follow-up."},{"title":"Turn 3 — Toon Turbo","lp":"Toon Turbo 4000 — Power Patron 0","actions":["Perfect World searches Comic Cat.","Comic Cat Tributes Nerva and Special Summons Evil Box from the Deck.","Blue-Eyes Toon Ultimate Dragon allows the Toon monsters to attack directly.","The Fusion Monster, Toon Dark Magician, and Evil Box deal lethal damage."],"audit":"Comic Cat removes Nerva before combat, preventing any Artmage-effect rewrite during the lethal push.","endBoard":"Toon Turbo wins Game 2."}],"decidingFactor":"Mind Scan reveals the complete board-breaking order, allowing Judgment, Toon Terror, and Perfect World to answer Cosmic Cyclone, Evenly Matched, and Nervedo in sequence."},{"title":"Game 3","winner":"Power Patron","firstPlayer":"Power Patron","sideDeck":{"Power Patron":"Chooses to play first and retains Solemn Judgment plus Cosmic Cyclone.","Toon Turbo":"Adds Harpie's Feather Duster, Book of Eclipse, and a second Mind Scan."},"openingHands":{"Power Patron":["Artmage Vandalism -Assault-","Medius the Pure","Plundered Power Patron Plane – Vidolia","Cosmic Cyclone","Solemn Judgment"],"Toon Turbo":["Harpie's Feather Duster","Book of Eclipse","Funny Dark Rabbit","Evil Box","Toon Dark Magician"]},"turns":[{"title":"Turn 1 — Power Patron","lp":"Power Patron 8000 — Toon Turbo 8000","actions":["Vandalism adds Medius. Medius deploys Power Patron DoomZ.","Vidolia reaches Nervedo, which Fusion Summons Nerva and deploys Artmage Power Patron.","The remaining Artmage bodies produce Artmage Non-Finito.","Non-Finito Sets Artmage Impasto -Recapture-.","Power Patron Sets Cosmic Cyclone and Solemn Judgment."],"audit":"Power Patron again keeps Nerva and Non-Finito separate, but this time adds one answer for a mass board breaker and one answer for Perfect World.","endBoard":"Power Patron: Nerva, Non-Finito, DoomZ, Cosmic Cyclone, Judgment, Impasto."},{"title":"Turn 2 — Toon Turbo","lp":"Power Patron 4000 — Toon Turbo 8000","actions":["Harpie's Feather Duster is activated.","Solemn Judgment negates Duster and halves Power Patron's LP.","Funny Dark Rabbit is Normal Summoned and attempts to establish Toon World the Perfect World.","As Perfect World is placed in the Field Zone, Cosmic Cyclone banishes it before its search or protection can matter.","Evil Box can no longer Special Summon itself without Toon World.","Book of Eclipse flips Nerva and Non-Finito face-down.","Toon Dark Magician cannot establish the full Fusion line without Perfect World and is set defensively.","During the End Phase, Book of Eclipse turns the Power Patron monsters face-up and gives Power Patron replacement cards."],"audit":"Judgment is assigned to the card that would clear every defensive Spell/Trap. Cosmic Cyclone is reserved for Perfect World, leaving Book of Eclipse as a temporary delay rather than a permanent answer.","endBoard":"Power Patron regains Nerva and Non-Finito face-up; Toon Turbo has only Set monsters."},{"title":"Turn 3 — Power Patron","lp":"Power Patron 4000 — Toon Turbo 0","actions":["Non-Finito Fusion Summons Artmage Diactorus using the remaining Artmage bodies.","DoomZ and the recovered Medius Xyz Summon DoomZ Break - Diactorus.","The Fusion, Synchro, and Xyz resources are returned to Special Summon Vidolium the Unstable Power Patron of Unity.","Vidolium banishes both GYs face-down, removing every Toon recovery target.","Vidolium and Nerva attack for lethal."],"audit":"Vidolium is summoned only after Toon Turbo has placed Toon Dark Magician and its Fusion resources in the GY, maximizing the value of the face-down banish.","endBoard":"Power Patron wins Game 3 and the match 2–1."}],"decidingFactor":"Power Patron splits its answers between Harpie's Feather Duster and Perfect World, then converts Book of Eclipse's temporary delay into extra cards and a protected Vidolium finish."}],"analysis":["Power Patron wins 2–1 and finishes the tournament 6–1.","Toon Turbo is strongest when Mind Scan can assign responses before the opponent acts, but it cannot reconstruct that information advantage while going second.","Power Patron's winning games both rely on preserving a second Artmage activation after Toon Terror has been spent.","Vidolium is reserved for the final turn, when banishing both GYs removes Toon Turbo's recovery rather than merely increasing attack power."]},{"id":"r7-m2-kewl-tune-branded","round":"Round 7","title":"Kewl Tune vs. Branded","players":["Kewl Tune","Branded"],"score":"Kewl Tune 2–1","status":"complete","detailLevel":"full","context":["Kewl Tune enters the final round undefeated at 6–0; Branded enters at 3–3.","Phara can protect Branded Fusion itself, so Kewl Tune's negates are assigned to Aluber, Lubellion, Mirrorjade, and the post-Fusion follow-up rather than wasted on the protected Spell.","Kewl Tune sides Cosmic Cyclone, Evenly Matched, and Kewl Tune Playlist. Branded sides Anti-Spell Fragrance, Solemn Judgment, and Super Polymerization."],"games":[{"title":"Game 1","winner":"Kewl Tune","firstPlayer":"Kewl Tune","openingHands":{"Kewl Tune":["Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Cue","Kewl Tune Reco","Kewl Tune Synchro"],"Branded":["Phara the Primordial Goddess","Branded Fusion","Aluber the Jester of Despia","The Fallen & The Virtuous","Branded Retribution"]},"turns":[{"title":"Turn 1 — Kewl Tune","lp":"Kewl Tune 8000 — Branded 8000","actions":["Kewl Tune Rotary reveals itself with Mix and grants the additional Normal Summon.","Mix adds Kewl Tune Cue. Cue Special Summons Kewl Tune Clip.","Cue and Rotary Synchro Summon Kewl Tune Track Maker, which adds JJ “Kewl Tune”.","Track Maker and Mix become Kewl Tune Loudness War.","Kewl Tune Synchro produces Kewl Tune RS and establishes Kewl Tune Remix.","The remaining material produces Kewl Tune B2B while Reco remains available in the GY."],"audit":"B2B is built behind Loudness War and RS. The line does not rely on negating Branded Fusion itself, which may be protected by Phara.","endBoard":"Kewl Tune: B2B, Loudness War, RS, Remix, Reco in the GY."},{"title":"Turn 2 — Branded","lp":"Kewl Tune 8000 — Branded 8000","actions":["Aluber the Jester of Despia is Normal Summoned and activates.","Kewl Tune B2B responds, Special Summons Reco, and Synchro Summons Baronne de Fleur.","Aluber resolves and adds Super Polymerization.","Phara reveals itself with Branded Fusion, creating the protected activation window.","Branded Fusion sends Fallen of Albaz and Tri-Brigade Mercourier and Fusion Summons Lubellion the Searing Dragon.","Lubellion activates to create Mirrorjade.","Baronne negates Lubellion and destroys it; Phara protects Branded Fusion, not Lubellion's separate monster effect.","Mercourier adds follow-up, but RS negates The Fallen & The Virtuous.","Branded Sets Super Polymerization and Branded Retribution."],"audit":"The key optimization is waiting through the unanswerable Branded Fusion and negating Lubellion, the first separate effect that would convert it into Mirrorjade.","endBoard":"Kewl Tune retains B2B, Baronne, Loudness War, and RS; Branded has Aluber and two Set cards."},{"title":"Turn 3 — Kewl Tune","lp":"Kewl Tune 8000 — Branded 0","actions":["Reco is used as Synchro Material and destroys Super Polymerization before Branded can use it.","Mix's material effect destroys Aluber.","Baronne destroys Branded Retribution.","B2B grants the supporting Tuners additional attacks, and Kewl Tune reaches lethal."],"audit":"Kewl Tune removes Super Polymerization first because it is the only card that can convert the attacking Synchro board into a Branded Fusion Monster without targeting.","endBoard":"Kewl Tune wins Game 1."}],"decidingFactor":"Kewl Tune allows Phara-protected Branded Fusion to resolve, then negates Lubellion—the first effect outside the protected window."},{"title":"Game 2","winner":"Branded","firstPlayer":"Branded","sideDeck":{"Branded":"Adds Anti-Spell Fragrance, Solemn Judgment, and a second Super Polymerization; chooses to play first.","Kewl Tune":"Adds Cosmic Cyclone, Book of Eclipse, and Kewl Tune Playlist."},"openingHands":{"Branded":["Aluber the Jester of Despia","Branded Fusion","Anti-Spell Fragrance","Super Polymerization","Solemn Judgment"],"Kewl Tune":["Cosmic Cyclone","Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Cue","Kewl Tune Playlist"]},"turns":[{"title":"Turn 1 — Branded","lp":"Branded 8000 — Kewl Tune 8000","actions":["Aluber adds The Fallen & The Virtuous.","Branded Fusion produces Lubellion and then Mirrorjade the Iceblade Dragon.","Branded Sets Anti-Spell Fragrance, Super Polymerization, Solemn Judgment, and The Fallen & The Virtuous."],"audit":"Branded presents one monster interruption and three different back-row functions: Spell lock, mass-negation protection, and non-targeting Fusion removal.","endBoard":"Branded: Mirrorjade, Aluber, Anti-Spell, Super Polymerization, Judgment, The Fallen & The Virtuous."},{"title":"Turn 2 — Kewl Tune","lp":"Branded 4000 — Kewl Tune 8000","actions":["During the Draw Phase, Cosmic Cyclone targets Anti-Spell Fragrance.","Solemn Judgment negates Cosmic Cyclone and halves Branded's LP.","Anti-Spell Fragrance now forces Kewl Tune Playlist and the remaining Spells to be Set for a full turn.","Rotary reveals itself with Mix and Normal Summons Mix through its monster effect.","Cue is Normal Summoned and Special Summons Clip.","Mirrorjade banishes Mix before it can become material.","The remaining bodies Synchro Summon Kewl Tune Track Maker.","Super Polymerization uses Aluber and the compatible DARK Kewl Tune body to Fusion Summon Mudragon of the Swamp.","The Fallen & The Virtuous removes Track Maker, leaving Kewl Tune without a live Synchro or Spell activation."],"audit":"Judgment is spent only on Cosmic Cyclone, because preserving Anti-Spell turns every Spell in Kewl Tune's hand into a one-turn delay. Mirrorjade and Super Polymerization then remove the monster-only pivot.","endBoard":"Branded retains Mirrorjade and Mudragon; Kewl Tune has no monsters."},{"title":"Turn 3 — Branded","lp":"Branded 4000 — Kewl Tune 0","actions":["Branded Retribution recovers Branded Fusion.","Branded Fusion creates Albion the Branded Dragon and an additional attacker.","Mirrorjade, Mudragon, and Albion attack for lethal."],"audit":"Branded develops the extra attacker before combat so Kewl Tune cannot survive by setting a single defensive Tuner.","endBoard":"Branded wins Game 2."}],"decidingFactor":"Solemn Judgment protects Anti-Spell Fragrance from Cosmic Cyclone, forcing Kewl Tune into a monster-only line that Mirrorjade and Super Polymerization dismantle."},{"title":"Game 3","winner":"Kewl Tune","firstPlayer":"Branded","sideDeck":{"Kewl Tune":"Chooses to play second and adds Evenly Matched while retaining Cosmic Cyclone.","Branded":"Keeps Anti-Spell Fragrance, Super Polymerization, and The Fallen & The Virtuous."},"openingHands":{"Branded":["Phara the Primordial Goddess","Branded Fusion","Aluber the Jester of Despia","Anti-Spell Fragrance","Super Polymerization"],"Kewl Tune":["Cosmic Cyclone","Evenly Matched","Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Cue"]},"turns":[{"title":"Turn 1 — Branded","lp":"Branded 8000 — Kewl Tune 8000","actions":["Phara reveals itself with Branded Fusion.","Aluber adds The Fallen & The Virtuous.","Branded Fusion produces Lubellion and then Mirrorjade.","Branded Sets Anti-Spell Fragrance, Super Polymerization, and The Fallen & The Virtuous."],"audit":"Branded keeps the field compact to minimize Evenly Matched while retaining three different reactive cards.","endBoard":"Branded: Mirrorjade, Aluber, Anti-Spell, Super Polymerization, The Fallen & The Virtuous."},{"title":"Turn 2 — Kewl Tune","lp":"Branded 8000 — Kewl Tune 8000","actions":["During the Draw Phase, Cosmic Cyclone targets Anti-Spell Fragrance.","Branded chains Anti-Spell Fragrance, but Cosmic Cyclone banishes it before the Continuous restriction can apply after the Chain resolves.","Kewl Tune enters the Battle Phase and activates Evenly Matched.","Branded keeps Mirrorjade and banishes Aluber, Super Polymerization, and The Fallen & The Virtuous face-down.","In Main Phase 2, Rotary immediately Normal Summons Mix. Mix adds Reco.","Cue is Normal Summoned and Special Summons Clip.","Mirrorjade banishes Kewl Tune Track Maker after it is Synchro Summoned.","Kewl Tune Remix converts the remaining Tuners into Kewl Tune B2B despite the lost Track Maker.","Kewl Tune ends with B2B, Reco in the GY, and no need to attack into Mirrorjade that turn."],"audit":"Kewl Tune deliberately chooses second. Cosmic Cyclone removes the Spell lock, Evenly strips the unchainable Super Polymerization, and the engine is committed only after those two cards resolve.","endBoard":"Kewl Tune: B2B with Reco available. Branded: Mirrorjade only."},{"title":"Turn 3 — Branded","lp":"Branded 8000 — Kewl Tune 8000","actions":["Mirrorjade sends an Albaz Fusion and activates its banish effect targeting B2B.","B2B responds, Special Summons Reco, and Synchro Summons Baronne de Fleur.","Baronne negates Mirrorjade's banish effect and destroys Mirrorjade.","Branded Retribution recovers Branded Fusion from the GY, but Baronne negates the recovered Fusion Spell on activation.","Branded passes with no monsters."],"audit":"B2B is held specifically for Mirrorjade's monster activation. That activation becomes Baronne, which then protects the board from the recovered Branded Fusion.","endBoard":"Kewl Tune retains B2B and Baronne; Branded has no field."},{"title":"Turn 4 — Kewl Tune","lp":"Branded 0 — Kewl Tune 8000","actions":["Baronne destroys Branded's final Set card.","Kewl Tune Synchro produces Loudness War from the remaining Tuners.","B2B, Baronne, Loudness War, and the Tuners attack for lethal."],"audit":"With Super Polymerization already banished face-down, Kewl Tune can safely commit multiple Synchro attackers.","endBoard":"Kewl Tune wins Game 3, the match 2–1, and the tournament 7–0."}],"decidingFactor":"Kewl Tune chooses to go second, removes Anti-Spell before it applies, uses Evenly Matched to banish Super Polymerization, and converts Mirrorjade's first effect into Baronne through B2B."}],"analysis":["Kewl Tune wins 2–1 and completes an undefeated 7–0 championship run.","The deck never wastes a negate on Phara-protected Branded Fusion; it interacts with Lubellion, Mirrorjade, and the recovery Spell instead.","Branded's Game 2 win shows that Anti-Spell plus Judgment is a legitimate lock, but the lock is vulnerable when Kewl Tune chooses second and opens Cosmic Cyclone.","B2B is the decisive card of the match because every essential Branded monster activation can be converted into a new Synchro Summon."]},{"id":"r7-m3-toon-dark-magician","round":"Round 7","title":"Toon vs. Dark Magician","players":["Toon","Dark Magician"],"score":"Toon 2–1","status":"complete","detailLevel":"full","context":["Toon enters at 2–4; Dark Magician enters at 0–6.","Dimension Shifter is especially damaging to Dark Magician because Magicians' Souls, Soul Servant, and several Fusion lines expect cards to reach the GY.","Dark Magician sides Secret Village of the Spellcasters, Solemn Judgment, and Harpie's Feather Duster. Toon sides Cosmic Cyclone, Mind Scan, and Book of Eclipse."],"games":[{"title":"Game 1","winner":"Toon","firstPlayer":"Toon","openingHands":{"Toon":["Dimension Shifter","Maliss in Underground","Funny Dark Rabbit","Evil Box","Toon Terror"],"Dark Magician":["Magician's Rod","Magicians' Souls","Dark Magical Circle","Dark Magical Curtain","The Gaze of Timaeus"]},"turns":[{"title":"Turn 1 — Toon","lp":"Toon 7400 — Dark Magician 8000","actions":["Dimension Shifter is activated before the Toon engine commits cards.","Maliss in Underground banishes Maliss P Dormouse. Dormouse and Maliss P White Rabbit return for 600 LP total.","White Rabbit Sets Maliss C MTP-07.","Funny Dark Rabbit establishes Toon World the Perfect World.","Evil Box Special Summons itself and Sets Toon Terror.","The Maliss bodies Link Summon Maliss Q Hearts Crypter."],"audit":"Dimension Shifter is used first so Dark Magician cannot place Souls, Soul Servant, or the Fusion materials into a usable GY.","endBoard":"Toon: Hearts Crypter, Evil Box, Perfect World, MTP-07, Toon Terror."},{"title":"Turn 2 — Dark Magician","lp":"Toon 7400 — Dark Magician 8000","actions":["Dark Magical Circle is activated.","Toon Terror negates Circle and destroys it.","Magician's Rod is Normal Summoned and adds Soul Servant.","Magicians' Souls sends Dark Magician, but Dimension Shifter banishes it instead of placing it in the GY.","Dark Magical Curtain attempts to Special Summon a second Dark Magician from the Deck.","Hearts Crypter shuffles a banished Maliss card into the Deck and banishes Magician's Rod, removing the only face-up Spellcaster body.","The Gaze of Timaeus has no legal Dark Magician in the GY to recycle and remains dead in hand.","Dark Magician ends with one monster and no active Circle."],"audit":"Toon Terror is spent on Circle because it would convert every later Dark Magician summon into banishment. Hearts is reserved for Rod, which keeps the search and Secret Village lines active.","endBoard":"Toon retains Hearts and Perfect World; Dark Magician has one isolated monster."},{"title":"Turn 3 — Toon","lp":"Toon 6500 — Dark Magician 0","actions":["MTP-07 adds Maliss P March Hare and banishes Hearts Crypter.","Hearts pays 900 LP, Special Summons itself, and doubles to 5000 ATK.","Perfect World searches Comic Cat.","Comic Cat removes Dark Magician before combat.","Hearts, Evil Box, and the Maliss attackers deal lethal damage."],"audit":"The 5000 ATK Hearts line ends the game before Dimension Shifter expires and the Dark Magician GY engine can restart.","endBoard":"Toon wins Game 1."}],"decidingFactor":"Dimension Shifter banishes Dark Magician and Soul Servant resources, while Toon Terror removes Circle before any summon can trigger it."},{"title":"Game 2","winner":"Dark Magician","firstPlayer":"Dark Magician","sideDeck":{"Dark Magician":"Adds Secret Village of the Spellcasters, Solemn Judgment, and Harpie's Feather Duster; chooses to play first.","Toon":"Adds Cosmic Cyclone, Evenly Matched, and Book of Eclipse."},"openingHands":{"Dark Magician":["Magicians' Souls","Magician's Rod","Dark Magical Circle","Secret Village of the Spellcasters","Solemn Judgment"],"Toon":["Cosmic Cyclone","Evenly Matched","Maliss in Underground","Funny Dark Rabbit","Book of Eclipse"]},"turns":[{"title":"Turn 1 — Dark Magician","lp":"Dark Magician 8000 — Toon 8000","actions":["Magicians' Souls sends Dark Magician to the GY and Special Summons itself.","Dark Magical Circle is activated.","Magician's Rod is Normal Summoned and adds The Gaze of Timaeus.","The Gaze of Timaeus Fusion Summons Red-Eyes Dark Dragoon.","Secret Village of the Spellcasters is activated while Rod remains face-up.","Dark Magician Sets Solemn Judgment."],"audit":"Rod remains on the field so Secret Village stays active even if Dragoon is temporarily removed or negated.","endBoard":"Dark Magician: Dragoon, Rod, Circle, Secret Village, Judgment."},{"title":"Turn 2 — Toon","lp":"Dark Magician 4000 — Toon 8000","actions":["Toon activates Cosmic Cyclone targeting Secret Village.","Solemn Judgment negates Cosmic Cyclone and halves Dark Magician's LP.","Secret Village now prevents Evenly Matched and Book of Eclipse from being activated.","Funny Dark Rabbit is Normal Summoned and places Toon World the Perfect World directly from the Deck.","Maliss in Underground cannot be activated from the hand under Secret Village.","Perfect World searches Evil Box through its face-up effect, but Dragoon negates Evil Box's attempt to establish Toon Terror and destroys it.","Dark Magical Circle banishes Funny when Dark Magician is revived through Soul Servant.","Toon passes without a Link Monster."],"audit":"Judgment is assigned to Cosmic Cyclone because preserving Secret Village locks three different Spells in Toon's hand. Dragoon then handles the lone monster-based extender.","endBoard":"Dark Magician retains Dragoon, Rod, Circle, and Secret Village."},{"title":"Turn 3 — Dark Magician","lp":"Dark Magician 4000 — Toon 0","actions":["Dragoon destroys Toon's remaining card and gains ATK.","Dark Magician and Rod join Dragoon in combat.","Dark Magician reaches lethal damage."],"audit":"The final card is removed before combat so no Maliss monster can be banished and revived during the Battle Phase.","endBoard":"Dark Magician wins Game 2."}],"decidingFactor":"Solemn Judgment protects Secret Village from Cosmic Cyclone, locking Toon's board breakers while Dragoon handles the monster-only route."},{"title":"Game 3","winner":"Toon","firstPlayer":"Toon","sideDeck":{"Toon":"Chooses to play first and adds Mind Scan plus a second Toon Terror.","Dark Magician":"Adds Harpie's Feather Duster, Santa Claws, and keeps Secret Village."},"openingHands":{"Toon":["Funny Dark Rabbit","Maliss in Underground","Evil Box","Mind Scan","Toon Terror"],"Dark Magician":["Harpie's Feather Duster","Santa Claws","Magician's Rod","Secret Village of the Spellcasters","The Gaze of Timaeus"]},"turns":[{"title":"Turn 1 — Toon","lp":"Toon 7400 — Dark Magician 8000","actions":["Funny Dark Rabbit establishes Toon World the Perfect World and places Mind Scan.","Maliss in Underground deploys Dormouse and White Rabbit for 600 LP total; White Rabbit Sets MTP-07.","Evil Box Special Summons itself and Sets Toon Terror.","The three Maliss monsters Link Summon Maliss Q Hearts Crypter.","Mind Scan reveals Harpie's Feather Duster, Santa Claws, Rod, Secret Village, and The Gaze of Timaeus."],"audit":"The visible hand establishes the exact defensive order: Toon Terror for Duster, Hearts for Rod, and Perfect World to protect the Link Monster from Santa Claws-style removal where applicable.","endBoard":"Toon: Hearts Crypter, Evil Box, Perfect World, Mind Scan, MTP-07, Toon Terror."},{"title":"Turn 2 — Dark Magician","lp":"Toon 7400 — Dark Magician 8000","actions":["Dark Magician activates Harpie's Feather Duster.","Toon Terror negates Duster and destroys it.","Santa Claws is Special Summoned to Toon's field by Tributing Hearts Crypter.","Hearts is Tributed rather than destroyed, but MTP-07 remains available as the recovery bridge.","Magician's Rod is Normal Summoned and activates.","Mind Scan's declared Rod effect is applied, negating the search for the turn.","Secret Village is activated while Rod is face-up.","MTP-07 banishes Santa Claws, adds March Hare, and banishes a Maliss card to set up Hearts' return.","Hearts pays 900 LP, Special Summons itself, and doubles to 5000 ATK.","Hearts shuffles the banished Maliss card into the Deck and banishes Magician's Rod, turning off Secret Village before The Gaze of Timaeus can be supported by a face-up Spellcaster."],"audit":"Toon does not try to prevent Santa Claws. It preserves MTP-07 to convert the donated monster into Hearts' banish-and-return condition, then removes Rod to shut off Secret Village.","endBoard":"Toon controls a 5000 ATK Hearts and Perfect World; Dark Magician has no monster."},{"title":"Turn 3 — Toon","lp":"Toon 6500 — Dark Magician 0","actions":["Perfect World searches Comic Cat.","Comic Cat removes Dark Magician's final Set monster.","Hearts Crypter, Evil Box, and March Hare attack for lethal."],"audit":"With Rod banished and Secret Village inactive, no additional Link climb is necessary.","endBoard":"Toon wins Game 3 and the match 2–1."}],"decidingFactor":"Mind Scan reveals the full anti-Toon side plan. Toon allows Santa Claws to Tribute Hearts, then uses MTP-07 to rebuild Hearts at 5000 ATK and banish Rod, disabling Secret Village."}],"analysis":["Toon wins 2–1 and finishes 3–4.","Dark Magician's Secret Village plan is strong enough to take a game when Judgment protects it.","Toon wins both of its games by denying the GY and Circle engines rather than attempting to negate every individual summon.","The deciding game turns Santa Claws into a liability: MTP-07 removes the donated monster and converts it into Hearts Crypter's 5000 ATK recursion line."]},{"id":"r7-m4-sky-striker-elfnote","round":"Round 7","title":"Sky Striker vs. Elfnote","players":["Sky Striker","Elfnote"],"score":"Sky Striker 2–1","status":"complete","detailLevel":"full","context":["Sky Striker enters at 4–2; Elfnote enters at 2–4.","Elfnote's strongest board separates its defenses across Welcome Home, Aristeia, and Rhapsodia. Sky Striker's plan is to force Aristeia with one Spell, then resolve Evenly Matched or Widow Anchor as the second layer.","Sky Striker sides Evenly Matched, Cosmic Cyclone, and Shark Cannon. Elfnote sides Solemn Judgment, Dimensional Barrier, and additional Aristeia copies."],"games":[{"title":"Game 1","winner":"Elfnote","firstPlayer":"El
