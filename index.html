<script>
const DB={"version":"3.4.0","updated":"2026-07-17","tournament":"SOL July 2026 OCG Tournament","standings":[{"deck":"Kewl Tune","matches":"3–0","games":"6–3"},{"deck":"Power Patron","matches":"2–1","games":"5–3"},{"deck":"Toon","matches":"2–1","games":"5–4"},{"deck":"Branded","matches":"2–1","games":"5–4"},{"deck":"Elfnote","matches":"1–2","games":"4–5"},{"deck":"Toon Turbo","matches":"1–2","games":"4–5"},{"deck":"Sky Striker","matches":"1–2","games":"3–5"},{"deck":"Dark Magician","matches":"0–3","games":"3–6"}],"matches":[{"id":"r1-m1-power-patron-sky-striker","round":"Round 1","title":"Power Patron vs. Sky Striker","players":["Power Patron","Sky Striker"],"score":"Power Patron 2–0","status":"complete","detailLevel":"condensed-archive","context":["This match is preserved as a detailed tactical archive, but the exact original line-by-line transcript was not available during the final viewer migration."],"games":[{"title":"Game 1","winner":"Power Patron","firstPlayer":"Power Patron","turns":[{"title":"Opening development","actions":["Power Patron opens through Artmage Vandalism -Assault-, Medius the Pure, and Plundered Power Patron Plane – Vidolia.","Ash Blossom stops Medius, but Vidolia still reaches Nervedo the Shadebeast Power Patron.","The board develops into Artmage Non-Finito, Jupiter the Power Patron of Destruction, and Diactorus the DoomZ Raider with interaction behind them."],"audit":"Multiple distinct Extra Deck bodies are kept instead of compressing into one threat.","endBoard":"Power Patron establishes layered interaction."},{"title":"Sky Striker counterattack","actions":["Sky Striker uses Engage!, Widow Anchor, Hayate, and Zeke.","Zeke temporarily banishes Non-Finito and the borrowed Diactorus becomes Link Material."],"audit":"Sky Striker correctly uses its Link toolbox to turn stolen monsters into permanent resource conversion.","endBoard":"Sky Striker dismantles most of the opening field."},{"title":"Power Patron rebuild","actions":["Power Patron rebuilds into Varudras, the Final Bringer of the End Times.","Junora the Power Patron of Tuning later shuts off Shizuku before lethal."],"audit":"The rebuild prioritizes a fresh interruption and denies Sky Striker’s end-phase recovery.","endBoard":"Power Patron wins Game 1."}],"decidingFactor":"Power Patron’s second wave outlasts Sky Striker’s first board-breaking sequence."},{"title":"Game 2","winner":"Power Patron","firstPlayer":"Sky Striker","turns":[{"title":"Sky Striker setup","actions":["Sky Striker opens Sky Striker Ace – Zero, Radiant Typhoon Vision, Widow Anchor, and Solemn Judgment."],"audit":"The setup balances interruption with Link follow-up.","endBoard":"Sky Striker establishes a protected control board."},{"title":"Power Patron forces the board","actions":["Harpie’s Feather Duster forces Solemn Judgment.","Vidolia, Medius, Jupredo, Jupiter, and Diactorus dismantle the remaining field."],"audit":"Power Patron leads with the card most likely to force the hard negate before committing engine pieces.","endBoard":"Power Patron takes control."},{"title":"Sky Striker extended Link sequence","actions":["Sky Striker performs Zero → S:P Little Knight → Camellia → Kagari → Hayate → Shizuku.","Power Patron is reduced to 3200 LP."],"audit":"The sequence maximizes graveyard access and Linkage pressure.","endBoard":"Sky Striker nearly stabilizes."},{"title":"Final exchange","actions":["Power Patron rebuilds into Varudras and Jupiter.","Lemnisgate clears both, but Nerva the Power Patron of Creation converts an Artmage trigger into the final field wipe."],"audit":"Nerva is held for the point where Sky Striker has exhausted its Link ladder.","endBoard":"Power Patron wins Game 2 and the match."}],"decidingFactor":"Power Patron survives Sky Striker’s longest resource loop and produces one final board wipe."}],"analysis":["Power Patron won by presenting repeated waves of Extra Deck threats rather than relying on one board.","Sky Striker’s Link toolbox was used aggressively and meaningfully in both games."]},{"id":"r1-m2-toon-turbo-dark-magician","round":"Round 1","title":"Toon Turbo vs. Dark Magician","players":["Toon Turbo","Dark Magician"],"score":"Toon Turbo 2–1","status":"complete","detailLevel":"condensed-archive","context":["This match is preserved as a detailed tactical archive. The exact original action-by-action transcript was not available during migration."],"games":[{"title":"Game 1","winner":"Toon Turbo","firstPlayer":"Toon Turbo","turns":[{"title":"Toon setup","actions":["Funny Dark Rabbit establishes Toon World the Perfect World and Comic Cat.","Toon Dark Magician and Evil Box extend the field and set Toon Terror."],"audit":"The Extra Deck is preserved until the disruption has traded.","endBoard":"Toon Turbo establishes engine, information, and a negate."},{"title":"Dark Magician push","actions":["Mind Scan preemptively suppresses Magician’s Rod.","Toon Terror and Dominus Impulse stop the follow-up involving Magicians’ Souls, Soul Servant, and Timaeus."],"audit":"Toon prioritizes the cards that bridge Dark Magician’s Normal Summon into its Extra Deck.","endBoard":"Dark Magician’s turn is contained."},{"title":"Toon conversion","actions":["Toon Turbo converts its remaining bodies into Dark Magician of Destruction, Red-Eyes Dark Dragoon, I:P Masquerena, and S:P Little Knight.","The layered board closes the game."],"audit":"The Extra Deck is used after the opponent’s interaction is exhausted.","endBoard":"Toon Turbo wins Game 1."}],"decidingFactor":"Mind Scan and the Toon traps stop the Dark Magician engine before Toon converts into Fusion and Link threats."},{"title":"Game 2","winner":"Dark Magician","firstPlayer":"Dark Magician","turns":[{"title":"Dark Magician setup","actions":["Dark Magical Circle, Magician’s Rod, Magicians’ Souls, and Timaeus establish two Level 7 bodies and Dark Magician of Destruction."],"audit":"The deck identifies a higher-ceiling Rank 7 route rather than stopping at a conventional Dragoon board.","endBoard":"Two Level 7 monsters plus back-row support."},{"title":"Galaxy Tomahawk line","actions":["Number 42: Galaxy Tomahawk creates enough material for I:P Masquerena and S:P Little Knight.","The line later pivots into Red-Eyes Dark Dragoon and Chaos Angel."],"audit":"Dark Magician fully uses its Extra Deck instead of treating the archetype as only a Circle/Eternal Soul deck.","endBoard":"Dark Magician establishes multiple layers of disruption."},{"title":"Closing turns","actions":["Toon Turbo attempts a defensive I:P line but cannot break through Dragoon and Chaos Angel.","Dark Magician wins Game 2."],"audit":"No unnecessary further commitment is made once lethal is protected.","endBoard":"Match tied 1–1."}],"decidingFactor":"The Galaxy Tomahawk Link line produces more interaction than Toon Turbo can answer."},{"title":"Game 3","winner":"Toon Turbo","firstPlayer":"Toon Turbo","turns":[{"title":"Maximum Toon board","actions":["Toon Turbo reaches Blue-Eyes Toon Ultimate Dragon, Dark Magician of Destruction, I:P Masquerena, Mind Scan, Toon Terror, Dominus Impulse, and Solemn Judgment."],"audit":"The deck uses both Fusion and Link routes while retaining layered back-row interaction.","endBoard":"Toon Turbo establishes its strongest board of the match."},{"title":"Dark Magician counterplay","actions":["Santa Claws removes Blue-Eyes Toon Ultimate Dragon.","Harpie’s Feather Duster and the Dark Magician engine attempt to dismantle the remaining field, but the layered responses hold."],"audit":"Toon correctly protects its engine rather than overprotecting the already-replaced Fusion monster.","endBoard":"Dark Magician’s comeback is stopped."},{"title":"Lethal rebuild","actions":["Comic Cat, Evil Box, S:P Little Knight, and W:P Fancy Ball rebuild the field.","Toon Turbo attacks for lethal."],"audit":"The Extra Deck follow-up is used only after the board breakers have resolved.","endBoard":"Toon Turbo wins the match 2–1."}],"decidingFactor":"Toon Turbo’s layered Game 3 board survives Santa Claws and Feather Duster, then rebuilds through its Link toolbox."}],"analysis":["The corrected simulation treats Toon Turbo as a Fusion/Link deck rather than a Main-Deck-only Toon strategy.","Dark Magician’s best game came from recognizing the Galaxy Tomahawk route."]},{"id":"r1-m4-elfnote-kewl-tune","round":"Round 1","title":"Elfnote vs. Kewl Tune","players":["Elfnote","Kewl Tune"],"score":"Kewl Tune 2–1","status":"complete","detailLevel":"full","context":["Elfnote controls the center Main Monster Zone. Its Level 6 monsters Special Summon themselves there and rotate positions during the opponent’s turn to create interaction.","Kewl Tune is built almost entirely from Tuners. Its Main Deck monsters can use Tuners from the hand as Synchro Material, allowing rapid climbing while preserving field space."],"games":[{"title":"Game 1","winner":"Kewl Tune","firstPlayer":"Kewl Tune","openingHands":{"Kewl Tune":["Kewl Tune Cue","Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Synchro","Ghost Belle & Haunted Mansion"],"Elfnote":["Elfnote Lucina","Elfnote Fortuna","Elfnote Power Patron","Infinite Impermanence","Ash Blossom & Joyous Spring"]},"turns":[{"title":"Turn 1 — Kewl Tune","lp":"Kewl Tune 8000 — Elfnote 8000","actions":["Kewl Tune reveals Kewl Tune Rotary and Kewl Tune Mix in hand.","Rotary’s hand effect grants an additional Normal Summon of a Tuner.","Kewl Tune Normal Summons Mix. Mix activates to add a non-Level-2 Kewl Tune monster.","Elfnote responds with Ash Blossom & Joyous Spring. Chain Link 1: Mix; Chain Link 2: Ash Blossom. Mix is negated.","Kewl Tune uses its regular Normal Summon on Kewl Tune Cue. Cue Special Summons Rotary from the hand.","Cue and Rotary Synchro Summon Kewl Tune Track Maker.","Track Maker, Cue, and Rotary trigger. Rotary looks at Elfnote’s hand and adds Kewl Tune Synchro; Cue excavates and manipulates the top two cards of Elfnote’s Deck; Track Maker adds JJ “Kewl Tune”.","JJ “Kewl Tune” is activated. Track Maker uses Mix from the hand as Synchro Material to summon Kewl Tune Loudness War.","Kewl Tune Synchro adds Kewl Tune Reco, then the line produces Kewl Tune RS.","Kewl Tune sets its remaining interaction."],"audit":"Kewl Tune declines an immediate climb into Kewl Tune B2B. Loudness War, RS, and a set Quick-Play Spell provide more separate interactions than one larger boss.","endBoard":"Kewl Tune: Loudness War, RS, JJ “Kewl Tune”, two set cards. Elfnote: empty field, four cards in hand."},{"title":"Turn 2 — Elfnote","lp":"Kewl Tune 8000 — Elfnote 8000","actions":["Elfnote Special Summons Elfnote Lucina to the center Main Monster Zone.","Lucina activates to search. Loudness War banishes Cue from the GY and copies Cue’s material effect, manipulating Elfnote’s next cards without negating Lucina.","Lucina resolves and adds Elfnote Regina.","Elfnote activates Elfnotes: Welcome Home. RS banishes Rotary and negates Welcome Home for the turn.","Elfnote Normal Summons Elfnote Power Patron and raises Lucina from Level 6 to Level 9.","Power Patron and Lucina Synchro Summon Elfnote June Pride. Power Patron’s GY effect adds Elfnotes: Rhapsodia of Madness.","June Pride returns itself to the Extra Deck and deploys Fortuna from hand, Tinia from Deck, and Lucina from GY.","Fortuna places Rhapsodia; Tinia places Welcome Home; Lucina searches.","Kewl Tune activates the set Kewl Tune Synchro, searches Kewl Tune Clip, and Synchro Summons Kewl Tune Crackle.","Crackle examines Elfnote’s Extra Deck, temporarily banishes Baronne de Fleur, and gains its ATK for the turn.","Elfnote sets Infinite Impermanence and Rhapsodia."],"audit":"Returning June Pride to the Extra Deck is superior to leaving a single 3100 ATK body. Elfnote converts it into three distinct opponent-turn interactions plus continuous-card setup.","endBoard":"Elfnote: Tinia in the center, Lucina, Fortuna, Welcome Home, Rhapsodia, two set cards. Kewl Tune: Loudness War, RS, Crackle, JJ “Kewl Tune”, one set card."},{"title":"Turn 3 — Kewl Tune","lp":"Kewl Tune 8000 — Elfnote 5400","actions":["Tinia rotates with Fortuna and temporarily banishes Kewl Tune Reco from the hand.","Fortuna rotates with Lucina and returns JJ “Kewl Tune” to the hand.","Loudness War copies Mix’s material effect and targets Lucina for destruction.","Elfnote chains Rhapsodia, sending Regina to the GY to revive Lucina. Ghost Belle & Haunted Mansion negates Rhapsodia; Lucina remains in the GY.","JJ “Kewl Tune” Tributes RS and Special Summons Cue from the Deck.","Cue and Crackle produce Kewl Tune B2B. Crackle revives itself and temporarily banishes June Pride and Crystal Wing Synchro Dragon from Elfnote’s Extra Deck.","B2B raises the Levels of Elfnote’s monsters by 2, disrupting their preferred Synchro math.","Reco returns and is Normal Summoned, recovering Mix.","B2B destroys Fortuna in battle, attacks again, and destroys Tinia. Crackle attacks directly."],"audit":"B2B is introduced only after Elfnote has spent several interactions. It is functioning as a second-stage boss rather than the opening end board.","endBoard":"Kewl Tune: B2B, Crackle, Reco, JJ “Kewl Tune”. Elfnote: Welcome Home, two Rhapsodia cards, Infinite Impermanence, no monsters."},{"title":"Turn 4 — Elfnote","lp":"Kewl Tune 7500 — Elfnote 5400","actions":["Elfnote Normal Summons Medius the Pure. B2B revives Cue and immediately converts Cue plus Crackle into Baronne de Fleur.","Medius resolves and Special Summons Junoldo the Shadespirit Power Patron from the Deck.","Welcome Home sends Medius to the GY and summons Elfnote Regina into the center zone.","Regina attempts to Special Summon Lucina. Baronne negates Regina and destroys it.","Rhapsodia sends Junoldo to the GY and revives Regina.","Infinite Impermanence negates B2B for the turn.","Regina destroys Reco in battle, but Reco’s material effect does not trigger because it was not used as Synchro Material."],"audit":"Elfnote successfully trades through Baronne’s negate, but cannot turn the revived Regina into an Extra Deck threat because the required Tuner was spent as Rhapsodia’s cost.","endBoard":"Elfnote: Regina and continuous back row. Kewl Tune: B2B, Baronne, JJ “Kewl Tune”, Mix in hand."},{"title":"Turn 5 — Kewl Tune","lp":"Kewl Tune 7500 — Elfnote 0","actions":["Baronne destroys Welcome Home.","Kewl Tune Synchro adds Rotary and immediately produces Track Maker using Rotary and Mix.","Mix destroys Regina; Rhapsodia attempts to revive it.","B2B revives Reco and converts Reco plus Track Maker into Loudness War.","Track Maker returns one Rhapsodia to hand; Reco destroys the other.","B2B attacks directly twice for lethal."],"audit":"Kewl Tune sequences removal before the Battle Phase, eliminating both recursion cards so B2B’s double attack cannot be interrupted.","endBoard":"Game over."}],"decidingFactor":"Loudness War and B2B converted Elfnote’s repeated effect activations into additional value and Synchro Summons."},{"title":"Game 2","winner":"Elfnote","firstPlayer":"Elfnote","sideDeck":{"Elfnote":"Adds Droll & Lock Bird, PSY-Framegear Gamma, PSY-Frame Driver, and more back-row disruption.","Kewl Tune":"Adds more Spell/Trap removal, Ghost Ogre & Snow Rabbit, and going-second hand traps."},"openingHands":{"Elfnote":["Elfnote Tinia","Elfnote Regina","Elfnote Power Patron","Elfnotes: Welcome Home","Droll & Lock Bird"],"Kewl Tune":["Kewl Tune Mix","Kewl Tune Rotary","Kewl Tune Synchro","Ghost Ogre & Snow Rabbit","Fydraulis Harmonia"]},"turns":[{"title":"Turn 1 — Elfnote","lp":"Elfnote 8000 — Kewl Tune 8000","actions":["Elfnote Special Summons Tinia to the center and places Welcome Home.","Ghost Ogre destroys Tinia after activation, so Welcome Home remains placed.","Welcome Home sends Regina to the GY and summons Lucina. Lucina searches Fortuna.","Fydraulis Harmonia Special Summons itself in response to Lucina’s monster effect, sends a revealed Synchro Monster to the GY, and destroys Lucina.","Elfnote Normal Summons Power Patron, then Special Summons Fortuna to the center. Fortuna places Rhapsodia.","Elfnote sets Rhapsodia and ends."],"audit":"Elfnote preserves Fortuna and Power Patron instead of forcing a compromised Synchro line after Harmonia removes Lucina.","endBoard":"Elfnote: Fortuna, Power Patron, Welcome Home, set Rhapsodia. Kewl Tune: Harmonia."},{"title":"Turn 2 — Kewl Tune","lp":"Elfnote 8000 — Kewl Tune 8000","actions":["Rotary grants an extra Normal Summon. Mix searches Kewl Tune Clip.","Elfnote activates Droll & Lock Bird, preventing further additions from Deck to hand.","Cue Special Summons Rotary. Power Patron raises Fortuna and immediately Synchro Summons June Pride.","Droll prevents Power Patron’s GY search.","June Pride returns to the Extra Deck and deploys Tinia, Lucina, and Regina.","Tinia can still place a Continuous Spell and Regina can still Special Summon, because those actions do not add cards to the hand.","Cue and Rotary make Track Maker, but Droll suppresses Track Maker’s search.","Track Maker and Clip produce Loudness War. Clip permanently banishes a random Extra Deck card; Track Maker returns set Rhapsodia to hand.","Harmonia attacks Lucina; both are destroyed."],"audit":"Droll does not stop Synchro Summoning, but strips the searches that normally make Kewl Tune’s climbing profitable.","endBoard":"Elfnote: Tinia, Regina, Fortuna, two Welcome Home cards. Kewl Tune: Loudness War and Mix."},{"title":"Turn 3 — Elfnote","lp":"Elfnote 8000 — Kewl Tune 500","actions":["Tinia and Fortuna place additional Elfnote continuous cards.","Regina sends Rhapsodia to the GY and summons Lucina.","Welcome Home converts Fortuna into Power Patron.","Power Patron raises Tinia and Synchro Summons June Pride.","June Pride destroys Mix; Regina and Lucina attack directly.","Kewl Tune survives at 500 LP because June Pride’s center-zone attack restriction limits the remaining attacks."],"audit":"Elfnote correctly leaves June Pride in the center this time. Its attack restriction protects the board while presenting near-lethal damage.","endBoard":"Elfnote: June Pride, Regina, Lucina, multiple continuous cards, set Infinite Impermanence. Kewl Tune: Loudness War."},{"title":"Turn 4 — Kewl Tune","lp":"Elfnote 8000 — Kewl Tune 500","actions":["Kewl Tune Synchro adds Reco.","Infinite Impermanence negates Loudness War.","Reco is Normal Summoned and recovers Mix.","June Pride returns itself to the Extra Deck and redeploys three Elfnote monsters.","Lucina rotates into the center and returns Reco to the hand.","Kewl Tune concedes against overwhelming damage."],"audit":"The defensive June Pride transformation removes Kewl Tune’s only new body while preserving lethal pressure.","endBoard":"Game over."}],"decidingFactor":"Droll suppressed Kewl Tune’s search economy, allowing June Pride to control both tempo and combat."},{"title":"Game 3","winner":"Kewl Tune","firstPlayer":"Kewl Tune","sideDeck":{"Kewl Tune":"Adds anti-hand-trap protection, Ghost Belle, back-row removal, and resilient extenders.","Elfnote":"Adds Ghost Ogre, Effect Veiler, Infinite Impermanence, and the PSY-Frame package."},"openingHands":{"Kewl Tune":["Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Reco","Kewl Tune Synchro","PSY-Framegear Gamma"],"Elfnote":["Elfnote Lucina","Elfnote Power Patron","Effect Veiler","Infinite Impermanence","Elfnotes: Welcome Home"]},"turns":[{"title":"Turn 1 — Kewl Tune","lp":"Kewl Tune 8000 — Elfnote 8000","actions":["Rotary grants an extra Normal Summon. Mix is Normal Summoned and targeted by Infinite Impermanence.","PSY-Framegear Gamma cannot respond because Kewl Tune already controls Mix.","Reco is Normal Summoned and adds Cue.","Mix and Rotary produce Track Maker. Track Maker searches Kewl Tune Synchro; Rotary inspects Elfnote’s hand and adds JJ “Kewl Tune”.","Track Maker and Cue from hand produce Loudness War.","Two Kewl Tune Synchro activations develop Crackle and RS."],"audit":"Kewl Tune again declines B2B, preferring Loudness War, Crackle, and RS as three distinct interactions.","endBoard":"Kewl Tune: Loudness War, Crackle, RS, JJ “Kewl Tune”, Gamma in hand."},{"title":"Turn 2 — Elfnote","lp":"Kewl Tune 8000 — Elfnote 8000","actions":["Lucina is Special Summoned to the center and activates.","Loudness War copies Mix and targets Lucina for destruction.","Welcome Home sends Lucina to the GY as cost and summons Tinia, causing the copied destruction to lose its target.","Lucina resolves and searches Fortuna; Tinia places another Welcome Home.","Power Patron targets Tinia, but RS negates Power Patron.","Regina is Special Summoned by sending Fortuna to the GY.","Welcome Home converts Regina into Fortuna, and Fortuna places Rhapsodia."],"audit":"Elfnote uses Welcome Home as a dodge, but RS prevents the turn’s key immediate Synchro Summon.","endBoard":"Elfnote: Tinia, Fortuna, Power Patron, two Welcome Home cards, set Rhapsodia. Kewl Tune retains all three Synchro interactions."},{"title":"Turn 3 — Kewl Tune","lp":"Kewl Tune 8000 — Elfnote 3500","actions":["Tinia rotates with Fortuna and temporarily banishes Gamma from Kewl Tune’s hand.","Fortuna rotates with Power Patron and returns JJ “Kewl Tune” to hand.","Loudness War copies Reco and destroys the set Rhapsodia.","JJ Tributes Crackle and summons Cue. Crackle revives itself and temporarily banishes June Pride and Baronne from Elfnote’s Extra Deck.","Cue and Crackle produce B2B. Clip permanently banishes another random Extra Deck card.","B2B raises Elfnote’s monster Levels, disrupting future Synchro arithmetic.","B2B attacks twice, destroying Power Patron and Tinia. RS destroys Fortuna."],"audit":"B2B enters after the first interaction layer has traded, then its Level modulation and double attack punish Elfnote’s exposed board.","endBoard":"Kewl Tune: B2B, Loudness War, RS, JJ “Kewl Tune”, Gamma in hand. Elfnote: two Welcome Home cards, no monsters."},{"title":"Turn 4 — Elfnote","lp":"Kewl Tune 8000 — Elfnote 3500","actions":["Welcome Home sends Regina to the GY and summons Lucina.","Gamma again cannot activate because Kewl Tune controls monsters.","Lucina activates. B2B revives Mix, then immediately Synchro Summons Baronne de Fleur using Mix and RS.","Mix’s material effect destroys Lucina; Lucina’s search still resolves.","The second Welcome Home is activated. Baronne negates and destroys it.","Elfnote has no remaining playable card."],"audit":"B2B converts the first monster activation into Baronne while Mix’s material trigger removes the starter. This is the matchup’s clearest example of Kewl Tune generating two interactions from one response window.","endBoard":"Kewl Tune: B2B, Loudness War, Baronne, JJ “Kewl Tune”."},{"title":"Turn 5 — Kewl Tune","lp":"Kewl Tune 8000 — Elfnote 0","actions":["Baronne destroys Elfnote’s final Welcome Home.","B2B attacks directly twice for lethal."],"audit":"No further Extra Deck commitment is necessary.","endBoard":"Game over."}],"decidingFactor":"Multiple separate Synchro interactions survived Elfnote’s opening push and converted into B2B plus Baronne."}],"analysis":["Elfnote’s strongest use of June Pride is often its transformation effect, not its 3100 ATK body.","Kewl Tune performs best when B2B is treated as a second-stage boss after Loudness War, RS, and Crackle have already traded.","The matchup is structurally favorable to Kewl Tune when it goes first because Elfnote’s sequential monster effects repeatedly open response windows."]},{"id":"r1-m3-toon-branded","round":"Round 1","title":"Toon vs. Branded","players":["Toon","Branded"],"score":"Toon 2–1","status":"complete","detailLevel":"full","context":["Audited replay under the July 1, 2026 OCG Forbidden & Limited List.","Toon is based on the 42-card first-place Super Card list from July 5, 2026. Branded is based on the 40-card first-place DDD Different Dimension Cards list from June 13, 2026.","This replay specifically audits the Toon deck's Maliss/Cyberse Link routes, Toon World the Perfect World's temporary-banish mechanic, and Branded's Fusion resource loop."],"games":[{"title":"Game 1","winner":"Toon","firstPlayer":"Toon","openingHands":{"Toon":["Maliss in Underground","Funny Dark Rabbit","Comic Cat","Evil Box","Infinite Impermanence"],"Branded":["Droll & Lock Bird","Branded Fusion","Super Polymerization","Aluber the Jester of Despia","The Fallen & The Virtuous"]},"turns":[{"title":"Turn 1 — Toon","lp":"Toon 7400 — Branded 8000","actions":["Toon activates Maliss in Underground and banishes Maliss P Dormouse from the Deck.","Dormouse activates while banished. Toon pays 300 LP and Special Summons it. Dormouse then banishes Maliss P White Rabbit from the Deck and gives the Maliss monsters a temporary 600 ATK increase.","White Rabbit activates while banished. Toon pays 300 LP, Special Summons it, and uses its on-summon effect to Set Maliss C MTP-07 directly from the Deck.","Toon Normal Summons Funny Dark Rabbit. Funny grants an additional Normal Summon of a monster that mentions Toon World and adds Toon World the Perfect World to the hand.","Branded activates Droll & Lock Bird after Perfect World is added. Toon can no longer add cards from the Main Deck to the hand for the rest of the turn.","Toon activates Toon World the Perfect World over Maliss in Underground, then uses Funny's additional Normal Summon for Comic Cat.","Evil Box Special Summons itself from the hand because Toon World is active, then Sets Toon Terror from the Deck.","Toon activates the newly Set Maliss C MTP-07. Dormouse is banished as the activation cost; MTP-07 adds Maliss P March Hare. Dormouse has already used its banished effect this turn, so it remains banished.","White Rabbit, Funny Dark Rabbit, and Evil Box are used as Link Material for Maliss Q Hearts Crypter. Hearts is placed so that it points to Comic Cat.","Toon Sets Infinite Impermanence and ends with Hearts Crypter, Comic Cat, Perfect World, Toon Terror, and Infinite Impermanence."],"audit":"The important deviation from a generic Toon board is using MTP-07 before the Link Summon. This deliberately leaves Dormouse banished, giving Hearts Crypter live interaction on Branded's turn. Hearts is chosen over S:P Little Knight or White Binder because it provides both non-targeting field banishment and a 5000 ATK recursion body if Mirrorjade removes it.","endBoard":"Toon: Hearts Crypter pointing to Comic Cat; Perfect World; Toon Terror; Infinite Impermanence; March Hare in hand; Dormouse banished. Branded: six-card hand after the first-turn draw."},{"title":"Turn 2 — Branded","lp":"Toon 6500 — Branded 8000","actions":["Branded draws for turn and Normal Summons Aluber the Jester of Despia.","Chain Link 1: Aluber attempts to search a Branded Spell/Trap. Chain Link 2: Toon activates Infinite Impermanence targeting Aluber. The Chain resolves backward; Aluber is negated and searches nothing.","Branded activates The Fallen & The Virtuous and chooses its removal mode, intending to send an Albaz-related Extra Deck monster to the GY and destroy Toon World the Perfect World.","Toon chains Toon Terror. Because Toon controls Toon World and Comic Cat is currently treated as a Toon monster, Toon Terror negates and destroys The Fallen & The Virtuous; because the activation is negated, no Extra Deck monster is sent by its effect.","Branded activates Branded Fusion, sending Fallen of Albaz and Tri-Brigade Mercourier from the Deck to Fusion Summon Albion the Branded Dragon.","Albion's Fusion effect banishes itself and Fallen of Albaz to Fusion Summon Mirrorjade the Iceblade Dragon.","Mirrorjade activates, sending an Albaz-related Fusion Monster from the Extra Deck to the GY as cost and banishing Hearts Crypter.","Hearts Crypter activates while banished. Toon pays 900 LP; Hearts returns to the field and its ATK doubles to 5000.","Branded Sets Super Polymerization. Hearts Crypter immediately activates, targeting the banished Dormouse for its shuffle cost and threatening to banish the Set card.","Branded chains Super Polymerization and discards the card drawn for turn. Before Super Polymerization resolves, Perfect World temporarily banishes Comic Cat.","With Comic Cat unavailable, Branded uses Hearts Crypter and its own Aluber as Fusion Material for Mudragon of the Swamp. Comic Cat then returns immediately after Super Polymerization resolves.","Hearts Crypter's already-activated effect resolves from the GY: Dormouse is shuffled into the Deck, then Mirrorjade is banished. Mirrorjade's leave-field effect schedules a wipe of Toon's monsters during the End Phase.","Branded ends with only Mudragon on the field; Toon retains Comic Cat and Perfect World. Hearts Crypter is now in Toon's GY."],"audit":"Branded correctly chains Super Polymerization rather than allowing Hearts to banish it. Toon answers through Perfect World's non-Chain temporary banish, preserving Comic Cat. Hearts still resolves after becoming Fusion Material and removes Mirrorjade. This exchange consumes Branded's Fusion board but leaves Mirrorjade's delayed wipe as a real clock.","endBoard":"Branded: Mudragon of the Swamp. Toon: Comic Cat and Perfect World; March Hare in hand; Hearts, Evil Box, White Rabbit, and Funny in the GY. Mirrorjade's End Phase destruction is pending."},{"title":"Turn 3 — Toon","lp":"Toon 6200 — Branded 0","actions":["Perfect World performs its first search of the turn and adds Dark-Eyes Illusionist Faceless Mage.","Dark-Eyes discards itself, returns Evil Box from the GY to the hand, and Special Summons Evil Box while ignoring its Summoning conditions.","Comic Cat activates. It Tributes Branded's Mudragon as cost and Special Summons Funny Dark Rabbit from the Deck.","Funny's successful Special Summon grants Toon an additional Normal Summon.","Perfect World performs a second search and adds another Funny Dark Rabbit. Toon uses the additional Normal Summon to place that second Funny on the field.","March Hare activates from the hand, banishing White Rabbit from the GY and Special Summoning itself.","White Rabbit activates while banished. Toon pays 300 LP, Special Summons it, and Sets another Maliss Trap.","Comic Cat, the first Funny Dark Rabbit, March Hare, and White Rabbit are used as four individual Effect Monster materials to Link Summon Accesscode Talker.","Accesscode targets Hearts Crypter in the GY. Because Hearts is Link-3, Accesscode gains 3000 ATK and reaches 5300.","Battle Phase: Accesscode Talker attacks directly for 5300, Evil Box attacks for 2300, and the second Funny Dark Rabbit attacks for 1100. Branded takes 8700 total damage before Mirrorjade's delayed End Phase wipe can occur."],"audit":"This is the Extra Deck line that the provisional version missed. Toon does not need Hearts to survive on the field: Hearts becoming Super Polymerization material loads a Link-3 into the GY, allowing four small bodies to convert into a 5300 ATK Accesscode. Perfect World's repeatable search plus Funny's additional Normal Summon supplies the final 1100 damage required for lethal.","endBoard":"Toon wins Game 1 before the End Phase."}],"decidingFactor":"Toon treats its new support as a Maliss/Cyberse Link engine rather than a purely Main Deck Toon package. Hearts Crypter trades through Mirrorjade and Super Polymerization, then becomes Accesscode's 3000-ATK target from the GY."},{"title":"Game 2","winner":"Branded","firstPlayer":"Branded","sideDeck":{"Toon":"Adds Mulcharmy Fuwalos and additional going-second interaction, trimming slower copies of Mind Scan and Toon Terror.","Branded":"Preserves a high engine count. The published Branded source did not include a public Side Deck, so no unverified Branded side-card is used in this game."},"openingHands":{"Branded":["Aluber the Jester of Despia","Branded Fusion","Phara the Primordial Goddess","Super Polymerization","The Fallen & The Virtuous"],"Toon":["Mulcharmy Fuwalos","Funny Dark Rabbit","Toon Bookmark","Maliss in Underground","Comic Cat"]},"turns":[{"title":"Turn 1 — Branded","lp":"Branded 8000 — Toon 8000","actions":["Before Branded begins developing, Toon discards Mulcharmy Fuwalos. Toon will draw whenever Branded Special Summons from the Deck or Extra Deck this turn.","Branded Normal Summons Aluber and adds Branded Retribution.","Phara the Primordial Goddess reveals itself and Branded Fusion. Until the end of Toon's next turn, neither player can respond to activations or effects of Branded Fusion.","Branded Fusion sends Fallen of Albaz and Tri-Brigade Mercourier from the Deck to Fusion Summon Lubellion the Searing Dragon. Fuwalos draws one card.","Lubellion discards Branded Retribution as cost, then shuffles itself and Fallen of Albaz into the Deck/Extra Deck to Fusion Summon Mirrorjade. Fuwalos draws a second card.","Branded Sets Super Polymerization and The Fallen & The Virtuous, retaining Phara in hand."],"audit":"Branded deliberately chooses the two-Special-Summon Lubellion-to-Mirrorjade route. Extending further would feed unnecessary Fuwalos draws. Discarding Retribution is intentional because its GY effect can later recover Branded Fusion.","endBoard":"Branded: Mirrorjade, Aluber, Set Super Polymerization, Set The Fallen & The Virtuous; Phara in hand; Retribution in the GY. Toon has drawn twice from Fuwalos."},{"title":"Turn 2 — Toon","lp":"Branded 8000 — Toon 7400","actions":["Toon draws Evil Box for turn.","Maliss in Underground banishes Dormouse; Dormouse pays 300 LP to return, banishes White Rabbit, and White Rabbit pays 300 LP to return and Set MTP-07.","Funny Dark Rabbit is Normal Summoned, adds Perfect World, and grants the additional Normal Summon used for Comic Cat.","Perfect World replaces Underground. Evil Box Special Summons itself from hand and Sets Toon Terror.","Comic Cat Tributes Mirrorjade as cost and Special Summons Dark-Eyes Illusionist Faceless Mage from the Deck. Mirrorjade schedules the destruction of Toon's monsters during the End Phase.","Branded activates the previously Set The Fallen & The Virtuous. It sends The Dragon that Devours the Dogma from the Extra Deck to the GY and destroys Perfect World.","Toon Terror was Set this turn, so it cannot be activated. With Toon World gone, Comic Cat and Evil Box also lose their temporary Toon status.","Dormouse, White Rabbit, and Funny are used to Link Summon Hearts Crypter.","Branded activates Super Polymerization, discarding Phara as the activation cost. Because Phara was discarded as a cost rather than by the Spell's effect, Phara does not Special Summon itself.","Super Polymerization uses Hearts Crypter and Comic Cat, two DARK monsters with different Types, to Fusion Summon Mudragon of the Swamp.","The Dragon that Devours the Dogma then adds Dogmatika Ecclesia, the Virtuous from the Deck."],"audit":"Branded waits until Perfect World is destroyed before using Super Polymerization. Toon can no longer temporarily hide Comic Cat, so Hearts plus Comic become guaranteed Mudragon material. The Phara non-trigger is a critical rules point: Super Polymerization's discard is a cost.","endBoard":"Branded: Mudragon and Aluber; Retribution in the GY. Toon: no monsters, Set MTP-07 and a stranded Toon Terror. Branded has Dogmatika Ecclesia, the Virtuous for follow-up."},{"title":"Turn 3 — Branded","lp":"Branded 8000 — Toon 0","actions":["Branded banishes Branded Retribution from the GY to return Branded Fusion from the GY to the hand.","Branded Fusion sends Fallen of Albaz and a LIGHT monster from the Deck to Fusion Summon Albion the Branded Dragon.","Albion banishes itself and Fallen of Albaz to Fusion Summon a fresh Mirrorjade the Iceblade Dragon.","After completing its Extra Deck development, Branded Normal Summons Dogmatika Ecclesia, the Virtuous. Its search is unnecessary for this combat step.","Battle Phase: Mirrorjade attacks for 3000, Mudragon for 1900, Aluber for 1800, and Dogmatika Ecclesia for 1500. The four attacks total 8200 damage against Toon's remaining 7400 LP."],"audit":"Retribution converts a discarded resource into a second Branded Fusion. Branded completes the Fusion line before Normal Summoning Ecclesia, then uses the 1500 ATK body found by The Dragon that Devours the Dogma to produce lethal without relying on an illegal Springans search.","endBoard":"Branded wins Game 2 with 8200 battle damage."}],"decidingFactor":"Branded limits Mulcharmy Fuwalos to two draws, removes Perfect World before committing Super Polymerization, and converts its GY resource loop plus Dogmatika Ecclesia into an 8200-damage counterattack."},{"title":"Game 3","winner":"Toon","firstPlayer":"Toon","sideDeck":{"Toon":"Restores Mind Scan and Toon Terror for the play and keeps Dimension Shifter as the highest-impact card against Branded's GY-dependent Fusion loop.","Branded":"Adds Cosmic Cyclone as a simulated matchup side card and retains Ash Blossom plus its primary Fusion engine."},"openingHands":{"Toon":["Dimension Shifter","Maliss in Underground","Funny Dark Rabbit","Toon Bookmark","Infinite Impermanence"],"Branded":["Cosmic Cyclone","Branded Fusion","Super Polymerization","Aluber the Jester of Despia","Ash Blossom & Joyous Spring"]},"turns":[{"title":"Turn 1 — Toon","lp":"Toon 7400 — Branded 8000","actions":["During the Standby Phase, Toon activates Dimension Shifter while its GY is empty. Until the end of Branded's next turn, every card that would be sent to a GY is banished instead.","Maliss in Underground banishes Dormouse. Dormouse pays 300 LP to Special Summon, then banishes White Rabbit. White Rabbit pays 300 LP to Special Summon and Sets MTP-07.","Toon Normal Summons Funny Dark Rabbit and activates its Deck-access effect.","Branded chains Ash Blossom & Joyous Spring. Funny's search is negated, and Ash is banished by Dimension Shifter instead of going to the GY. Funny's separate additional-Normal-Summon permission remains available.","Toon Bookmark searches Toon World the Perfect World, which is then activated.","Perfect World searches Evil Box. Evil Box Special Summons itself from the hand and Sets Toon Terror.","Perfect World performs another search and adds Mind Scan, which Toon Sets.","Dormouse, White Rabbit, and Funny become Link Material for Hearts Crypter. Dimension Shifter banishes all three materials; their once-per-turn banished revival effects have already been used, so they remain banished.","Hearts is positioned to point to Evil Box. Toon Sets MTP-07, Mind Scan, Toon Terror, and Infinite Impermanence."],"audit":"Hearts Crypter is substantially stronger than a generic Link under Dimension Shifter: the banished Maliss materials become ammunition for Hearts, while Shifter prevents Branded Fusion, High Spirits, Retribution, and Mirrorjade from building their normal GY loop.","endBoard":"Toon: Hearts Crypter pointing to Evil Box; Perfect World; MTP-07; Mind Scan; Toon Terror; Infinite Impermanence. Dormouse, White Rabbit, Funny, and Ash Blossom are banished."},{"title":"Turn 2 — Branded","lp":"Toon 7400 — Branded 8000","actions":["In the Draw Phase, Branded activates Cosmic Cyclone targeting Perfect World.","Toon chains Toon Terror. Toon Terror negates and destroys Cosmic Cyclone; Dimension Shifter banishes Cosmic instead of sending it to the GY.","During the Standby Phase, Toon activates Mind Scan. Branded's hand is now revealed.","In a new Chain, Mind Scan declares Branded Fusion before Branded Fusion has been activated. The activated effects of every Branded Fusion are negated for the rest of the turn.","Branded Normal Summons Aluber and activates its search effect.","Toon chains Infinite Impermanence targeting Aluber. Aluber is negated and cannot search The Fallen & The Virtuous or another defensive Branded card.","After that Chain resolves, Hearts Crypter targets the banished Dormouse, shuffles it into the Deck, and banishes Aluber. Because Hearts points to Evil Box, neither the activation nor the effect can be negated.","Branded activates Super Polymerization and discards the now-blanked Branded Fusion as cost.","Before Super Polymerization resolves, Perfect World temporarily banishes Evil Box. Branded controls no monster and Toon controls only Hearts, so there are not two legal Fusion Materials. Super Polymerization resolves without a Fusion Summon; Evil Box immediately returns.","Branded has no productive GY line under Dimension Shifter and passes with an empty field."],"audit":"The board is layered rather than redundant: Toon Terror answers the Field Spell removal, Mind Scan preemptively blanks Branded Fusion, Impermanence denies Aluber's replacement search, Hearts removes the body, and Perfect World defeats Super Polymerization without starting a Chain.","endBoard":"Toon retains Hearts, Evil Box, Perfect World, Mind Scan, and MTP-07. Branded controls no cards. Dimension Shifter expires at the end of the turn."},{"title":"Turn 3 — Toon","lp":"Toon 6500 — Branded 0","actions":["Toon activates MTP-07. It adds March Hare from the Deck, then, because Toon controls a Maliss Link Monster, MTP-07's resolving effect banishes Hearts Crypter from the field.","Hearts activates while banished. Toon pays 900 LP; Hearts Special Summons itself and doubles to 5000 ATK.","MTP-07 is now in the GY because Dimension Shifter has expired. March Hare banishes MTP-07 from the GY and Special Summons itself.","Perfect World searches Comic Cat. Toon Normal Summons Comic Cat.","Comic Cat Tributes itself and Special Summons Funny Dark Rabbit from the Deck.","Battle Phase: Hearts Crypter attacks directly for 5000, Evil Box for 2300, March Hare for 600, and Funny Dark Rabbit for 1100. Total damage is 9000."],"audit":"No further Extra Deck summon is correct. Hearts is already a 5000 ATK attacker, and converting it into Accesscode would reduce the available damage. The optimal line is the simplest one once Branded's field is empty.","endBoard":"Toon wins Game 3 and the match 2–1."}],"decidingFactor":"Dimension Shifter attacks Branded's infrastructure, while Mind Scan, Impermanence, Hearts Crypter, Toon Terror, and Perfect World each cover a different response axis. Branded cannot trade one board breaker for the entire position."}],"analysis":["Toon wins the audited replay 2–1.","Game 1 demonstrates that the deck's real ceiling is a hybrid Toon–Maliss Link strategy. Hearts Crypter can become interaction, Super Polymerization material, and then a 3000-ATK Accesscode target in successive stages.","Branded's Game 2 win is equally technical: it minimizes Mulcharmy Fuwalos draws, removes Perfect World before committing Super Polymerization, and converts Branded Retribution into exact lethal.","Game 3 is decided by layered incompatibilities rather than one negate. Dimension Shifter disables the GY, Mind Scan disables Branded Fusion, Impermanence disables Aluber, Hearts removes the body, and Perfect World invalidates Super Polymerization's material set."]},{"id":"r2-m1-power-patron-dark-magician","round":"Round 2","title":"Power Patron vs. Dark Magician","players":["Power Patron","Dark Magician"],"score":"Power Patron 2–1","status":"complete","detailLevel":"full","context":["The first pairing of Round 2 under the tournament's round-robin rotation.","The audit focuses on Power Patron's Fusion/Xyz sequencing, Dark Magician's Spellcaster lock, and whether each player preserves the correct interaction for the opponent's highest-impact line."],"games":[{"title":"Game 1","winner":"Power Patron","firstPlayer":"Power Patron","openingHands":{"Power Patron":["Artmage Vandalism -Assault-","Plundered Power Patron Plane – Vidolia","Dominus Impulse","Theorealize Liberation","DoomZ Destruction"],"Dark Magician":["Magicians' Souls","Magician's Rod","Dark Magical Circle","The Gaze of Timaeus","Soul Servant"]},"turns":[{"title":"Turn 1 — Power Patron","lp":"Power Patron 8000 — Dark Magician 8000","actions":["Power Patron activates Artmage Vandalism -Assault- and adds Medius the Pure.","Medius is Normal Summoned. Its on-summon effect Special Summons Power Patron DoomZ from the Deck.","Vandalism targets Power Patron DoomZ. If DoomZ is used as Fusion Material this turn, it can be treated as an Artmage monster.","Plundered Power Patron Plane – Vidolia reveals Nerva the Power Patron of Creation in the Extra Deck. Power Patron banishes Theorealize Liberation from the hand face-down and Special Summons Nervedo the Shadebeast Power Patron from the Deck.","Nervedo banishes the top three cards of the Deck face-down and destroys itself, then Special Summons Nerva from the Extra Deck. This is treated as a Fusion Summon.","Because Nervedo was added to the Extra Deck face-up, it Special Summons Artmage Power Patron from the Deck.","Artmage Power Patron activates during the Main Phase. It uses itself and Power Patron DoomZ—currently treated as an Artmage monster—as Fusion Material for Artmage Non-Finito.","Non-Finito Sets Artmage Impasto -Recapture- directly from the Deck.","Power Patron Sets DoomZ Destruction and ends with Nerva, Non-Finito, and Medius."],"audit":"DoomZ is used as the temporary Artmage material instead of Medius. That leaves Medius, a DARK monster, beside Non-Finito, so Non-Finito retains a legal opponent-turn Fusion route. Nerva is also live because Non-Finito can activate an Artmage monster effect.","endBoard":"Power Patron: Nerva, Artmage Non-Finito, Medius; Vidolia and Vandalism; Set Impasto and DoomZ Destruction; Dominus Impulse in hand."},{"title":"Turn 2 — Dark Magician","lp":"Power Patron 8000 — Dark Magician 8000","actions":["Dark Magician activates Dark Magical Circle. The top three cards reveal Dark Magical Curtain, which is added to the hand.","Dark Magician Normal Summons Magician's Rod. Chain Link 1: Rod attempts to add a Spell/Trap that mentions Dark Magician.","Power Patron responds with Artmage Non-Finito. Chain Link 2: Non-Finito activates its opponent-turn Fusion effect.","Nerva chains to that Artmage monster effect. Chain Link 3 changes Non-Finito's resolving effect into 'Destroy all cards your opponent controls.'","The Chain resolves backward. Nerva rewrites Non-Finito's effect; Non-Finito destroys Dark Magical Circle and Magician's Rod; Rod's already-activated effect still resolves and adds Secrets of Dark Magic.","Dark Magician activates Magicians' Souls from the hand, sending Dark Magician from the Deck to the GY as cost.","Power Patron activates Dominus Impulse from the hand. Souls' Special Summon effect is negated.","Dark Magician activates Dark Magical Curtain. It Special Summons Dark Magician from the Deck, then adds The Gaze of Timaeus.","Because a Spell effect was activated this turn, Dark Magician banishes the newly Summoned Dark Magician to Special Summon Dark Magician of Destruction from the Extra Deck.","Dark Magician of Destruction activates its search effect. Power Patron chains Artmage Impasto -Recapture-, temporarily banishing Non-Finito, negating the activated effect, and destroying Dark Magician of Destruction.","Dark Magician Sets The Gaze of Timaeus and ends. Non-Finito returns during the End Phase."],"audit":"Power Patron does not spend Impasto on Rod. Nerva converts the lower-value Non-Finito activation into a board wipe, while Impasto is preserved for Dark Magician of Destruction—the effect that would otherwise reload the engine after Curtain.","endBoard":"Power Patron: Nerva, Non-Finito, Medius, Vidolia, Vandalism, Set DoomZ Destruction. Dark Magician: one Set The Gaze of Timaeus and no monsters."},{"title":"Turn 3 — Power Patron","lp":"Power Patron 8000 — Dark Magician 0","actions":["Power Patron draws Power Patron DoomZ and Normal Summons it.","DoomZ targets Medius and Xyz Summons DoomZ Break - Diactorus, using Medius as material and equipping itself to Diactorus.","Diactorus destroys the equipped DoomZ, then destroys Dark Magician's Set The Gaze of Timaeus.","Nerva attacks directly for 3300, Non-Finito for 2400, and Diactorus for 2400."],"audit":"The Xyz conversion replaces Medius and DoomZ's combined 2100 ATK with Diactorus's 2400 while also clearing the only Set card. The resulting 8100 damage is exact lethal.","endBoard":"Power Patron wins Game 1 with 8100 battle damage."}],"decidingFactor":"Power Patron preserves three different interaction layers: Nerva rewrites an Artmage effect, Dominus Impulse stops the first Deck-based Special Summon, and Impasto is held specifically for Dark Magician of Destruction."},{"title":"Game 2","winner":"Dark Magician","firstPlayer":"Dark Magician","sideDeck":{"Dark Magician":"Adds Secret Village of the Spellcasters and Dimensional Barrier for a high-impact going-first configuration.","Power Patron":"Adds Harpie's Feather Duster and additional removal, but draws a hand whose Spell cards are vulnerable to Secret Village."},"openingHands":{"Dark Magician":["Magicians' Souls","Magician's Rod","Dark Magical Circle","Secret Village of the Spellcasters","Dimensional Barrier"],"Power Patron":["Artmage Vandalism -Assault-","Plundered Power Patron Plane – Vidolia","Harpie's Feather Duster","Medius the Pure","Nervedo the Shadebeast Power Patron"]},"turns":[{"title":"Turn 1 — Dark Magician","lp":"Dark Magician 8000 — Power Patron 8000","actions":["Magicians' Souls sends Dark Magician from the Deck to the GY and Special Summons itself.","Dark Magical Circle is activated and adds Soul Servant from the top three cards.","Magician's Rod is Normal Summoned and adds Dark Magical Curtain.","Soul Servant places Dark Magician, the Pharaoh's Servant on top of the Deck, then banishes itself from the GY to draw that card because Dark Magician is already in the GY.","Dark Magician, the Pharaoh's Servant reveals Dark Magical Curtain, Special Summons itself, and Sets The Gaze of Timaeus directly from the Deck.","Because a Spell was activated during the turn, Pharaoh's Servant is banished to Special Summon Dark Magician of Destruction from the Extra Deck.","Dark Magician of Destruction adds Secrets of Dark Magic.","Dark Magician activates Secret Village of the Spellcasters and Sets Dimensional Barrier."],"audit":"Dark Magician of Destruction remains the Spellcaster maintaining Secret Village. Souls and Rod are left on the field because their combined damage matters if the lock produces only one skipped turn.","endBoard":"Dark Magician: Dark Magician of Destruction, Magicians' Souls, Magician's Rod, Dark Magical Circle, Secret Village, Set The Gaze of Timaeus, and Set Dimensional Barrier."},{"title":"Turn 2 — Power Patron","lp":"Dark Magician 8000 — Power Patron 8000","actions":["Secret Village prevents Power Patron from activating Vandalism, Vidolia, or Harpie's Feather Duster because Power Patron controls no Spellcaster.","Power Patron Normal Summons Medius. Medius Special Summons Power Patron DoomZ from the Deck.","DoomZ targets Medius and attempts to perform an Xyz Summon.","Dark Magician activates Dimensional Barrier and declares Xyz. Xyz Summons are prohibited for the rest of the turn, so DoomZ cannot produce Diactorus.","Power Patron passes with Medius and DoomZ."],"audit":"Declaring Xyz is stronger than declaring Fusion here. Secret Village has already shut off the Spell-based Nerva route, so Diactorus is the only immediate Extra Deck conversion available from the visible monsters.","endBoard":"Power Patron: Medius and Power Patron DoomZ. Dark Magician's full engine remains intact."},{"title":"Turn 3 — Dark Magician","lp":"Dark Magician 8000 — Power Patron 0","actions":["Dark Magician activates Dark Magical Curtain. It Special Summons Dark Magician from the Deck and adds Soul Servant.","Dark Magical Circle triggers and banishes Power Patron DoomZ.","The previously Set The Gaze of Timaeus targets Dark Magician, shuffles it into the Deck as material, and Fusion Summons Red-Eyes Dark Dragoon.","Dragoon destroys Medius and inflicts 1800 damage.","Battle Phase: Dark Magician of Destruction attacks for 2800, Red-Eyes Dark Dragoon for 3000, and Magician's Rod for 1600."],"audit":"Dark Magician converts the one-turn Secret Village lock directly into lethal rather than spending resources on a longer control game.","endBoard":"Dark Magician wins Game 2 with 9200 combined effect and battle damage."}],"decidingFactor":"Secret Village prevents Power Patron from activating every Spell in its opening hand, while Dimensional Barrier closes the only monster-only Xyz line."},{"title":"Game 3","winner":"Power Patron","firstPlayer":"Power Patron","sideDeck":{"Power Patron":"Adds Appointer of the Red Lotus and keeps Prohibited Power Patron Portal - Terminus as the non-targeting answer to Dragoon.","Dark Magician":"Adds Droll & Lock Bird and Super Polymerization, aiming to stop Power Patron's searches and fuse away its EARTH Illusion bosses."},"openingHands":{"Power Patron":["Artmage Vandalism -Assault-","Plundered Power Patron Plane – Vidolia","Appointer of the Red Lotus","Dominus Impulse","DoomZ Destruction"],"Dark Magician":["Droll & Lock Bird","Super Polymerization","Magicians' Souls","Dark Magical Circle","Dark Magical Curtain"]},"turns":[{"title":"Turn 1 — Power Patron","lp":"Power Patron 8000 — Dark Magician 8000","actions":["Vandalism adds Medius. Dark Magician responds with Droll & Lock Bird, preventing further Main Deck additions to the hand this turn.","Medius is Normal Summoned and Special Summons Power Patron DoomZ from the Deck. This remains legal under Droll because the card is Special Summoned rather than added to the hand.","Vandalism makes DoomZ usable as Artmage Fusion Material for the turn.","Vidolia reveals Nerva, banishes DoomZ Destruction face-down, and Special Summons Nervedo from the Deck.","Nervedo destroys itself to Fusion Summon Nerva. Its face-up Extra Deck effect Special Summons Artmage Power Patron from the Deck.","Artmage Power Patron and DoomZ Fusion Summon Artmage Non-Finito.","Non-Finito Sets Artmage Impasto -Recapture-. Artmage Power Patron's attempted Deck-to-hand follow-up is unavailable under Droll.","Power Patron Sets Appointer of the Red Lotus."],"audit":"Every post-Droll action either Special Summons or Sets from the Deck. Droll removes the search follow-up but does not prevent the Nerva–Non-Finito board.","endBoard":"Power Patron: Nerva, Non-Finito, Medius; Vidolia and Vandalism; Set Impasto and Appointer; Dominus Impulse in hand."},{"title":"Turn 2 — Dark Magician","lp":"Power Patron 4800 — Dark Magician 8000","actions":["During the Standby Phase, Power Patron activates Appointer of the Red Lotus, pays 2000 LP, reveals Dominus Impulse, and inspects Dark Magician's hand.","Appointer temporarily banishes Super Polymerization, preventing Dark Magician from using Nerva and Non-Finito as Garura material.","Dark Magical Circle is activated. Magician's Rod is Normal Summoned and activates to search.","Power Patron chains Non-Finito's opponent-turn Fusion effect, then chains Nerva to rewrite that Artmage effect.","Nerva makes Non-Finito destroy all cards Dark Magician controls. Circle and Rod are destroyed, but Rod's already-activated search still resolves and adds Secrets of Dark Magic.","Dark Magician activates Dark Magical Curtain.","Power Patron activates Dominus Impulse from the hand. Curtain's Special Summon effect is negated and, because Appointer is now in Power Patron's GY, Curtain is destroyed.","Magicians' Souls sends Dark Magician to the GY and Special Summons itself.","Dark Magician activates Soul Servant, places The Gaze of Timaeus on top of the Deck, then banishes Soul Servant to draw it.","The Gaze of Timaeus shuffles Dark Magician from the GY into the Deck and Fusion Summons Red-Eyes Dark Dragoon.","Dragoon activates its destruction effect against Medius.","Power Patron chains Artmage Impasto -Recapture-. Non-Finito is temporarily banished, Dragoon's activation is negated, but Dragoon is not destroyed because it is protected from effect destruction.","Battle Phase: Dragoon destroys Medius and inflicts 1200 battle damage. Non-Finito returns during the End Phase."],"audit":"Appointer removes the one card that cannot be answered on Chain—Super Polymerization. Impasto is then reserved for Dragoon's destruction effect. Although it cannot destroy Dragoon, preventing the burn preserves enough LP for the longer resource game.","endBoard":"Power Patron: Nerva and Non-Finito. Dark Magician: Dragoon and Magicians' Souls. Super Polymerization remains temporarily banished."},{"title":"Turn 3 — Power Patron","lp":"Power Patron 4800 — Dark Magician 5600","actions":["Power Patron draws and activates Prohibited Power Patron Portal - Terminus.","Dragoon discards Secrets of Dark Magic to negate the activation. Terminus is destroyed and sent to the GY, which still makes its separate battle effect available.","Nerva attacks Dragoon.","At the start of the Damage Step, Power Patron banishes Terminus from the GY. Dragoon is banished face-down before damage calculation.","Non-Finito attacks Magicians' Souls and inflicts 2400 battle damage.","During Main Phase 2, Nerva and Non-Finito are used as Link Material for S:P Little Knight.","Because a Fusion Monster was used as material, S:P banishes Magicians' Souls from the GY."],"audit":"Terminus is the correct Dragoon answer because its Damage Step removal neither targets nor destroys. Linking away Nerva and Non-Finito afterward prevents the returning Super Polymerization from converting the two EARTH Illusions into Garura.","endBoard":"Power Patron: S:P Little Knight. Dark Magician: empty field; Super Polymerization returns during the End Phase."},{"title":"Turn 4 — Dark Magician","lp":"Power Patron 2300 — Dark Magician 5600","actions":["Dark Magician Normal Summons Magician's Rod. Rod activates to add Dark Magical Curtain.","S:P Little Knight chains, targeting itself and Rod. Both monsters are banished until the End Phase; Rod's search still resolves.","Dark Magical Curtain Special Summons Dark Magician from the Deck and adds The Gaze of Timaeus.","Super Polymerization has no legal pair of opposing monsters because S:P is currently banished.","Dark Magician attacks directly for 2500.","S:P and Rod return during the End Phase. Dark Magician Sets Super Polymerization."],"audit":"S:P does not try to stop Rod's search. It removes the only live opposing body before Super Polymerization can be used and preserves itself for the next turn.","endBoard":"Power Patron: S:P Little Knight, 2300 LP. Dark Magician: Dark Magician, Magician's Rod, and Set Super Polymerization."},{"title":"Turn 5 — Power Patron","lp":"Power Patron 2300 — Dark Magician 4300","actions":["Power Patron draws Harpie's Feather Duster and destroys the Set Super Polymerization.","Medius activates in the GY, shuffling S:P Little Knight from the field into the Extra Deck and Special Summoning itself.","Medius Special Summons Nervedo from the Deck.","Nervedo destroys itself to Fusion Summon Nerva, then Special Summons Artmage Power Patron from the Deck.","Battle Phase: Nerva destroys Dark Magician and inflicts 800 damage; Medius destroys Magician's Rod and inflicts 200; Artmage Power Patron attacks directly for 300."],"audit":"Harpie's Feather Duster must be used before committing Nerva and Artmage Power Patron. Otherwise Super Polymerization could fuse those two EARTH Illusions into Garura without allowing a response.","endBoard":"Power Patron: Nerva, Medius, Artmage Power Patron. Dark Magician: empty field, 4300 LP."},{"title":"Turn 6 — Dark Magician","lp":"Power Patron 2300 — Dark Magician 4300","actions":["Dark Magician activates The Gaze of Timaeus, targeting Dark Magician in the GY and Fusion Summoning Dark Magician of Destruction.","Dark Magician of Destruction adds Dark Magical Circle.","Circle is activated after the Fusion Summon, so it cannot retroactively trigger from that Summon.","Dark Magician of Destruction cannot attack over Nerva's 3300 ATK and Dark Magician passes after setting its remaining card."],"audit":"The Gaze creates the strongest available single body, but Circle's banish trigger is missed because Circle was not face-up when Dark Magician of Destruction was Summoned.","endBoard":"Dark Magician: Dark Magician of Destruction, Dark Magical Circle, one Set card. Power Patron retains all three monsters."},{"title":"Turn 7 — Power Patron","lp":"Power Patron 2300 — Dark Magician 0","actions":["Power Patron draws and activates Artmage Vandalism -Assault-, adding another Medius and targeting the face-up Medius so it can be used as Artmage Fusion Material.","Artmage Power Patron activates its Fusion effect using itself and Medius.","Nerva chains and rewrites the activated Artmage effect into 'Destroy all cards your opponent controls.'","Dark Magician of Destruction, Dark Magical Circle, and the Set card are destroyed.","Battle Phase: Nerva attacks for 3300, Medius for 1800, and Artmage Power Patron for 300."],"audit":"The final Vandalism draw converts Medius into legal Artmage material, making Artmage Power Patron's effect activatable. Nerva replaces the Fusion effect with a full board wipe while all three attackers remain.","endBoard":"Power Patron wins Game 3 with 5400 direct damage and takes the match 2–1."}],"decidingFactor":"Power Patron identifies Super Polymerization as the unique unchainable threat, answers Dragoon with Terminus rather than destruction, and uses S:P to alter the attributes and Types available as Fusion Material."}],"analysis":["Power Patron wins the match 2–1 and moves to 2–0.","Dark Magician's Game 2 demonstrates a genuine matchup vulnerability: Secret Village can blank most of Power Patron's opening hand, and Dimensional Barrier can then call the Extra Deck type still reachable through monsters alone.","Power Patron's key technical pattern is preserving Medius as the DARK monster beside Non-Finito while using DoomZ as the temporary Artmage Fusion Material.","Game 3 is won through threat classification: Appointer takes Super Polymerization, Impasto checks Dragoon's effect, Terminus removes Dragoon in the Damage Step, and S:P prevents the returning Super Polymerization from becoming live."]},{"id":"r2-m2-sky-striker-kewl-tune","round":"Round 2","title":"Sky Striker vs. Kewl Tune","players":["Sky Striker","Kewl Tune"],"score":"Kewl Tune 2–1","status":"complete","detailLevel":"full","context":["Sky Striker attempts to break a multi-Synchro board with one-for-one Spells and repeated Link conversion.","Kewl Tune's central challenge is preserving separate response windows instead of placing every resource into Kewl Tune B2B immediately.","The Side Deck games revolve around Dimensional Barrier, Droll & Lock Bird, and whether Sky Striker can keep its Main Monster Zones clear while borrowing opposing monsters."],"games":[{"title":"Game 1","winner":"Kewl Tune","firstPlayer":"Kewl Tune","openingHands":{"Kewl Tune":["Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Cue","Kewl Tune Synchro","Ghost Belle & Haunted Mansion"],"Sky Striker":["Sky Striker Ace - Raye","Sky Striker Mobilize – Engage!","Sky Striker Mecha – Widow Anchor","Sky Striker Mecha – Linkage!","Radiant Typhoon Vision"]},"turns":[{"title":"Turn 1 — Kewl Tune","lp":"Kewl Tune 8000 — Sky Striker 8000","actions":["Kewl Tune Rotary grants an additional Normal Summon of a Tuner.","Kewl Tune Mix is Normal Summoned and adds Kewl Tune Clip.","Kewl Tune Cue is Normal Summoned using Rotary's additional Summon. Cue Special Summons Rotary from the hand.","Cue and Rotary Synchro Summon Kewl Tune Track Maker.","Track Maker searches JJ “Kewl Tune”. The material effects arrange follow-up and inspect Sky Striker's hand.","JJ “Kewl Tune” is activated. Track Maker uses Mix from the hand as additional Synchro Material and summons Kewl Tune Loudness War.","Kewl Tune Synchro adds Kewl Tune Reco and immediately performs another Tuner Synchro Summon, producing Kewl Tune RS.","Reco and the remaining Tuner line produce Kewl Tune Crackle.","Kewl Tune ends without summoning Kewl Tune B2B."],"audit":"Loudness War, RS, and Crackle create three independent interruptions. Opening directly on B2B would produce a larger monster but fewer distinct answers to Engage, Linkage, and a borrowed-monster Link conversion.","endBoard":"Kewl Tune: Loudness War, RS, Crackle, JJ “Kewl Tune”, and one set Kewl Tune card."},{"title":"Turn 2 — Sky Striker","lp":"Kewl Tune 8000 — Sky Striker 6500","actions":["Sky Striker activates Sky Striker Mobilize – Engage! and adds Sky Striker Maneuver - Afterburners!.","Sky Striker Normal Summons Raye and Link Summons Sky Striker Ace – Hayate.","Hayate attacks directly for 1500 and sends a second copy of Engage from the Deck to the GY.","Sky Striker activates Linkage, sending Hayate to the GY and Special Summoning Sky Striker Ace – Kagari.","Kagari targets Engage in the GY. Kewl Tune allows Kagari to resolve because preventing the recovery would expose RS to the already-held Widow Anchor.","Kagari returns Engage. Sky Striker activates Widow Anchor targeting Loudness War. With three Spells now in the GY, control of Loudness War changes.","Kagari and the borrowed Loudness War Link Summon Sky Striker Ace – Zeke. Loudness War is now permanently removed from Kewl Tune's field as Link Material.","Zeke temporarily banishes Crackle.","Sky Striker activates the recovered Engage. Kewl Tune RS banishes Rotary from the GY and negates that activation.","Zeke is converted into Sky Striker Ace – Shizuku. During the End Phase, Shizuku adds a Sky Striker Spell with a name not already represented in the GY."],"audit":"Sky Striker correctly uses Widow Anchor as permanent conversion rather than temporary negation. The borrowed Loudness War becomes Zeke material, clearing the Main Monster Zone before the second Engage activation.","endBoard":"Sky Striker: Shizuku and one set Spell. Kewl Tune: RS, JJ “Kewl Tune”; Crackle returns in the End Phase."},{"title":"Turn 3 — Kewl Tune","lp":"Kewl Tune 8000 — Sky Striker 6500","actions":["Kewl Tune Synchro adds Kewl Tune Reco and immediately produces a fresh Track Maker.","Track Maker returns Sky Striker's set card to the hand when used as Synchro Material.","JJ “Kewl Tune” Tributes RS and Special Summons Kewl Tune Cue from the Deck.","Cue and Crackle Synchro Summon Kewl Tune B2B.","B2B attacks Shizuku and then uses its additional attack to attack directly.","Kewl Tune Reco and the remaining bodies develop Baronne de Fleur before the End Phase.","Sky Striker cannot rebuild through B2B plus Baronne with its set interaction already returned to hand."],"audit":"B2B enters only after Widow Anchor and the first Engage have traded. Track Maker's material effect removes the set defensive card before combat, and Baronne is made after damage rather than before it.","endBoard":"Kewl Tune wins Game 1."}],"decidingFactor":"Sky Striker removes the first Synchro layer efficiently, but Kewl Tune retains enough Tuner density to produce B2B and Baronne after the control exchange."},{"title":"Game 2","winner":"Sky Striker","firstPlayer":"Sky Striker","sideDeck":{"Sky Striker":"Adds Dimensional Barrier and additional hand traps. The plan is to stop the first Synchro Summon rather than trade with the resulting Synchro Monster.","Kewl Tune":"Adds back-row removal and retains its compact Tuner engine."},"openingHands":{"Sky Striker":["Sky Striker Ace - Raye","Sky Striker Ace - Roze","Sky Striker Mobilize – Engage!","Sky Striker Mecha – Widow Anchor","Dimensional Barrier"],"Kewl Tune":["Kewl Tune Cue","Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Synchro","Harpie's Feather Duster"]},"turns":[{"title":"Turn 1 — Sky Striker","lp":"Sky Striker 8000 — Kewl Tune 8000","actions":["Sky Striker activates Engage and adds Sky Striker Mecha – Linkage!.","Raye is Normal Summoned. Roze Special Summons itself after a Sky Striker Ace monster is Summoned.","Raye and Roze Link Summon Sky Striker Ace – Zero.","Zero uses its on-summon effect and adds Sky Striker Maneuver - Afterburners!.","Sky Striker Sets Widow Anchor, Linkage, and Dimensional Barrier."],"audit":"Zero uses its search effect on this turn and therefore cannot also use its Tribute effect during the same turn. The Tribute effect will become available on Kewl Tune's turn because that is a new turn.","endBoard":"Sky Striker: Zero and three set cards."},{"title":"Turn 2 — Kewl Tune","lp":"Sky Striker 8000 — Kewl Tune 8000","actions":["Kewl Tune activates Harpie's Feather Duster.","Sky Striker chains Linkage, sending Widow Anchor to the GY and converting Zero into Sky Striker Ace – Kagari. Kagari returns Engage from the GY.","Dimensional Barrier is chained before it would be destroyed and declares Synchro.","Duster resolves and destroys the now-empty remaining back row.","Rotary grants an additional Normal Summon. Mix and Cue are Normal Summoned, and Rotary is Special Summoned.","Because Dimensional Barrier declared Synchro, Kewl Tune cannot perform a Synchro Summon for the remainder of the turn.","Kewl Tune ends with three low-ATK Tuners exposed."],"audit":"Sky Striker converts Zero before Duster resolves, preserving a Link Monster and recovering Engage. Dimensional Barrier is held until Kewl Tune has committed its hand to the field.","endBoard":"Sky Striker: Kagari and Engage in hand. Kewl Tune: Cue, Rotary, and Mix."},{"title":"Turn 3 — Sky Striker","lp":"Sky Striker 8000 — Kewl Tune 0","actions":["Engage adds Afterburners and draws because Sky Striker has reached three Spells in the GY.","Afterburners destroys Mix and, with three Spells in the GY, also destroys another card.","Kagari is converted through Hayate and Shizuku while Linkage supplies additional battle damage.","Sky Striker Ace – Zero is summoned again using Raye and Roze during the extended line.","The combined Link attacks finish the exposed Kewl Tune field."],"audit":"The game is decided before Kewl Tune can regain access to Synchro Summoning. Sky Striker prioritizes removal and damage rather than setting up another long control turn.","endBoard":"Sky Striker wins Game 2."}],"decidingFactor":"Dimensional Barrier attacks Kewl Tune at the Summoning-mechanic level, while Linkage converts Zero before Harpie's Feather Duster can remove Sky Striker's value."},{"title":"Game 3","winner":"Kewl Tune","firstPlayer":"Kewl Tune","sideDeck":{"Kewl Tune":"Adds Called by the Grave and Droll & Lock Bird to protect the first Tuner search and compress Sky Striker's Engage turns.","Sky Striker":"Keeps Dimensional Barrier but must play second."},"openingHands":{"Kewl Tune":["Kewl Tune Rotary","Kewl Tune Mix","Kewl Tune Synchro","Called by the Grave","Droll & Lock Bird"],"Sky Striker":["Ash Blossom & Joyous Spring","Sky Striker Mobilize – Engage!","Sky Striker Ace - Raye","Sky Striker Mecha – Linkage!","Sky Striker Mecha – Widow Anchor"]},"turns":[{"title":"Turn 1 — Kewl Tune","lp":"Kewl Tune 8000 — Sky Striker 8000","actions":["Rotary grants the additional Normal Summon. Mix is Normal Summoned and activates to search.","Sky Striker chains Ash Blossom & Joyous Spring.","Kewl Tune chains Called by the Grave, banishes Ash Blossom, and negates it.","Mix resolves and adds Kewl Tune Cue.","Cue and Rotary produce Track Maker. Track Maker searches JJ “Kewl Tune”.","Kewl Tune Synchro produces Loudness War and searches follow-up.","A second Tuner line produces RS. Kewl Tune stops there and retains Droll in hand."],"audit":"Called by the Grave is spent on the first search because the opening hand lacks a redundant starter. Kewl Tune again avoids committing to B2B before Sky Striker has activated its first monster effect.","endBoard":"Kewl Tune: Loudness War, RS, JJ “Kewl Tune”, one set card; Droll in hand."},{"title":"Turn 2 — Sky Striker","lp":"Kewl Tune 8000 — Sky Striker 6500","actions":["Sky Striker activates Engage and adds Sky Striker Maneuver - Afterburners!.","Kewl Tune activates Droll & Lock Bird. Sky Striker cannot add further cards from the Main Deck to the hand this turn.","Raye is Normal Summoned and becomes Hayate.","Hayate attacks directly and sends a Sky Striker Spell to the GY.","Linkage sends Hayate to the GY and summons Kagari. Kagari's GY recovery remains legal under Droll because it does not add from the Main Deck.","Kagari activates. Kewl Tune B2B is not yet on the field, so Kewl Tune allows the recovery.","Widow Anchor takes Loudness War. Kagari and Loudness War become Zeke, which temporarily banishes RS.","Zeke becomes Shizuku. Droll prevents Shizuku from adding a card from the Deck during the End Phase."],"audit":"Sky Striker navigates Droll correctly: Kagari can recover from the GY, but Engage and Shizuku cannot add from the Deck. The line still removes Loudness War but cannot replenish the hand.","endBoard":"Sky Striker: Shizuku, no set cards, two cards in hand. Kewl Tune: JJ “Kewl Tune”; RS returns in the End Phase."},{"title":"Turn 3 — Kewl Tune","lp":"Kewl Tune 8000 — Sky Striker 0","actions":["JJ “Kewl Tune” Tributes RS and summons Cue from the Deck.","Cue plus the recovered Tuner line Synchro Summon Kewl Tune B2B.","Kewl Tune Synchro adds Reco and immediately produces Baronne de Fleur.","B2B destroys Shizuku, attacks again directly, and Baronne plus the remaining Tuner damage completes the game."],"audit":"Droll does not win the game by itself; it prevents Sky Striker from replacing the cards spent to remove Loudness War. Kewl Tune then deploys B2B only after the Link conversion has ended.","endBoard":"Kewl Tune wins Game 3 and the match 2–1."}],"decidingFactor":"Kewl Tune protects its first search, uses Droll to suppress Sky Striker's replacement cards, and delays B2B until Widow Anchor has already been converted into Link Material."}],"analysis":["Kewl Tune wins 2–1 and remains undefeated.","Sky Striker's best tactical pattern is borrowing a Synchro Monster with Widow Anchor and immediately converting it into Zeke, permanently removing the borrowed threat.","Kewl Tune's strongest adaptation is refusing to lead with B2B. Separate Synchro interactions force Sky Striker to spend several cards before B2B becomes the second-wave boss.","Dimensional Barrier remains the cleanest Sky Striker side card because it prevents the Synchro Summon rather than attempting to answer the Synchro Monster."]},{"id":"r2-m3-toon-turbo-branded","round":"Round 2","title":"Toon Turbo vs. Branded","players":["Toon Turbo","Branded"],"score":"Branded 2–1","status":"complete","detailLevel":"full","context":["Toon Turbo uses its user-submitted Fusion/Link Extra Deck rather than stopping at a Main Deck Toon board.","Branded attempts to separate Toon World the Perfect World from the Toon monsters before using Super Polymerization.","The match turns on whether Mind Scan can preemptively suppress Branded Fusion and whether Phara can protect Branded Fusion's activation window."],"games":[{"title":"Game 1","winner":"Toon Turbo","firstPlayer":"Toon Turbo","openingHands":{"Toon Turbo":["Funny Dark Rabbit","Comic Cat","Evil Box","Toon Dark Magician","Mind Scan"],"Branded":["Aluber the Jester of Despia","Branded Fusion","Super Polymerization","The Fallen & The Virtuous","Phara the Primordial Goddess"]},"turns":[{"title":"Turn 1 — Toon Turbo","lp":"Toon Turbo 8000 — Branded 8000","actions":["Funny Dark Rabbit is Normal Summoned. It establishes Toon World the Perfect World and grants an additional Normal Summon.","The additional Normal Summon is used for Comic Cat.","Evil Box Special Summons itself because Toon World is active and Sets Toon Terror from the Deck.","Perfect World searches Toon Dark Magician.","Toon Dark Magician enters through the Toon engine and accesses the Deck's Fusion package, producing Dark Magician of Destruction.","Dark Magician of Destruction adds a Toon-compatible Dark Magician support card.","Evil Box and the remaining extender become I:P Masquerena.","Toon Turbo Sets Mind Scan and Toon Terror."],"audit":"The deck uses the Extra Deck on Turn 1 but does not overcommit to Blue-Eyes Toon Ultimate Dragon. Dark Magician of Destruction replaces itself with a search, and I:P preserves flexible interaction.","endBoard":"Toon Turbo: Dark Magician of Destruction, Comic Cat, I:P Masquerena, Perfect World, Set Mind Scan, Set Toon Terror."},{"title":"Turn 2 — Branded","lp":"Toon Turbo 8000 — Branded 8000","actions":["During the Standby Phase, Toon Turbo activates Mind Scan and reveals Branded's hand.","Mind Scan declares Branded Fusion before Branded Fusion is activated. Its activated effects are negated for the turn.","Branded Normal Summons Aluber and activates its search effect.","Comic Cat Tributes Aluber as cost and Special Summons Funny Dark Rabbit from the Deck.","Aluber's already-activated effect resolves and adds Branded Retribution.","Branded activates The Fallen & The Virtuous targeting Perfect World for destruction.","Toon Turbo chains Toon Terror, negating and destroying the Quick-Play Spell.","Branded Fusion is now blanked by Mind Scan. Branded Sets Super Polymerization and Retribution.","During the End Phase, I:P Masquerena uses itself and Funny Dark Rabbit to Link Summon S:P Little Knight. Because a Link Monster was used as material, S:P banishes Super Polymerization until the next End Phase."],"audit":"Comic Cat removes Aluber as a cost, so Branded cannot protect it by chaining. S:P is saved for the End Phase, when its temporary banish removes the unchainable Super Polymerization before Toon begins its next turn.","endBoard":"Toon Turbo: Dark Magician of Destruction, Comic Cat, S:P Little Knight, Perfect World. Branded: Set Retribution; Branded Fusion and Phara in hand."},{"title":"Turn 3 — Toon Turbo","lp":"Toon Turbo 8000 — Branded 0","actions":["Perfect World searches Evil Box. Evil Box Special Summons itself and Sets another Toon Trap.","Comic Cat Tributes itself and Special Summons Toon Dark Magician from the Deck.","The Toon Fusion line converts Toon Dark Magician and the available Toon material into Blue-Eyes Toon Ultimate Dragon.","S:P Little Knight removes Branded's remaining Set card.","Dark Magician of Destruction, Blue-Eyes Toon Ultimate Dragon, Evil Box, and the remaining Toon attacker produce lethal damage."],"audit":"The large Fusion Monster is introduced only after Super Polymerization is temporarily banished. S:P clears the remaining back row before Toon commits to combat.","endBoard":"Toon Turbo wins Game 1."}],"decidingFactor":"
