name: Publish SOL OCG Tournament viewer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EXHIBITION_VIDEO_NAME: sky-striker-vs-kewl-tune-82feecd6f515.mp4
  EXHIBITION_VIDEO_SHA256: 80F44C5DAB4C86C7FD330F1A112905E4980153AA806E39D8BCAA21D560FF30F9
  EXHIBITION_VIDEO_URL: https://github.com/LucianCyverse/sol-ocg-tournament/releases/download/sky-kewl-82feecd6f515/sky-striker-vs-kewl-tune-82feecd6f515.mp4
  OPTIMIZED_VIDEO_NAME: optimized-round-robin-match-001-sky-striker-vs-kewl-tune.mp4
  OPTIMIZED_VIDEO_SHA256: 90f1004da45eef63232b0ab28561acaeb8141e7befb13b29691b99eddf849e91
  OPTIMIZED_VIDEO_URL: https://github.com/LucianCyverse/sol-ocg-tournament/releases/download/optimized-rr-m1-sky-kewl-82feecd6f515/optimized-round-robin-match-001-sky-striker-vs-kewl-tune.mp4
  OPTIMIZED_MATCH_2_VIDEO_NAME: optimized-round-robin-match-002-power-patron-vs-dark-magician.mp4
  OPTIMIZED_MATCH_2_VIDEO_SHA256: 6392e3714bdedf322d63fa3544ec5ae2da0d2c9e57516c6d98b316f61ec3b157
  OPTIMIZED_MATCH_2_VIDEO_URL: https://github.com/LucianCyverse/sol-ocg-tournament/releases/download/optimized-rr-m2-power-dark-0cc6565fc0e4/optimized-round-robin-match-002-power-patron-vs-dark-magician.mp4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out viewer source
        uses: actions/checkout@v6

      - name: Validate optimized tournament data and media bindings
        run: node tools/validate-optimized-round-robin.mjs

      - name: Assemble the published site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/media
          cp index.html manifest.webmanifest service-worker.js _site/
          cp -R assets data _site/
          cp media/*.jpg media/*.vtt _site/media/
          curl --fail --location --retry 3 --output "_site/media/${EXHIBITION_VIDEO_NAME}" "${EXHIBITION_VIDEO_URL}"
          echo "${EXHIBITION_VIDEO_SHA256}  _site/media/${EXHIBITION_VIDEO_NAME}" | sha256sum --check
          curl --fail --location --retry 3 --output "_site/media/${OPTIMIZED_VIDEO_NAME}" "${OPTIMIZED_VIDEO_URL}"
          echo "${OPTIMIZED_VIDEO_SHA256}  _site/media/${OPTIMIZED_VIDEO_NAME}" | sha256sum --check
          curl --fail --location --retry 3 --output "_site/media/${OPTIMIZED_MATCH_2_VIDEO_NAME}" "${OPTIMIZED_MATCH_2_VIDEO_URL}"
          echo "${OPTIMIZED_MATCH_2_VIDEO_SHA256}  _site/media/${OPTIMIZED_MATCH_2_VIDEO_NAME}" | sha256sum --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
